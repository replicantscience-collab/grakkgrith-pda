name: Check rules against the rulebook

on:
  push:
    paths: ['data/**', 'tools/check-rules.mjs', '.github/workflows/check-rules.yml']
  pull_request:
    paths: ['data/**', 'tools/check-rules.mjs', '.github/workflows/check-rules.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-rules.mjs
