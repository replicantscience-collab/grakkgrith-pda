E 37 ACCESS',454,168,'blocked'],['UPPER SPURS',558,78,'watched']],paths:['M76 236 C130 226 150 190 202 184','M202 184 C248 176 278 132 326 126','M326 126 C378 118 402 164 454 168','M454 168 C498 154 520 96 558 78'],notes:['Flood lamps still work at the sewer gate.','Murr Corridor is watched and chemically suspect.','Pipe 37 is marked as restricted after the last incident.']},pipe:{name:'Pipe 37 Marked Access',surface:'Mission access map',focus:'Entry / objective / exit with hazard notes',nodes:[['LOW HALO ENTRY',78,112,'open'],['SERVICE STAIRS',182,156,'open'],['METER ROOM',306,214,'watched'],['PIPE 37 BREACH',442,176,'blocked'],['DEEPER DRAIN',560,246,'blocked']],paths:['M78 112 C118 134 142 154 182 156','M182 156 C230 158 258 210 306 214','M306 214 C360 218 394 178 442 176','M442 176 C498 178 520 232 560 246'],notes:['Entry is visible but still deniable.','Meter room is the current decision point.','Breach and deeper drain should stay staff-controlled.']},after:{name:'Mission 2 Restriction Overlay',surface:'Changed-world overlay',focus:'Access closures, pressure, and consequence marks',nodes:[['COMMONS BYPASS',70,248,'open'],['WARDEN SEAL',196,214,'blocked'],['RADIO SEWERS',310,150,'open'],['CROWNLINE CHECK',446,108,'watched'],['OLD DRAIN LIE',566,172,'blocked']],paths:['M70 248 C116 232 150 220 196 214','M196 214 C244 206 266 158 310 150','M310 150 C362 142 400 112 446 108','M446 108 C496 106 526 158 566 172'],notes:['Bypass is open only through local trust.','Official seals do not match lived movement.','Crownline pressure is visible on route edges.']}};function loadMapState(){try{return JSON.parse(localStorage.getItem(MAP_KEY)||'null')||{profile:'low',seed:1}}catch(e){return{profile:'low',seed:1}}}function saveMapState(s){try{localStorage.setItem(MAP_KEY,JSON.stringify(s))}catch(e){}}function mapStatusClass(s){return s==='blocked'?'blocked':s==='watched'?'watched':'open'}function makeRouteMap(profileId,seed){const p=mapProfiles[profileId]||mapProfiles.low;let jitter=(seed||1)%17;let pipes=p.paths.map(function(d,i){return '<path class="pipe" d="'+d+'"></path><path class="route" d="'+d+'" style="stroke-dasharray:'+(i%2?12:0)+'"></path>'}).join('');let nodes=p.nodes.map(function(n,i){let x=n[1]+((jitter+i*3)%9-4);let y=n[2]+((jitter+i*5)%7-3);return '<g><circle class="'+mapStatusClass(n[3])+'" cx="'+x+'" cy="'+y+'" r="14"></circle><text x="'+(x+18)+'" y="'+(y+4)+'">'+n[0]+'</text><text class="nodeLabel" x="'+(x+18)+'" y="'+(y+20)+'">'+n[3].toUpperCase()+'</text></g>'}).join('');let status=p.nodes.reduce(function(a,n){a[n[3]]=(a[n[3]]||0)+1;return a},{open:0,watched:0,blocked:0});return '<div class="mapStage"><div class="mapToolbar"><button class="primary" data-map-generate="1">Generate Route Map</button><button data-map-profile="low">District Board</button><button data-map-profile="pipe">Pipe 37</button><button data-map-profile="after">Restriction Overlay</button></div><p><b>'+p.name+'</b> · '+p.focus+'</p><svg class="mapSvg" viewBox="0 0 640 320" role="img" aria-label="Generated '+p.name+' map"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(24,246,255,.08)"/></pattern></defs><rect width="640" height="320" fill="url(#grid)"></rect><rect x="18" y="18" width="604" height="284" rx="22" fill="none" stroke="rgba(255,225,75,.28)"></rect>'+pipes+nodes+'<text x="30" y="42">'+p.surface.toUpperCase()+'</text><text x="30" y="292">SEED '+seed+' / LOW HALO FIELD TRACE</text></svg><div class="mapReadout"><article class="mini"><h3>Route state</h3><p>'+status.open+' open · '+status.watched+' watched · '+status.blocked+' blocked</p></article><article class="mini"><h3>Map notes</h3><p>'+p.notes.join(' ')+'</p></article><article class="mini"><h3>Use in play</h3><p>Pick the surface, generate a fresh trace, then use watched/blocked nodes as mission pressure and fallout prompts.</p></article></div></div>'}function renderGeneratedMap(profile){const mount=document.getEleme nd job fallout move through first.">Main Roads</button><button class="cityPin mission" style="left:36%;top:40%" data-city-pin="LOW HALO" data-district-map="low-halo" onclick="showDistrictMap(&quot;low-halo&quot;)" data-city-note="Arts, music, resistance, chaos curated. This is the first-play focus: lived pressure, public memory, and routes below the official story.">Low Halo</button><button class="cityPin mission" style="left:49%;top:86%" data-city-pin="THE SEWERS" data-city-note="Underground community, hidden movement, warnings, labor, and shelter. Route truth lives here before it becomes a file.">Sewers</button><button class="cityPin" style="left:49%;top:32%" data-city-pin="CENTRAL CORE" data-city-note="Commerce, politics, control, transit for all. The official city explains itself from here.">Central Core</button><button class="cityPin" style="left:81%;top:18%" data-city-pin="CROWNLINE INDUSTRIALS" data-city-note="Profit, smoke, infrastructure leverage, and the corporate version of stability.">Crownline</button><button class="cityPin" style="left:62%;top:43%" data-city-pin="MARKET RING" data-city-note="Everything legal, everything negotiable, everything has a price. Good for contacts, gear, and favors with strings.">Market Ring</button><button class="cityPin" style="left:83%;top:64%" data-city-pin="ASH WASTES" data-city-note="Dead wind, dead things, stay out. Escalation space for fallout and dangerous edges of the map.">Ash Wastes</button><button class="cityPin" style="left:15%;top:14%" data-city-pin="NOBLE HEIGHTS" data-city-note="Old money and older bones. Access, memory, resentment, and institutions that do not forget.">Noble Heights</button><button class="cityPin area" style="left:50%;top:8%" data-city-pin="NEW HALO" data-city-note="The Shining Spire, aspirational skyline, prestige pressure, and the polished version of Adyta sold upward.">New Halo</button><button class="cityPin area" style="left:68%;top:14%" data-city-pin="GOVERNANCE DISTRICT" data-city-note="Paper, power, lies, civic channels, public authority, and procedures that decide who gets heard.">Governance</button><button class="cityPin area" style="left:31%;top:26%" data-city-pin="THREE SPIRES MONASTERY" data-city-note="Old gods, older secrets, and spiritual leverage that does not fit corporate reporting.">Three Spires</button><button class="cityPin area" style="left:18%;top:39%" data-city-pin="THE TANGLE" data-city-note="Goblin heartland, jury-rigged passages, clan memory, and routes official maps cannot admit.">The Tangle</button><button class="cityPin area" style="left:15%;top:52%" data-city-pin="THREE WIRES" data-city-note="Contact zone, hire here, retire there. A switchboard of favors, debts, and fast introductions.">Three Wires</button><button class="cityPin area" style="left:17%;top:64%" data-city-pin="OUTER FARMS" data-city-note="Scrap gangs, hunters, dustwalker goblins, and the edge where city logic starts to fail.">Outer Farms</button><button class="cityPin area" style="left:30%;top:65%" data-city-pin="BORDERLANDS" data-city-note="Law fades, survival sharpens, no promises. Good for crossings and deals nobody records.">Borderlands</button><button class="cityPin area" style="left:30%;top:51%" data-city-pin="GREASEWICK ROW" data-city-note="Machines, oil, fixers, goblin tech, and repair work that smells like debt and hot metal.">Greasewick</button><button class="cityPin area" style="left:45%;top:56%" data-city-pin="OLD CITY" data-city-note="Built on ruins, built over lies, still standing. Every wall remembers earlier arrangements.">Old City</button><button class="cityPin area" style="left:50%;top:42%" data-city-pin="EMBER COURT" data-city-note="Occult trade, legal-up-front, illegal behind curtains. Contracts have teeth here.">Ember Court</button><button class="cityPin area" style="left:67%;top:31%" data-city-pin="THE ASHRUN" data-city-note="Trade flows, waste flows, stories drown. Water routes carry more than freight.">The Ashrun</button><button class="cityPin area" style="left:82%;top:40%" data-city-pin="DOCKSIDE WAREHOUSES" data-city-note="Freight, smuggling, opportunity, tidecrew goblins, and records that may or may not exist.">Dockside</button><button class="cityPin area" style="left:92%;top:31%" data-city-pin="FAR SHIPYARDS" data-city-note="Build it, break it, sell it twice. Heavy industry at the edge of the harbor map.">Far Shipyards</button><button class="cityPin area" style="left:65%;top:56%" data-city-pin="SOUTHPORT SLUMS" data-city-note="Forgotten, abandoned, still surviving. The city forgets people here until it needs them moved.">Southport</button><button class="cityPin mission area" style="left:80%;top:55%" data-city-pin="SCRAPFIELDS" data-city-note="Pickers, scavengers, patchkin goblins, and useful things that refused to stay dead.">Scrapfields</button><button class="cityPin area" style="left:51%;top:64%" data-city-pin="S-INDUSTRIAL BELT" data-city-note="Smoke, steel, sweat, Ashborn goblins, dwarf strongholds, and work that changes bodies.">S-Industrial</button><button class="cityPin area" style="left:43%;top:95%" data-city-pin="DEEP TUNNELS" data-city-note="Forgotten infrastructure, still somewhere, below the readable city and above worse places.">Deep Tunnels</button><button class="cityPin area" style="left:64%;top:95%" data-city-pin="FORGOTTEN DEPTHS" data-city-note="Where maps stop and worse goes down. Use for deep fallout, lost systems, and hard choices.">Forgotten Depths</button><button class="cityPin area" style="left:16%;top:28%" data-city-pin="ELEVEN ENCLAVE" data-city-note="Established, elegant, eleven. An enclave of older status and polished exclusions.">Eleven Enclave</button><button class="cityPin area" style="left:21%;top:11%" data-city-pin="GRAND ACADEMY" data-city-note="Old money, older bones, older arrogance. Institutional memory with locked doors.">Grand Academy</button></div></div><div class="cityMapLegend"><div class="cityMapReadout"><b>PDA atlas</b><br>Sepia/emerald unofficial city surface built from the Adyta reference.</div><div class="cityMapReadout"><b>Route layer</b><br>Generated board below handles changing access, watched paths, and blocked nodes.</div><div class="cityMapReadout"><b>Canon layer</b><br>Districts, waterways, Crownline pressure, Sewers, and hidden route logic inform the overlay.</div><div class="cityMapReadout districtDossier" id="cityMapReadout"><b>Selected district</b><br>Click a map pin for a district dossier: mood, control, heat, hazards, factions, missions, and local wisdom.</div></div></div><div id="routeMapMount"><div class="mapStage"><div class="mapToolbar"><button class="primary" data-map-generate="1">Generate Route Map</button><button data-map-profile="low">District Board</button><button data-map-profile="pipe">Pipe 37</button><button data-map-profile="after">Restriction Overlay</button></div><p><b>Low Halo / Sewers</b> · Community-readable live route surface</p><svg class="mapSvg" viewBox="0 0 640 320" role="img" aria-label="Generated Low Halo / Sewers map"><rect width="640" height="320" fill="rgba(2,7,11,.68)"></rect><rect x="18" y="18" width="604" height="284" rx="22" fill="none" stroke="rgba(255,225,75,.28)"></rect><path class="pipe" d="M76 236 C130 226 150 190 202 184"></path><path class="route" d="M76 236 C130 226 150 190 202 184"></path><path class="pipe" d="M202 184 C248 176 278 132 326 126"></path><path class="route" d="M202 184 C248 176 278 132 326 126"></path><path class="pipe" d="M326 126 C378 118 402 164 454 168"></path><path class="route" d="M326 126 C378 118 402 164 454 168"></path><path class="pipe" d="M454 168 C498 154 520 96 558 78"></path><path class="route" d="M454 168 C498 154 520 96 558 78"></path><g><circle class="open" cx="76" cy="236" r="14"></circle><text x="94" y="240">SEWER GATE</text><text class="nodeLabel" x="94" y="256">OPEN</text></g><g><circle class="watched" cx="202" cy="184" r="14"></circle><text x="220" y="188">MURR CORRIDOR</text><text class="nodeLabel" x="220" y="204">WATCHED</text></g><g><circle class="open" cx="326" cy="126" r="14"></circle><text x="344" y="130">LOW HALO MARKET</text><text class="nodeLabel" x="344" y="146">OPEN</text></g><g><circle class="blocked" cx="454" cy="168" r="14"></circle><text x="472" y="172">PIPE 37 ACCESS</text><text class="nodeLabel" x="472" y="188">BLOCKED</text></g><g><circle class="watched" cx="558" cy="78" r="14"></circle><text x="438" y="82">UPPER SPURS</text><text class="nodeLabel" x="438" y="98">WATCHED</text></g><text x="30" y="42">DISTRICT ROUTE BOARD</text><text x="30" y="292">LOW HALO FIELD TRACE</text></svg><div class="mapReadout"><article class="mini"><h3>Route state</h3><p>2 open · 2 watched · 1 blocked</p></article><article class="mini"><h3>Map notes</h3><p>Flood lamps still work at the sewer gate. Murr Corridor is watched. Pipe 37 is restricted.</p></article><article class="mini"><h3>Use in play</h3><p>Generate a fresh trace, then use watched/blocked nodes as mission pressure and fallout prompts.</p></article></div></div></div><div class="cards"><div class="mini"><h3>Low Halo</h3><p>Civic neglect zone. Visible, lived-in, politically sensitive, already under pressure before any mission starts.</p><span class="tag danger">PUBLIC PRESSURE</span></div><div class="mini"><h3>The Sewers</h3><p>Lived underground space: routes, labor, warnings, hidden logistics, shelter, and local memory.</p><span class="tag">ROUTES MATTER</span></div><div class="mini"><h3>Deeper Sewers</h3><p>Wrongness, hidden infrastructure, buried consequence. The place where Pipe 37 starts to bite.</p><span class="tag danger">CONTROLLED ACCESS</span></div></div><h3>Player read</h3><ul><li>The public story, official file story, route story, and lived local story rarely match.</li><li>Choices affect who gets blamed, which routes close, and whether truth becomes care, panic, or cover-up.</li><li>Low Halo remembers who treated it like home and who treated it like a job site.</li></ul>',missions:'<h1>Missions</h1><p>Missions are the engine of play: a problem surfaces, the crew chooses how to enter it, the city reacts, and the result becomes Heat, Standing, route changes, evidence, debt, and new jobs. Select a board entry to open the operation brief.</p><div class="missionPrimer"><div class="mini"><h3>1. Read the job</h3><p>Confirm client, objective, known risk, payment, location, and what happens if nobody acts.</p><span class="tag live">BRIEF</span></div><div class="mini"><h3>2. Choose approach</h3><p>Quiet, loud, official, local, surgical, public, or sideways. The approach decides which factions notice first.</p><span class="tag">CREW CALL</span></div><div class="mini"><h3>3. Log fallout</h3><p>After the scene, record Heat, Standing, evidence, routes closed, favors owed, and who now controls the story.</p><span class="tag danger">CONSEQUENCE</span></div></div><div class="opbar"><b>Player post shape:</b> INTENT, APPROACH, MECHANIC if obvious, PUSH if needed, BACKUP if it goes wrong.</div><div id="activeOp"></div><div class="missionLayout"><div id="missionList"></div><div class="brief" id="missionBrief"></div></div>',factions:'<h1>Factions</h1><p>Faction play is a pressure map, not a static reputation screen. When the crew touches one faction, another linked faction should benefit, react, contest, or exploit the opening.</p><div class="opbar"><b>Table read:</b> ask what a faction protects, what it controls, what success costs, and who pays when it gets its way.</div><div class="matrix"><div class="mini"><h3>Corporate stability bloc</h3><p>Crownline, Bastion, Helix, Meridian, Velvet Signal. Access, force, dependency, movement, and narrative control.</p><span class="tag danger">ORDER</span><span class="tag">ACCESS</span></div><div class="mini"><h3>Civic compromise chain</h3><p>Wardens, ABI, Public Advocacy, Civil Registry, Labor Board, Emergency Management. Procedure, files, calm, and contested harm.</p><span class="tag">PROCEDURE</span><span class="tag">RECORDS</span></div><div class="mini"><h3>Commons survival mesh</h3><p>Tangle, Sewers Community, Radio Sewers, Underground, Antitoxin, Patchkin. Routes, warning, shelter, hazard truth, and salvage life.</p><span class="tag live">SURVIVAL</span><span class="tag">LOCAL TRUST</span></div></div><h3>Early pressure factions</h3><div class="cards"><div class="mini"><h3>Antitoxin</h3><p>Low Halo hazard-response survivors. They want contamination truth, protected residents, useful evidence, and care that does not become another cover-up.</p><span class="tag live">CARE UNDER PRESSURE</span></div><div class="mini"><h3>ACW / Wardens</h3><p>Civic response and public order. They want deaths prevented, panic contained, and a solution they do not have to explain upward as failure.</p><span class="tag">PERIMETER</span></div><div class="mini"><h3>ABI</h3><p>Investigators who turn weird trouble into named cases. They want attribution, evidence chains, and a version of events that survives scrutiny.</p><span class="tag danger">CASE MEMORY</span></div><div class="mini"><h3>Sewers Community</h3><p>Lived undercity network, not empty monster space. They want routes usable, home protected, lockdowns avoided, and respect for who already lives below.</p><span class="tag live">ROUTES / HOME</span></div><div class="mini"><h3>Radio Sewers</h3><p>Warning, rumor, signal, and community logistics. They move truth sideways when official channels would turn it into pressure.</p><span class="tag">SIGNAL</span></div><div class="mini"><h3>Patchkin / Gremlin Works</h3><p>Salvage life, repair culture, and useful things that refused to stay dead. They know what still sparks and who claims abandoned systems.</p><span class="tag">SALVAGE</span></div></div><h3>Relationship web</h3><div class="matrix"><div class="mini"><h3>Low Halo spine</h3><p>Ma Pell, Rook Marrow, Mags Clatter, Mira Voss, Milo Thistlehop, and Drip form the first social map: food, venues, signal, print, routes, and who still shows up alive.</p></div><div class="mini"><h3>Official threat with a face</h3><p>Josh Peterson is useful as the smiling institutional danger: cleanup language, official liaison pressure, and the person who wants the neat version.</p></div><div class="mini"><h3>Sideways connectors</h3><p>Baba Varka, Raven Bloodshadow, and Glitch connect private needs, occult truth, leak culture, and stories that cannot move through polite channels.</p></div></div><h3>Major fault lines</h3><ul><li><b>Infrastructure vs salvage:</b> who gets to call a broken system abandoned, illegal, or still owed.</li><li><b>Hazard truth vs cleanup narrative:</b> contamination and medical scandal versus public control.</li><li><b>Documentation vs hidden survival:</b> whether people can stay off-map and still live.</li><li><b>Order vs care:</b> whether the immediate goal is calm, protection, evidence, or liability management.</li></ul><h3>Use at the table</h3><div class="cards"><div class="mini"><h3>If the crew helps a faction</h3><p>Raise trust with that faction, then pick one linked faction that worries, contests, or tries to exploit the opening.</p></div><div class="mini"><h3>If the crew burns a faction</h3><p>Mark who remembers, what route closes, what file opens, and what favor becomes harder to ask for later.</p></div><div class="mini"><h3>If nobody knows what happens next</h3><p>Ask: who benefits if this becomes quiet, who benefits if it becomes public, and who gets hurt either way?</p></div></div><div class="actions"><button class="primary" data-action="missions">Open Missions</button><button data-action="logs">Send To Logs</button><button data-action="back-city">Open City Atlas</button></div>',lore:'<h1>Lore</h1><p>This section is the player-facing canon brief for GRAKKGRITH: what Adyta feels like, what the city assumes, what players need to know before posting, and what should stay true when missions get messy.</p><div class="opbar"><b>Core premise:</b> Adyta is a layered urban-fantasy city where magic, tech, money, civic procedure, and local survival collide. The game is about taking dangerous work without letting the city turn people into paperwork.</div><div class="cards"><div class="mini"><h3>Adyta is layered</h3><p>Surface streets, official transit, service corridors, rooftops, drains, sealed rooms, old infrastructure, and lived routes all exist at once. The official map is useful, but never complete.</p><span class="tag live">CITY TRUTH</span></div><div class="mini"><h3>Systems have owners</h3><p>Every camera, road, ward, clinic file, access panel, contract, implant, spell, and service line belongs to someone or something. Using power means touching ownership.</p><span class="tag danger">LEVERAGE</span></div><div class="mini"><h3>Communities remember</h3><p>Low Halo, the Sewers, the Tangle, Scrapfields, and other lived places remember who helped, who extracted, who lied, and who came back after the job ended.</p><span class="tag">GRITH</span></div></div><h3>What players should know</h3><ul><li><b>You are not expected to know everything.</b> Clear intent, respect for local stakes, and willingness to face fallout matter more than perfect lore recall.</li><li><b>Jobs are never just jobs.</b> A mission can change routes, public blame, faction standing, evidence, treatment access, and who feels safe moving through the city.</li><li><b>Truth has delivery costs.</b> Revealing the right fact to the wrong power can hurt the people the crew meant to protect.</li><li><b>Magic and tech are normal, but not clean.</b> Both leave traces, costs, witnesses, dependencies, meanings, and debts.</li><li><b>Local ties matter.</b> A contact, anchor, meal counter, route guide, clinic shelf, or radio warning can matter as much as a weapon.</li></ul><h3>City truths</h3><div class="matrix"><div class="mini"><h3>Official truth</h3><p>Permits, incident reports, civic files, infrastructure claims, liability language, sealed zones, and public calm. It is powerful because it can decide what counts.</p></div><div class="mini"><h3>Route truth</h3><p>Who can actually move, which doors open, which corridors are watched, which shortcuts are poisoned, and which safe paths only exist because locals maintain them.</p></div><div class="mini"><h3>Lived truth</h3><p>Who was there, who got sick, who did not come home, who warned people first, who profited, and what residents know before the paperwork catches up.</p></div></div><h3>Major peoples and pressure groups</h3><div class="cards"><div class="mini"><h3>Goblin cultures</h3><p>Patchkin, gremlins, dustwalkers, tidecrew, Ashborn, and Tangle families appear across salvage, repair, routes, labor, ships, scrap, and community memory. Do not reduce them to jokes or pests.</p></div><div class="mini"><h3>Dwarven strongholds</h3><p>Industrial, craft, labor, infrastructure, old obligation, hard bargains, and community protection. A stronghold can be workplace, family, fortress, union, and archive.</p></div><div class="mini"><h3>Elven and old-money enclaves</h3><p>Elegant, institutional, historical, exclusionary, and complicated. Polished spaces can hide old debts, old bones, and old control.</p></div><div class="mini"><h3>Commons networks</h3><p>Residents, route keepers, Radio Sewers, Antitoxin, venues, clinics, kitchens, signal booths, and people who keep each other alive when official help arrives late.</p></div><div class="mini"><h3>Civic machinery</h3><p>Wardens, ABI, Civil Registry, Public Advocacy, Labor Board, Emergency Management, and procedure chains that can protect people or convert harm into a file.</p></div><div class="mini"><h3>Corporate blocs</h3><p>Crownline, Bastion, Helix, Meridian, narrative brokers, and infrastructure owners who sell stability, access, force, treatment, mobility, and dependency.</p></div></div><h3>Tone guide</h3><div class="cards"><div class="mini"><h3>Use</h3><p>Neon occult city texture, dangerous work, local care, gallows humor, messy bargains, street-level consequences, flawed allies, and systems with human faces.</p></div><div class="mini"><h3>Avoid</h3><p>Empty monster neighborhoods, consequence-free power fantasy, treating poverty as scenery, joke cultures, clean cops, perfect rebels, and lore dumps that block play.</p></div><div class="mini"><h3>Ask at the table</h3><p>Who does this help? Who notices? What route changes? What file opens? Who has to live with the answer after the crew leaves?</p></div></div><h3>Canon levels</h3><div class="matrix"><div class="mini"><h3>Soft canon</h3><p>Useful texture, rumors, player proposals, neighborhood color, and ideas that can be adjusted before they affect major play.</p></div><div class="mini"><h3>Operational canon</h3><p>Details used in missions, downtime, faction moves, route maps, player anchors, and active consequences.</p></div><div class="mini"><h3>Locked canon</h3><p>Facts cemented by play: deaths, exposed evidence, burned routes, public scandals, major faction shifts, and promises the table has already made real.</p></div></div><h3>How to write in-world</h3><div class="opbar"><b>Post shape:</b> I want to change ___ by using ___ . I am protecting ___ . I accept the risk of ___ . If this becomes public, I want ___ to be true.</div><ul><li>Keep action posts grounded in a place, person, route, tool, or pressure.</li><li>When adding lore, give it one use in play and one vulnerability.</li><li>When unsure, start local: a door, a witness, a warning, a bill, a clinic, a route, a voice on the radio.</li></ul><div class="actions"><button class="primary" onclick="showPanel(&quot;city&quot;)">Open City Atlas</button><button onclick="showPanel(&quot;factions&quot;)">Open Factions</button><button onclick="showPanel(&quot;missions&quot;)">Open Missions</button></div>',downtime:'<h1>Downtime / Logs</h1><p>This is the persistent memory of play: heat, standing, grith, routes burned, obligations owed, recovery, projects, and session fallout. It is built to produce a clean Discord post first, then keep a local archive.</p><div id="logsMount"></div>',character:'<h1>Character</h1><p>The existing creator and playable sheet remain the operative core. The world hub now treats that character as the access key into Adyta rather than the whole product.</p><div class="actions"><button class="primary" data-action="sheet">Enter Character Sheet</button><button data-action="creator">Character Setup</button></div><h3>Current operative</h3><p>${name}</p><p>${has?'Saved character data is available.':'No saved operative yet. Create one to start binding world state to a person.'}</p>',quickstart:'<h1>Player Quickstart</h1><p>GRAKKGRITH is a Discord-first urban-fantasy mission RPG about dangerous jobs, hostile systems, local loyalties, and consequences that do not go away when the scene ends.</p><div class="cards"><div class="mini"><h3>What you do</h3><ul><li>Take dangerous work.</li><li>Make hard calls under pressure.</li><li>Decide who you protect.</li><li>Survive fallout and live with what the city remembers.</li></ul></div><div class="mini"><h3>Mission loop</h3><ol><li>Job appears.</li><li>Crew chooses approach.</li><li>Gather info and plan.</li><li>Post actions in Discord.</li><li>GM resolves outcomes.</li><li>Fallout and downtime change the city.</li></ol></div><div class="mini"><h3>Good action post</h3><p><b>INTENT:</b> what I want.<br><b>APPROACH:</b> how I do it.<br><b>MECHANIC:</b> if obvious.<br><b>BACKUP:</b> what I do if it goes badly.</p></div></div><h3>Before session one</h3><ul><li>Know who your character is and why they take bad work anyway.</li><li>Know what they protect, what risk they accept, and where they feel at home.</li><li>You do not need perfect knowledge. You need clear intent and willingness to live with what happens next.</li></ul>',rules:'<h1>Rules Reference</h1><div class="cards"><div class="mini"><h3>Core roll</h3><p>Roll d6s equal to <b>Attribute + Skill</b>. Every <b>5 or 6</b> is 1 success.</p><p>1 routine · 2 challenging · 3 hard · 4 severe · 5 legendary.</p></div><div class="mini"><h3>Push / Stress</h3><p>Push once per roll: take <b>1 Stress</b> and roll <b>+2 dice</b>.</p><p>You can always try harder, but trying harder hurts.</p></div><div class="mini"><h3>Turns</h3><p><b>Soft turns</b>: investigation, movement, social, setup, problem solving.</p><p><b>Hard turns</b>: combat or timing-critical pressure. Usually 1 Action, 1 Move, 1 React.</p></div></div><h3>Results and fallout</h3><ul><li>Full success: clean result. Partial success: result with cost. Failure: situation worsens. Critical: strong upside.</li><li>Fallout reports objective result, payment, Heat, Standing, injuries, open problems, and downtime access.</li><li>Heat is the city remembering you. Standing is faction relationship. Grith is where you actually belong.</li></ul>',fullrules:'<h1>Full Rules</h1><p>This is the expanded table reference: use it when the quick Rules Reference is not enough and you need the full shape of play in one place.</p><div class="cards"><div class="mini"><h3>1. State intent</h3><p>Say what you want to change in the fiction. Clear intent matters more than naming a rule first.</p></div><div class="mini"><h3>2. Choose approach</h3><p>Name how you do it: force, speed, skill, social pressure, magic, tech, route knowledge, leverage, or a hybrid.</p></div><div class="mini"><h3>3. Resolve consequence</h3><p>A result changes the scene and may also change Heat, Standing, route access, harm, debt, evidence, or who remembers you.</p></div></div><h3>Core roll</h3><ul><li>Roll d6s equal to <b>Attribute + Skill</b>.</li><li>Every <b>5 or 6</b> is one success.</li><li>Difficulty usually needs: 1 routine, 2 challenging, 3 hard, 4 severe, 5 legendary.</li><li>If no roll is needed, the GM should say what happens and move forward.</li></ul><h3>Push, Stress, and risk</h3><ul><li>You may Push once per roll: take <b>1 Stress</b> and add <b>+2 dice</b>.</li><li>Stress is pressure on body, nerves, spirit, focus, luck, or social endurance.</li><li>Stress should matter in play. It is not just a currency; it is the sound of the character fraying.</li><li>A Push means you tried harder, louder, deeper, faster, or more dangerously than was safe.</li></ul><h3>Turns and actions</h3><div class="cards"><div class="mini"><h3>Soft turns</h3><p>Investigation, social play, planning, movement, setup, recovery, searching, repair, and low-pressure problem solving.</p></div><div class="mini"><h3>Hard turns</h3><p>Combat, chase, countdown, hazard, active intrusion, or any moment where timing and reactions matter.</p></div><div class="mini"><h3>Typical hard turn</h3><p>Usually 1 Action, 1 Move, and 1 React when the fiction allows it. The scene decides what counts.</p></div></div><h3>Results</h3><ul><li><b>Full success:</b> you get what you wanted cleanly or close to cleanly.</li><li><b>Partial success:</b> you get it with cost, exposure, harm, delay, debt, Heat, trace, or a hard choice.</li><li><b>Failure:</b> the situation worsens, the opposition acts, or the cost arrives before the benefit.</li><li><b>Critical / strong success:</b> strong upside, extra effect, faster timing, reduced cost, or advantage carried forward.</li></ul><h3>Harm, recovery, and conditions</h3><ul><li>Harm can be physical, magical, neural, emotional, social, legal, reputational, or environmental.</li><li>Injuries and conditions should tell the table what is harder now, not just subtract points.</li><li>Recovery takes time, help, gear, shelter, medical care, magic, or a safe place that might itself become threatened.</li><li>If a character is Critical, the scene should care immediately.</li></ul><h3>Heat, Standing, and Grith</h3><div class="cards"><div class="mini"><h3>Heat</h3><p>Heat is who noticed, what file opened, what rumor spread, what route got watched, and what pressure follows.</p></div><div class="mini"><h3>Standing</h3><p>Standing is relationship with factions, communities, institutions, crews, and people who can help or hurt you later.</p></div><div class="mini"><h3>Grith</h3><p>Grith is where you actually belong. It is local trust, lived connection, obligation, recognition, and home pressure.</p></div></div><h3>Downtime</h3><ul><li>Use downtime to recover, repair, investigate, train, build, work contacts, pay debts, reduce pressure, or start projects.</li><li>Downtime should create new hooks as often as it solves old problems.</li><li>Projects need a clear goal, method, material or access, and a reason someone might care.</li></ul><h3>Magic and Tech rules of thumb</h3><ul><li>Tools do not skip consequences. They choose which consequences are likely.</li><li>Tech leaves logs, dependencies, access trails, ownership conflicts, bills, and failure points.</li><li>Magic leaves resonance, meaning, debt, attention, contamination, oaths, echoes, or spiritual traces.</li><li>Hybrid magic-tech actions can be powerful, but should be messy, traceable, or costly.</li></ul><h3>Best action post</h3><div class="opbar"><b>Template:</b> I want to ___ by using ___ . I am willing to risk ___ . If it goes wrong, I am watching for ___ .</div>',build:'<h1>Character Build Guide</h1><p>For first launch, characters enter through one of three lanes. If you are unsure which lane applies, ask before building.</p><div class="cards"><div class="mini"><h3>1. Pregen</h3><p>Ready-to-play character for learning through play. Still know what they want, protect, and risk.</p></div><div class="mini"><h3>2. Approved build</h3><p>Use the Character Tool when staff says approved builds are open. Tool access is not automatic approval.</p></div><div class="mini"><h3>3. Staff-assisted concept</h3><p>For a strong idea that fits tone but needs review inside first-playtest limits.</p></div></div><h3>Mission-entry readiness</h3><ul><li>Correct character lane confirmed.</li><li>Finished sheet or approved build state.</li><li>Reason your character is on this job.</li><li>Basic understanding of Heat, Standing, Grith, and Discord posting format.</li><li>One reason to be here, one pressure point, one local tie, one useful thing, and one trouble hook.</li></ul>',anchors:'<h1>Player Anchors</h1><p>An anchor is a place your character or crew cares about, uses, protects, works from, or keeps returning to. It can be a shop, house, hideout, lab, clinic corner, stall, route cache, workshop, bunkroom, shrine, office, garage, or any other local place that makes the city personal.</p><div class="opbar"><b>Core rule:</b> an anchor gives fictional leverage, not automatic safety. It should be useful enough to matter and vulnerable enough to become part of play.</div><div class="cards"><div class="mini"><h3>Good anchor</h3><ul><li>Local and specific.</li><li>Useful but vulnerable.</li><li>Staff-approved.</li><li>Connected to downtime, Heat, Standing, or neighborhood fallout.</li></ul></div><div class="mini"><h3>Bad anchor</h3><ul><li>Free gear machine.</li><li>Automatic immunity.</li><li>Private empire.</li><li>Faction rewrite.</li><li>No pressure attached.</li></ul></div><div class="mini"><h3>Starting scope</h3><p>Begin small: one shared crew anchor, plus zero to two player-linked shops, houses, workspaces, stalls, caches, or side rooms.</p><span class="tag">SOFT CANON FIRST</span></div></div><h3>Anchor types players can propose</h3><div class="cards"><div class="mini"><h3>Shop / stall</h3><p>A street counter, salvage stall, occult shop, repair window, clinic shelf, food stand, pawn table, or back-room service.</p><p><b>Useful:</b> rumor, supplies, trade, introductions, minor repairs. <b>Pressure:</b> permits, bad buyers, protection costs, watched customers.</p></div><div class="mini"><h3>House / room</h3><p>A rented room, shared flat, family place, bunkroom, squat, basement, converted office, or someone\\'s couch that is not as safe as it looks.</p><p><b>Useful:</b> rest, personal scenes, storing ordinary things, being found by people who know you. <b>Pressure:</b> neighbors, rent, raids, relatives, Heat following you home.</p></div><div class="mini"><h3>Hideout / bolt-hole</h3><p>A short-term safe spot, roof access room, waterproof stash, route alcove, sewer-side bunk, old utility closet, or emergency exit point.</p><p><b>Useful:</b> lay low briefly, stash evidence, recover after trouble. <b>Pressure:</b> limited supplies, compromised route, one watched door, someone else knows.</p></div><div class="mini"><h3>Lab / workshop</h3><p>A maker bench, chemistry sink, spell table, drone rack, cyberware chair, field clinic, murr-marked testing corner, or illegal diagnostics nook.</p><p><b>Useful:</b> experiments, repairs, analysis, risky treatment. <b>Pressure:</b> fumes, bad power, missing parts, records, contamination, things that should not wake up.</p></div><div class="mini"><h3>Community place</h3><p>A diner booth, venue corner, shrine step, route-warning board, union desk, print room, signal booth, or regular back table.</p><p><b>Useful:</b> contacts, local warnings, social cover, public memory. <b>Pressure:</b> public witnesses, faction attention, gossip, people who need help now.</p></div><div class="mini"><h3>Mobile / hidden anchor</h3><p>A cart, van, trunk cache, route kit, marked ladder, movable workbench, or coded dead drop.</p><p><b>Useful:</b> flexible access, delivery, surprise, emergency movement. <b>Pressure:</b> fuel, storage, theft, tracking, fragile secrecy.</p></div></div><h3>Submission template</h3><div class="cards"><div class="mini"><h3>Basics</h3><ul><li><b>Name:</b> what people call it.</li><li><b>Type:</b> shop / house / hideout / lab / base / stall / cache / other.</li><li><b>District:</b> where it sits and what route reaches it.</li><li><b>Owner / keeper:</b> who runs it day to day.</li><li><b>Access:</b> who is allowed in and who is not.</li></ul></div><div class="mini"><h3>Function</h3><ul><li><b>What it does well:</b> one clear useful angle.</li><li><b>What it is short on:</b> money, power, space, medicine, parts, patience.</li><li><b>What it feels like:</b> look, sound, smell, regulars, marks, bad lighting.</li><li><b>Downtime use:</b> recovery, repair, research, rumors, hiding, meetings, prep.</li></ul></div><div class="mini"><h3>Pressure</h3><ul><li><b>What can go wrong:</b> one concrete liability.</li><li><b>Who protects it:</b> if anyone.</li><li><b>Who pressures it:</b> landlord, Crownline, gang, family, buyer, inspector, ghost.</li><li><b>One rumor:</b> true, false, or dangerous to check.</li><li><b>One need:</b> what it needs right now.</li></ul></div></div><h3>Quick pitch format</h3><div class="opbar"><b>Copy this:</b> I want to add [anchor name], a [type] in [district/route]. It helps with [one useful angle], but it is vulnerable because [one liability]. It is connected to [person/faction/regulars], and right now it needs [immediate hook].</div><div class="cards"><div class="mini"><h3>Shop pitch</h3><p>I want to add <b>Last Light Counter</b>, a half-legal repair shop on the Low Halo edge. It helps with ugly field repairs and rumor from people waiting for parts, but it is vulnerable because Crownline compliance has already photographed the front door. It is connected to Patchkin regulars, and right now it needs clean wire before the next outage.</p></div><div class="mini"><h3>House pitch</h3><p>I want to add <b>Room 6 Over Boil & Bite</b>, a cramped rented room above a noodle place. It helps with recovery scenes and hearing neighborhood trouble early, but it is vulnerable because everybody downstairs knows who comes and goes. It is connected to the late-night staff, and right now it needs the rent covered before the landlord sells the lock code.</p></div><div class="mini"><h3>Lab pitch</h3><p>I want to add <b>The Blue Sink</b>, a basement lab behind a closed laundromat. It helps with contamination tests and cursed-device diagnostics, but it is vulnerable because the drain sometimes answers back. It is connected to Antitoxin and a nervous landlord, and right now it needs a safer disposal route.</p></div></div><h3>What anchors can do</h3><ul><li>Justify downtime scenes, rumor sources, gear patches, short-term hiding, local warnings, meetings, research, and threatened places when Heat rises.</li><li>Make fallout concrete: a raid hits a door, a supplier vanishes, a landlord folds, a route closes, a neighbor asks why trouble follows you.</li><li>Give the GM places to bring back without making the character invincible or rich.</li></ul><h3>What anchors cannot do by default</h3><ul><li>Erase Heat, override faction hostility, produce limitless money, grant unrestricted gear, ignore law or debt, replace a mission roll, or make the crew immune to consequences.</li><li>If the anchor helps, it should also create obligation, attention, shortage, visibility, or vulnerability.</li></ul><h3>Approval states</h3><div class="cards"><div class="mini"><h3>Soft Canon</h3><p>Approved as a local texture or usable rumor. Most anchors start here.</p></div><div class="mini"><h3>Operational Canon</h3><p>Used in live scenes, downtime, mission prep, or fallout posts.</p></div><div class="mini"><h3>Locked Canon</h3><p>Cemented by mission consequence, repeated use, or long-term campaign change.</p></div></div><h3>Artifact hooks</h3><p>Good anchors can become props: a shop sheet, rent notice, permit, route warning board, repair tag, bad-buyer list, map mark, ledger scrap, open/closed sign, lab label, voicemail transcript, citation, or handwritten house rule.</p>',cybernetics:'<h1>Magic and Tech</h1><p>Adyta does not separate magic from technology cleanly. Spells, signals, cybernetics, old infrastructure, wards, drones, bodyware, contracts, and broken civic systems all share the same streets. Treat them as tools with costs, witnesses, owners, and fallout.</p><div class="opbar"><b>Fast rule:</b> describe the change you want, name the source you are using, and say what risk you accept. Specific intent beats vague power use.</div><h3>What can I try?</h3><div class="cards"><div class="mini"><h3>Spellwork</h3><p>Wards, hexes, resonance reads, binding, masking, ritual pressure, spirit contact, luck bends, and echo work.</p><span class="tag">COST</span><span class="tag">RESONANCE</span></div><div class="mini"><h3>Hacking and devices</h3><p>Cameras, locks, terminals, comms, drones, spoofing, diagnostics, forged records, signal jamming, and access control.</p><span class="tag">TRACE</span><span class="tag">ACCESS</span></div><div class="mini"><h3>Cybernetics</h3><p>Neuraljacks, prosthetics, sensory rigs, reflexware, bodyware, memory ports, medical chrome, and work-installed hardware.</p><span class="tag">MAINTENANCE</span><span class="tag">EXPLOIT</span></div><div class="mini"><h3>Hybrid actions</h3><p>Haunted systems, warded hardware, spell-carried signals, cursed data, ritualized machines, and machines that learned meaning.</p><span class="tag danger">MESSY</span><span class="tag">POWERFUL</span></div><div class="mini"><h3>Social leverage</h3><p>Permissions, contracts, service subscriptions, clinic records, firmware, union tools, black-market keys, and favors with strings.</p><span class="tag">OWNERSHIP</span></div><div class="mini"><h3>Field improvisation</h3><p>Broken panels, street shrines, salvaged relays, blood on copper, old passwords, borrowed drones, and half-working civic systems.</p><span class="tag live">CREATIVE</span></div></div><div class="cards"><div class="mini"><h3>For players</h3><ul><li>Say what you want the tool to accomplish, not just what button you press.</li><li>Name the source: spell, device, implant, ritual, hacked system, or hybrid method.</li><li>Expect cost, trace, attention, instability, obligation, or collateral pressure.</li></ul></div><div class="mini"><h3>Magic</h3><p>Magic is relationship, resonance, threshold, debt, pattern, death, memory, oath, ward, or signal. It is rarely clean energy. It leaves meaning behind.</p></div><div class="mini"><h3>Tech</h3><p>Tech is access, maintenance, surveillance, dependency, leverage, bandwidth, power, logistics, and ownership. If it connects, someone can watch, bill, break, or lock it.</p></div></div><h3>Player action menu</h3><div class="matrix"><div class="mini"><h3>Magic approaches</h3><p>Ward, read, bind, mask, break, bargain, echo, cleanse, curse, open, seal, draw attention, or hide meaning.</p></div><div class="mini"><h3>Tech approaches</h3><p>Spoof, patch, scan, jam, override, trace, forge, decrypt, route, bridge, monitor, isolate, or burn access.</p></div><div class="mini"><h3>Hybrid approaches</h3><p>Ground, channel, filter, translate, contain, sync, anchor, bleed, loop, quarantine, or make one system lie to another.</p></div></div><h3>Common player tools</h3><div class="cards"><div class="mini"><h3>Spells and workings</h3><p>Use for wards, hexes, reading layers, contacting echoes, binding terms, hiding traces, pushing luck, and changing how a scene feels.</p><span class="tag">COST</span><span class="tag">RESONANCE</span></div><div class="mini"><h3>Devices and hacks</h3><p>Use for locks, cameras, drones, terminals, comms, maps, diagnostics, forged records, spoofed access, and signal control.</p><span class="tag">TRACE</span><span class="tag">ACCESS</span></div><div class="mini"><h3>Cybernetics</h3><p>Chrome solves a body or interface problem, then makes your nerves part of a system: neuraljacks, bodyware, prosthetics, sensory rigs, reflex hardware, memory ports.</p><span class="tag">MAINTENANCE</span><span class="tag">EXPLOIT</span></div></div><h3>When magic and tech overlap</h3><ul><li><b>Interference:</b> strong magic near active electronics or implants can cause static, pain, false readings, stalls, shutdowns, ghost signals, or corrupted logs.</li><li><b>Amplification:</b> tech can carry a magical signal farther than intended; magic can make a device matter in ways its manufacturer never designed.</li><li><b>Contamination:</b> a hacked ward, haunted camera, cursed implant, oath-bound contract file, or spell-touched drone creates both mechanical and social consequences.</li><li><b>Evidence:</b> tech leaves logs; magic leaves resonance. Either can be hidden, spoofed, or misread, but neither is automatically invisible.</li></ul><h3>Risk and fallout menu</h3><div class="cards"><div class="mini"><h3>Magic costs</h3><p>Stress, resonance, spiritual attention, oath pressure, sympathetic backlash, contamination, misread omens, or something old recognizing you.</p></div><div class="mini"><h3>Tech costs</h3><p>Logs, alarms, account flags, access revocation, firmware locks, battery drain, broken gear, owner retaliation, subscription debt, or compromised location.</p></div><div class="mini"><h3>Cybernetic costs</h3><p>Nerve feedback, pain, calibration drift, maintenance debt, exploit exposure, medical flags, proprietary locks, or someone else learning your interface habits.</p></div></div><h3>Outcome guide</h3><div class="matrix"><div class="mini"><h3>Clean success</h3><p>You get the intended change and choose one useful detail: faster, quieter, less trace, extra read, safer route, or better positioning.</p></div><div class="mini"><h3>Success with cost</h3><p>You get the change, but the table picks a cost: Stress, Heat, trace, delay, instability, debt, collateral harm, or a new witness.</p></div><div class="mini"><h3>Miss or bad bargain</h3><p>The system answers back: the ward bites, the device locks, the owner notices, the spirit follows, the implant hurts, or the scene escalates.</p></div></div><h3>How to ask at the table</h3><div class="opbar"><b>Use this shape:</b> I want to ___ by using ___ . I am willing to risk ___ . If it goes wrong, I am watching for ___ .</div><div class="cards"><div class="mini"><h3>Good ask</h3><p>I want to open the service door by spoofing the maintenance panel with my neuraljack. I will risk feedback or a trace. If it goes wrong, I watch for a silent alarm.</p></div><div class="mini"><h3>Good ask</h3><p>I want to ward the stairwell long enough for the crew to leave. I will risk Stress or an obvious magical signature. If it goes wrong, I watch for the ward grabbing the wrong person.</p></div><div class="mini"><h3>Good ask</h3><p>I want to run a cleansing pulse through the haunted camera network. I will risk corrupting the footage or making the spirit notice my signal.</p></div><div class="mini"><h3>Good ask</h3><p>I want to scan the implant signature without touching the patient file. I will risk a partial read or leaving a clinic-side access ping.</p></div><div class="mini"><h3>Good ask</h3><p>I want to bind the drone to the street shrine for one minute so it watches the wrong alley. I will risk shrine debt or a visible glitch.</p></div><div class="mini"><h3>Weak ask</h3><p>I use magic/tech to solve it. This does not say what changes, what tool is involved, or what kind of fallout makes sense.</p></div></div><h3>Cybernetics notes</h3><ul><li>Chrome signals treatment, debt, labor, violence, status, desperation, survival, or corporate leverage.</li><li>A neuraljack is an interface, not permission. You still need access, proximity, credentials, leverage, or a good plan.</li><li>Before asking for chrome, know what it cost, who maintains it, who can exploit it, and what it says about your character.</li><li>Cybernetics are not just upgrades. They can be medical survival, workplace injury, black-market adaptation, debt, identity, disability access, status, or a system someone installed into your life.</li><li>If your chrome talks to the world, the world may talk back: clinics, employers, hackers, spirits, warranties, firmware, and old trauma can all become relevant.</li></ul><h3>Ruling principles</h3><div class="cards"><div class="mini"><h3>Tools create angles</h3><p>Magic, tech, and chrome do not skip the scene. They open approaches, reveal costs, change who notices, and decide what kind of problem remains.</p></div><div class="mini"><h3>Specific beats broad</h3><p>A small clear effect is easier to approve than a vague big one. Name target, method, range, duration, and acceptable risk when stakes are high.</p></div><div class="mini"><h3>Power has ownership</h3><p>Ask who built it, taught it, maintains it, profits from it, fears it, worships it, or wants it back.</p></div><div class="mini"><h3>Fallout should fit</h3><p>Tech fallout should feel like systems and access. Magic fallout should feel like meaning and resonance. Hybrid fallout should feel like both arguing.</p></div><div class="mini"><h3>Consent matters</h3><p>Bodyware, mindware, memory work, spirit contact, and invasive scans need extra care. Keep player boundaries clear even when the city is cruel.</p></div><div class="mini"><h3>Adyta remembers</h3><p>Every trace can become Heat, Standing, route change, rumor, debt, evidence, or someone knowing exactly what you can do next time.</p></div></div>',signalstickers:'<h1>Signal Stickers</h1><p>Runner and Wrench crews do not mark maps like city agencies. They leave Signal Stickers: semi-standard field sigils that carry warnings, route memory, repairs, jokes, debts, sabotage, and the name of whoever thinks they know better than the official map.</p><div class="opbar"><b>Field rule:</b> a sticker is claimed knowledge, not guaranteed truth. Trust depends on who marked it, how old it is, and whether the route has changed since.</div><h3>Utility Sigils</h3><p>Useful marks for survival work. These are the stickers crews leave when they are trying to help the next crew make it through.</p><div class="cards"><div class="mini"><h3>Route / Anchor / Focus</h3><p><b>Route</b> marks a known passage. <b>Anchor</b> marks a stable landmark or regroup point. <b>Focus</b> marks a sightline, signal point, or place worth watching from.</p><span class="tag live">NAVIGATION</span></div><div class="mini"><h3>Fix / Patch / Boost</h3><p><b>Fix</b> means repairable system or tool-needed site. <b>Patch</b> means temporary repair. <b>Boost</b> means lift, speed, shortcut, or momentum.</p><span class="tag">WRENCH WORK</span></div><div class="mini"><h3>Shield / Seal / Cleanse</h3><p><b>Shield</b> marks a defensible spot. <b>Seal</b> marks blocked, locked, contained, or closed. <b>Cleanse</b> marks water, contamination, filth, or hazard cleanup.</p><span class="tag danger">HAZARD</span></div><div class="mini"><h3>Charge / Safe Enough / Shop-Safe</h3><p><b>Charge</b> marks power. <b>Safe Enough</b> means usable, not safe. <b>Shop-Safe</b> means trade-neutral or merchant tolerated.</p><span class="tag">FIELD JUDGMENT</span></div></div><h3>Clan Marks</h3><p>Clan and source stickers tell you who left the claim, who might honor it, and which local rules travel with the mark.</p><div class="cards"><div class="mini"><h3>Patchkin / Gremlin Works</h3><p>Salvage logic, repair culture, risky competence, and useful objects that refused to stay dead. Reliable about function; weird about ownership.</p><span class="tag">SALVAGE</span></div><div class="mini"><h3>Low Halo / Sewer Route / Side Ways</h3><p>Local movement marks. Good for lived routes, hidden access, community warnings, and the version of the map that actually gets people home.</p><span class="tag live">LOCAL ROUTES</span></div><div class="mini"><h3>Scrap Oath / No Waste / Carry Forward</h3><p>Obligation marks. They can mean use this, preserve this, owe this, carry this forward, or do not waste what someone else needs.</p><span class="tag">DEBT</span></div><div class="mini"><h3>Shop Favor / Trade Fair / Vrekk / Griththren</h3><p>Social marks: market trust, fair exchange, clan standing, and folk provenance. They say whose rules you are stepping into.</p><span class="tag">PROVENANCE</span></div></div><h3>Mischief Sigils</h3><p>Mischief marks are interference language. They can be warnings, jokes, sabotage, cowardice, counter-mapping, or a very honest refusal to help.</p><div class="cards"><div class="mini"><h3>Distract / Detour / Hide / Sneak</h3><p>Movement and attention marks. Something here pulls eyes away, sends crews around, hides the obvious, or rewards quiet passage.</p></div><div class="mini"><h3>Glitch / Jam / Mute / Ghost</h3><p>Signal and record marks. Expect broken comms, false systems, dead audio, missing footage, or the kind of silence that means someone vanished.</p><span class="tag danger">UNRELIABLE DATA</span></div><div class="mini"><h3>Misplace / Delay / Confuse</h3><p>Timing and certainty marks. Things move, arrival takes longer than expected, directions contradict, or the map is lying by being almost right.</p></div><div class="mini"><h3>Not My Problem</h3><p>The most honest warning in the drawer. It does not mean harmless. It means whoever marked it survived by refusing responsibility.</p><span class="tag danger">DO NOT ASSUME SAFE</span></div></div><h3>Sticker Stacks</h3><p>Real field marks should stack. A map point is more interesting when it records route, hazard, source, age, and argument instead of one clean icon.</p><div class="matrix"><div class="mini"><h3>Example stack</h3><p><b>Pipe 37 East Valve Room</b><br>ROUTE / SEAL / LOW HALO / DELAY</p><p>Door cycles every 11 minutes. Wait for the second clank. First one lies.</p><span class="tag">CLAIMED BY: MARA CREW</span><span class="tag danger">UNVERIFIED</span></div><div class="mini"><h3>How to read it</h3><p>Passable route. Closed or contained door. Low Halo source. Timing problem. Useful, but not certified. If the door changed, the mark may now be dangerous.</p></div><div class="mini"><h3>How to update it</h3><p>Add a sticker, cross one out, confirm it, dispute it, mark it stale, or attach a note. Future crews inherit the argument, not just the answer.</p></div></div><h3>PDA field record format</h3><div class="cards"><div class="mini"><h3>Field Mark Found</h3><p><b>Signal Stack:</b> ROUTE / SAFE ENOUGH / GHOST<br><b>Source:</b> Radio Sewers relay hand<br><b>Last Confirmed:</b> 18 days ago<br><b>Status:</b> contested</p></div><div class="mini"><h3>Runner action menu</h3><ul><li>Add sticker</li><li>Confirm mark</li><li>Dispute mark</li><li>Mark stale</li><li>Add crew note</li><li>Send to World Memory</li></ul></div><div class="mini"><h3>Inherited knowledge</h3><p>Future crews should inherit marks as records with bias, age, source, and risk. A wrong sticker is not a bug. It is history doing what history does.</p></div></div><h3>Table use</h3><ul><li>Use Utility Sigils for what the place does.</li><li>Use Clan Marks for who claims the knowledge.</li><li>Use Mischief Sigils for uncertainty, interference, spoofing, or jokes that might kill someone.</li><li>Never treat sticker maps as official truth. Treat them as survival records left by people who had to move fast.</li></ul><div class="actions"><button class="primary" onclick="showPanel(&quot;city&quot;)">Open City Atlas</button><button onclick="showPanel(&quot;downtime&quot;)">Send To Logs</button><button onclick="showPanel(&quot;missions&quot;)">Open Missions</button></div>'};const OP_KEY='grakkgrith_active_operation_v1';const missionsData=[{id:'pipe37',title:'Mission 01: Pipe 37',phase:'FIRST LIVE MISSION',status:'Ready to run',loc:'Low Halo / The Sewers / Deeper Sewers',pay:'35,000 credits',client:'Antitoxin through a local ACW intermediary',ask:'Investigate the death near Pipe 37, determine what is operating below, stop or contain the immediate threat if possible, and bring back an answer that does not get Low Halo hurt worse.',stakes:'The first answer becomes the public story. A clean lie may calm the city, but the wrong answer brought back up can turn care into panic, lockdown, or cover-up.',risk:'Contamination, restricted access, unreliable maps, deeper sewer wrongness, official containment pressure, community distrust, and a body that may not fit the easy report.',needs:'A crew that can move through local routes respectfully, read hazard signs, preserve evidence, talk before shooting, and decide what truth is safe to surface.',factions:'Antitoxin, ACW / Wardens, Sewers Community, Radio Sewers, ABI, Crownline-adjacent cleanup interests.',intel:['Low Halo residents know the official map is incomplete.','Pipe 37 is already marked after the death; access is watched, not truly sealed.','Antitoxin wants the hazard truth before a cleanup narrative overwrites it.','The question is not only what killed someone. It is who gets blamed when the answer surfaces.'],approach:['Local first: ask sewer residents and Radio Sewers what changed before entering.','Official cover: use the ACW intermediary to pass a perimeter without starting a public fight.','Evidence first: preserve samples, route notes, body details, and witness contradictions.','Containment first: stop the active danger, then decide who deserves the report.'],clocks:['Pipe pressure rises if the crew delays or makes noise.','Public panic rises if official responders seal routes without local explanation.','Cover-up pressure rises if evidence points toward liability.'],heat:'Starts contained because the job is deniable. Heat spikes if the crew exposes the death publicly, attacks responders, opens deeper access, or lets someone else define the answer.',fallout:'Truth can protect Low Halo, justify a lockdown, empower Antitoxin, trigger ABI attention, close sewer routes, or make the crew responsible for a dangerous answer.',next:'Mission 02: Route Lock begins from whatever route, evidence, or blame the crew leaves behind.',discord:'INTENT: what answer are you trying to bring back? APPROACH: who do you trust on the way down? BACKUP: what do you do if the answer is worse than the job brief?'},{id:'routeLock',title:'Mission 02: Route Lock',phase:'FIRST ARC FOLLOW-UP',status:'Unlocked by Pipe 37 fallout',loc:'Low Halo routes / Sewers access points',pay:'Standing, access, favors, and negotiated hazard pay',client:'Whichever side gained trust after Pipe 37',ask:'Deal with the route closures, false seals, watched corridors, and access disputes created by the first mission before people lose homes, work, medicine, or cover.',stakes:'The city reacts to danger by closing movement. For Low Halo and the Sewers, movement is survival.',risk:'Warden seals, Crownline infrastructure claims, desperate locals, bad detours, false maps, panic posts, and opportunists selling safe passage.',needs:'Route knowledge, social leverage, stealth, tech or magic that can read access systems, and enough restraint not to turn a checkpoint into a war.',factions:'Sewers Community, Radio Sewers, Wardens, Crownline Infrastructure, Emergency Management, Low Halo residents.',intel:['Some closures are real safety measures; some are political theater.','Official seals do not match lived movement.','Radio Sewers knows which routes are watched, poisoned, fake, or still usable.','Every opened route creates a witness and every closed route creates a debt.'],approach:['Negotiate: get a legal corridor or community carve-out.','Bypass: map and protect an unofficial route.','Expose: prove a seal is false or predatory.','Stabilize: fix the actual hazard so closure pressure loses ground.'],clocks:['Access clock tracks how much movement remains.','Blame clock tracks who the public holds responsible.','Trust clock tracks whether locals believe the crew came back for them.'],heat:'Heat shifts from incident Heat to movement Heat. Officials notice who keeps people moving after a closure order.',fallout:'A route survives, burns, becomes official, becomes secret, or becomes bait. The crew may gain local trust while earning institutional suspicion.',next:'Mission 03: What the File Says starts when the route story and the official file stop matching.',discord:'INTENT: what route are you trying to keep alive? APPROACH: public pressure, quiet bypass, repair, negotiation, or sabotage? BACKUP: who gets moved first if the route collapses?'},{id:'fileSays',title:'Mission 03: What the File Says',phase:'FIRST ARC REVEAL',status:'Arc escalation',loc:'ABI files / civic records / Low Halo memory',pay:'Case leverage, faction standing, and whatever the truth is worth',client:'ABI contact, Antitoxin, local witness network, or a faction trying to bury the record',ask:'Compare the official file, physical evidence, route memory, witness accounts, and faction claims until the crew can decide what to reveal, redact, trade, or destroy.',stakes:'Files decide who is guilty, who is forgotten, who gets paid, and whose suffering becomes administratively convenient.',risk:'Tampered evidence, legal threats, hostile interviews, memory magic, leaked names, witness intimidation, and a file that protects the wrong people on purpose.',needs:'Investigation, social reading, digital or archive access, magical resonance sense, and a crew agreement about what truth is for.',factions:'ABI, Civil Registry, Public Advocacy, Antitoxin, Crownline, Low Halo witnesses, Velvet Signal-style narrative brokers.',intel:['The file is not empty; it is curated.','Someone benefits if Pipe 37 becomes an isolated sewer accident.','Witness protection may matter more than total disclosure.','A true report can still hurt people if delivered to the wrong hands.'],approach:['Audit: build a contradiction board from file, route, body, hazard, and witness evidence.','Leak: make the story public before it can be softened.','Shield: protect vulnerable names while preserving the useful truth.','Trade: use proof to win access, treatment, route repair, or accountability.'],clocks:['Evidence clock tracks what can still be proven.','Witness clock tracks who remains safe enough to talk.','Narrative clock tracks which version the city believes.'],heat:'Case Heat. Once files move, investigators, lawyers, fixers, and narrative brokers all start watching.',fallout:'The arc can end with public accountability, a dangerous bargain, protected witnesses, a buried truth, or a new enemy who knows the crew touched the file.',next:'Downtime should record Heat, Standing, protected witnesses, exposed evidence, closed routes, and the next faction move.',discord:'INTENT: what do you want the file to prove? APPROACH: expose, redact, trade, protect, or destroy? BACKUP: what truth are you un ure pressure, bad maps.',needs:'Route respect, hazard sense, and no surface fool behavior.',factions:'Sewers Community, Antitoxin, Radio Sewers, Adyta Emergency Management.',intel:['Locals changed their walking pattern before the warning became official.','Bad sound carries in the corridor.','The hazard may connect to Pipe 37 without admitting it.'],approach:['Walk with a local.','Sample and mark hazards.','Set warnings and keep moving.','Close it only if there is no safer choice.'],clocks:['Contamination spread.','Local trust.','Official closure.'],heat:'Quiet route work keeps Heat contained. Official closure or panic makes the route politically visible.',fallout:'A path people actually use survives, gets sealed, or becomes evidence that something deeper is wrong.',next:'Strong lead-in to Pipe 37 or Route Lock.',discord:'INTENT: keep, close, map, or diagnose the corridor? APPROACH: local guide, hazard kit, magic read, tech scan, or patrol?'},{id:'below',title:'Below-Site Incident Review',phase:'SIDE BOARD',status:'Available',loc:'Old City',pay:'14,000 credits',client:'Developer intermediary with too-clean paperwork',ask:'Enter a newly exposed sealed space, determine whether the hazard is structural, environmental, archival, or occult, and advise whether the site can be contained safely.',stakes:'The honest version survives, or the room gets buried under a cheaper lie.',risk:'Lost time, contradictory witness reports, unstable lower chamber, developer pressure, resonance.',needs:'Calm heads, unusual perception, and someone who knows when a room is wrong before it proves it.',factions:'Developer intermediary, ABI, Velvet Signal, possible old-city stakeholders.',intel:['The room was not on the file until someone needed it to be.','Witnesses disagree in ways that feel useful, not random.','Containment advice may be used as legal cover.'],approach:['Document everything.','Refuse unsafe entry.','Read resonance before touching artifacts.','Separate worker safety from devel function campaignStateHtml(state){const s=state||defaultCampaignState();return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#02070b;--panel:#07131c;--line:rgba(24,246,255,.38);--cyan:#18f6ff;--pink:#ff3db7;--yellow:#ffe14b;--green:#75ff8a;--text:#d8fbff;--muted:#8fb7c3;--font:Consolas,'Arial Narrow',monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,rgba(24,246,255,.13),transparent 32%),radial-gradient(circle at 90% 5%,rgba(255,61,183,.13),transparent 28%),var(--bg);color:var(--text);font-family:var(--font)}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:rgba(24,246,255,.075);color:var(--text);font-weight:900;text-transform:uppercase;padding:9px 11px;cursor:pointer}button.primary{border-color:rgba(255,61,183,.7);background:rgba(255,61,183,.13)}button.good{border-color:rgba(117,255,138,.65);background:rgba(117,255,138,.1)}.wrap{max-width:1180px;margin:auto;padding:18px}.hero,.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(7,19,28,.96),rgba(2,7,11,.98));box-shadow:0 0 18px rgba(24,246,255,.12)}.hero{padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1.1fr auto;gap:12px}.eyebrow{color:var(--pink);font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:12px}h1{margin:4px 0;color:var(--cyan);font-size:32px}p{color:var(--muted);line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:14px}.card h2{margin:0 0 10px;color:var(--yellow);font-size:18px}label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:900;margin:8px 0 4px}input,textarea,select{width:100%;border:1px solid rgba(24,246,255,.32);background:#02070b;color:var(--text);padding:9px}textarea{min-height:92px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.recap{white-space:pre-wrap;border:1px solid rgba(117,255,138,.35);background:rgba(117,255,138,.055);padding:12px;color:#dfffe4;min-height:220px}.mini{color:var(--muted);font-size:12px}.wide{grid-column:1/-1}@media(max-width:850px){.hero,.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><div><div class="eyebrow">Living campaign console</div><h1>Active Mission / State Tracker</h1><p>Track what is happening now, who is applying pressure, what changed after the last session, and what can be pasted straight into Discord.</p><div class="mini">Last saved: ${esc(new Date(s.updated||Date.now()).toLocaleString())}</div></div><div class="actions"><button class="primary" id="saveBtn">Save State</button><button id="recapBtn">Generate Recap</button><button id="cityBtn">Open City Atlas</button></div></section><section class="grid"><div class="card"><h2>Active Operation</h2><label>Operation</label><input id="operation" value="${esc(s.operation)}"><label>Status</label><select id="status"><option>Scouting</option><option>In Progress</option><option>Hot</option><option>Resolved</option><option>Burned</option></select><label>District / Route</label><input id="district" value="${esc(s.district)}"><label>Mission Lead</label><textarea id="missionLead">${esc(s.missionLead)}</textarea></div><div class="card"><h2>Pressure & Clocks</h2><label>Faction pressure</label><textarea id="factionPressure">${esc(s.factionPressure)}</textarea><label>Fallout</label><textarea id="fallout">${esc(s.fallout)}</textarea></div><div class="card"><h2>Session Log</h2><label>What happened?</label><textarea id="sessionLog">${esc(s.sessionLog)}</textarea><label>Next hooks</label><textarea id="nextHooks">${esc(s.nextHooks)}</textarea></div><div class="card"><h2>Discord-ready Recap</h2><div id="recap" class="recap">${esc(campaignRecap(s))}</div></div><div class="card wide"><h2>Use</h2><p>Set operation, district, pressure, fallout, and next hooks. Generate the recap when ready.</p></div></section></div><script>const statusSel=document.getElementById('status');statusSel.value=${JSON.stringify(s.status||'Scouting')};function collect(){return{operation:operation.value,status:statusSel.value,district:district.value,missionLead:missionLead.value,factionPressure:factionPressure.value,fallout:fallout.value,sessionLog:sessionLog.value,nextHooks:nextHooks.value}}function recapText(s){return '**GRAKKGRITH Campaign State**\\n**Active Operation:** '+(s.operation||'Unassigned')+'\\n**Status:** '+(s.status||'Unknown')+'\\n**District:** '+(s.district||'Unknown')+'\\n**Mission Lead:** '+(s.missionLead||'None')+'\\n\\n**Faction Pressure / Clocks**\\n'+(s.factionPressure||'None logged')+'\\n\\n**Fallout**\\n'+(s.fallout||'None logged')+'\\n\\n**Session Log**\\n'+(s.sessionLog||'No session log yet.')+'\\n\\n**Next Hooks**\\n'+(s.nextHooks||'No hooks queued.')}function renderRecap(){recap.textContent=recapText(collect())}saveBtn.onclick=()=>parent.postMessage({type:'grakkgrith-save-campaign',state:collect()},'*');recapBtn.onclick=()=>renderRecap();cityBtn.onclick=()=>parent.postMessage({type:'grakkgrith-open-city'},'*');document.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',renderRecap));renderRecap();<\/script></body></html>`}
function showCampaignState(){setDoc(campaignStateHtml(getCampaignState()),'state')}
function enhanceCityAtlas(){
 injectOccultTheme();
 const doc=frame.contentDocument;if(!doc)return;const canvas=doc.getElementById('cityMapCanvas');const toolbar=doc.querySelector('.cityMapTools')||doc.querySelector('.cityMapHeader');if(!canvas||!toolbar)return;const win=doc.defaultView;
 doc.querySelectorAll('.cityLayerBtn').forEach(btn=>{if(btn.textContent.trim().toLowerCase()==='pins')btn.textContent='District Labels / Pins';const sync=()=>btn.setAttribute('aria-pressed',btn.classList.contains('active')?'true':'false');btn.addEventListener('click',()=>setTimeout(sync,0));sync()});
 if(!doc.getElementById('districtMapPageStyles')){const s=doc.createElement('style');s.id='districtMapPageStyles';s.textContent='.districtChoice.active{border-color:rgba(255,61,183,.78);background:rgba(255,61,183,.14)}.districtMapImg{max-width:none}.districtMapReadout ul{margin:7px 0 0 18px;padding:0}';doc.head.appendChild(s)};
 if(!doc.getElementById('expandedDistrictMaps')){
  const h=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));

   'low-halo':{title:'Low Halo District Map',tag:'street routes / tram spine / rooftop paths',src:new URL('./maps/low-halo-district-map.png',location.href).href,read:'Low Halo is the loud, painted, argument-rich edge of play: Mural Mile, Mercy Street, Gate 12, Static Square, Widow\'s Bridge, the Crawl, Hollow Stack, Greasewick Row, and tunnel routes toward Old City, Ashrun, the Tangle, and Three Wires.',wisdom:['Miss the last tram, you walk.','Do not brag on Mercy.','Cops come from the north.','Rooftops are faster. Tunnels are safer.']},
   'low-ember-spread':{title:'Low Halo / Ember Court Spread',tag:'paired district reference',src:new URL('./maps/low-halo-ember-court-spread.png',location.href).href,read:'A two-page spread that links Low Halo pressure to Ember Court contract logic. Use it when a route, favor, curse, witness, or market consequence crosses from street-level chaos into legal-occult paperwork.',wisdom:['Maps are lies. Make your own anyway.','Cinderwick continues toward Market Ring.','Toward Central Core: paper, power, lies.']},
   'ember-court':{title:'Ember Court District Map',tag:'contracts / curses / remedies / lantern routes',src:new URL('./maps/ember-court-district-map.png',location.href).href,read:'Ember Court is where Adyta keeps contracts, curses, remedies, loopholes, red lanterns, and soup that tastes better after emotional damage. Cinderwick Lane is the main spine; everything has a price.',wisdom:['Do not sign wet ink.','If the lantern goes blue, stop talking.','Read the third copy.','Red wax means witnessed. Black wax means remembered.']},
   'sewers-town':{title:'Sewers Town Undercity Map',tag:'canals / walkways / pipe gates / deep tunnels',src:new URL('./maps/sewers-town-district-map-deeper.png',location.href).href,read:'Sewers Town now includes the unconfirmed lower inset: navigable infrastructure above, unreliable Deep Tunnels below, route lines that break into dashed survey uncertainty, collapsed and flooded zones, Pipe 37 access, and notes warning that maps disagree past Gate 4.',wisdom:['Watch the currents.','Bridges are crowded at peak hours.','Some paths are one-way.','Deep tunnels unstable.','Maps disagree past Gate 4.','Ask before you go below the lights.']}
  };
  const mount=doc.createElement('section');mount.id='expandedDistrictMaps';mount.className='districtMapStage';mount.innerHTML='<div class="cityMapHeader"><div><h2>District Map Pages</h2><p>Expanded player-facing pages for table prep: open a district, read the local notes, then use the full artwork as the briefing map.</p></div><div><span class="tag live">NEW MAPS</span><span class="tag">CITY ATLAS</span></div></div><div class="districtMapToolbar" id="districtMapChoices"></div><div class="districtMapFrame"><div class="districtMapCanvas" id="districtMapCanvas"><img class="districtMapImg" id="districtMapImg" loading="eager" alt="Expanded district map"></div></div><div class="districtMapReadout" id="districtMapReadout"></div>';
  const after=doc.querySelector('.cityMapStage')||doc.querySelector('#routeMapMount')||doc.querySelector('#panel');after.insertAdjacentElement('afterend',mount);
  const nav=mount.querySelector('#districtMapChoices');nav.innerHTML=Object.keys(districtMaps).map(id=>'<button type="button" class="districtChoice" data-district-choice="'+id+'">'+h(districtMaps[id].title)+'</button>').join('');
  const img=mount.querySelector('#districtMapImg'),readout=mount.querySelector('#districtMapReadout');
  function renderDistrictMap(id){const m=districtMaps[id]||districtMaps['low-halo'];win.__selectedDistrictMap=id;nav.querySelectorAll('[data-district-choice]').forEach(b=>b.classList.toggle('active',b.dataset.districtChoice===id));img.src=m.src;img.alt=m.title+' expanded map page';readout.innerHTML='<b>'+h(m.title)+'</b><br><span class="tag">'+h(m.tag)+'</span><p>'+h(m.read)+'</p><ul>'+m.wisdom.map(w=>'<li>'+h(w)+'</li>').join('')+'</ul>';mount.scrollIntoView({block:'nearest',behavior:'smooth'});return id}
  win.showDistrictMap=renderDistrictMap;nav.querySelectorAll('[data-district-choice]').forEach(b=>b.addEventListener('click',()=>renderDistrictMap(b.dataset.districtChoice)));
  doc.querySelectorAll('[data-city-pin]').forEach(pin=>{const k=(pin.dataset.cityPin||'').toUpperCase();const target=k.includes('LOW HALO')?'low-halo':k.includes('EMBER COURT')?'ember-court':k.includes('SEWER')?'sewers-town':'';if(target){pin.dataset.districtMap=target;pin.addEventListener('click',()=>renderDistrictMap(target))}});
  renderDistrictMap('low-halo');
 }
 if(!doc.getElementById('cityZoomControls')&&!toolbar.querySelector('.cityZoomControls')){
  let zoom=1;const controls=doc.createElement('div');controls.id='cityZoomControls';controls.className='cityZoomControls';controls.innerHTML='<button type="button" onclick="window.__cityAtlasZoom(\'out\')">ZOOM -</button><button type="button" onclick="window.__cityAtlasZoom(\'in\')">ZOOM +</button><button type="button" onclick="window.__cityAtlasZoom(\'reset\')">RESET</button><span class="cityZoomReadout">100%</span>';toolbar.appendChild(controls);
  const readout=controls.querySelector('.cityZoomReadout');win.__cityAtlasZoom=action=>{if(action==='in')zoom+=.25;else if(action==='out')zoom-=.25;else zoom=1;zoom=Math.max(.75,Math.min(2.25,zoom));canvas.style.zoom=String(zoom);canvas.style.transform=win.CSS&&win.CSS.supports&&win.CSS.supports('zoom','1')?'':'scale('+zoom+')';readout.textContent=Math.round(zoom*100)+'%';return readout.textContent};win.__cityAtlasZoom('reset');
 }
}
function toast(t){notice.textContent=t;notice.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>notice.style.display='none',3200)}
function clearAllData(){pendingState=null;acceptPlayerState=false;playerReady=false;const keys=[TOOL_KEY,...OLD_TOOL_KEYS,'adyta_offline_inventory_v44_shared','adyta_offline_inventory_v43_shared','adyta_offline_inventory_v42_shared','grakkgrith_character_creator_v2','grakkgrith_character_creator_v1'];for(const k of keys){try{localStorage.removeItem(k)}catch(e){}}}
window.addEventListener('message',e=>{const m=e.data||{};
 if(m.type==='grakkgrith-character-complete'){setState(m.state);showCharacterHub();toast('Character created. Hub is ready.')}
 else if(m.type==='grakkgrith-player-ready'){playerReady=true;const s=pendingState||getState();if(s)frame.contentWindow.postMessage({type:'grakkgrith-load-state',state:s},'*');acceptPlayerState=true;statusEl.textContent='';updateCharacterBadge()}
 else if(m.type==='grakkgrith-player-state'){if(playerReady&&acceptPlayerState)setState(m.state)}
 else if(m.type==='grakkgrith-reset-all'){clearAllData();showCharacterHub();toast('Character and local data deleted. Character Hub is clean.')}
 else if(m.type==='grakkgrith-open-sheet'){const s=getState();if(s)showPlayer(s);else{toast('Create a character first.');showCreator(false)}}
 else if(m.type==='grakkgrith-open-creator'){showCreator(false)}
 else if(m.type==='grakkgrith-open-city'){showWorld('city')}
 else if(m.type==='grakkgrith-save-campaign'){setCampaignState(m.state);showCampaignState();toast('Campaign state saved.')}
 else if(m.type==='grakkgrith-open-new'){if(!confirm('Start a new character? Your current character remains saved until you finish the new one.'))return;showCreator(true)}
});
