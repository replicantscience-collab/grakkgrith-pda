<!doctype html><html><head><meta charset="utf-8">
<!-- Fairy species card, lettered to match the Sideways Shops poster cards. Open in a browser (online, for Patrick Hand),
     then screenshot the 620x1360 .card element and save it as ../races/fairy.webp. Edit the text in .text and .traits. --><style>
@font-face{font-family:Marker;src:url(../../../../fonts/permanent-marker-latin-400-normal.woff2)}
@font-face{font-family:Hand;src:url(https://cdn.jsdelivr.net/npm/@fontsource/patrick-hand/files/patrick-hand-latin-400-normal.woff2)}
@font-face{font-family:HandSC;src:url(https://cdn.jsdelivr.net/npm/@fontsource/patrick-hand-sc/files/patrick-hand-sc-latin-400-normal.woff2)}
html,body{margin:0;background:#120616}
.card{position:relative;width:620px;height:1360px;overflow:hidden;background:#1b0a22}
.art{position:absolute;left:0;top:0;width:620px;height:860px;background:url(fairy-portrait-master.webp) 52% 0/700px auto no-repeat}
.art::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(27,10,34,0) 62%,rgba(27,10,34,.85) 86%,#1b0a22 100%)}
.frame{position:absolute;inset:10px;border:3px solid #ff86df;border-radius:6px;box-shadow:0 0 10px #ff4fcf,inset 0 0 10px rgba(255,79,207,.6);filter:url(#wobble)}
.frame2{position:absolute;inset:20px;border:1.5px solid rgba(140,230,255,.75);border-radius:4px;filter:url(#wobble)}
.title{position:absolute;left:0;right:0;top:694px;text-align:center;font:400 138px/1 Marker;color:#ffe9f8;letter-spacing:4px;
 -webkit-text-stroke:3px #2b0a30;paint-order:stroke fill;
 text-shadow:0 0 6px #ff6fd8,0 0 16px #ff3fc8,0 0 30px #c03cff,3px 4px 0 #2b0a30;transform:rotate(-2deg);padding-left:60px}
.icon{position:absolute;left:40px;top:730px;width:92px;height:92px;filter:drop-shadow(0 0 6px #ff5fd6) drop-shadow(0 0 14px #b44bff)}
.paper{position:absolute;left:40px;right:40px;top:848px;height:394px;box-shadow:inset 0 0 26px 6px rgba(110,62,24,.55),inset 0 0 4px 2px rgba(70,38,14,.6);background:#ead7ab;filter:url(#torn);
 background-image:radial-gradient(ellipse at 30% 20%,rgba(255,250,230,.55),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(120,80,40,.28),transparent 55%)}
.paperTex{position:absolute;left:40px;right:40px;top:848px;height:394px;filter:url(#torn) url(#grain);background:#ead7ab;mix-blend-mode:multiply;opacity:.5}
.text{position:absolute;left:58px;right:58px;top:868px;text-align:center;color:#2f2117}
.lab{font:400 40px/1 Hand;-webkit-text-stroke:1px #2f2117;letter-spacing:1.5px;text-transform:uppercase}
.val{font:400 62px/1.05 Hand;color:#7b1f78;-webkit-text-stroke:2px #7b1f78;letter-spacing:2px;margin-top:2px;text-transform:uppercase}
.rule{height:3px;margin:8px 30px 6px;background:linear-gradient(90deg,transparent,#5a3b22 12%,#5a3b22 88%,transparent);filter:url(#wobble)}
.body{font:400 46px/1.06 Hand;padding:0 6px;-webkit-text-stroke:1.2px #2f2117}
.traits{position:absolute;left:24px;right:24px;top:1246px;text-align:center;font:400 41px/1.12 Hand;text-transform:uppercase;color:#f4e4ff;letter-spacing:2px;-webkit-text-stroke:1.2px #f4e4ff;text-shadow:0 0 8px #c55cff,0 1px 0 #000}
.spark{position:absolute;width:26px;height:26px;filter:drop-shadow(0 0 5px #ff7ce0)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="torn"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="22"/></filter>
<filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<symbol id="star" viewBox="-10 -10 20 20"><path d="M0-10 2-2 10 0 2 2 0 10-2 2-10 0-2-2Z"/></symbol>
</defs></svg>
<div class="card">
 <div class="art"></div>
 <div class="frame"></div><div class="frame2"></div>
 <svg class="icon" viewBox="0 0 100 100" fill="none" stroke="#ffb3ee" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
  <path d="M50 52 C34 18 10 16 12 38 C14 54 34 58 50 52Z"/><path d="M50 52 C66 18 90 16 88 38 C86 54 66 58 50 52Z"/>
  <path d="M50 54 C38 62 28 80 40 84 C48 86 50 70 50 54Z"/><path d="M50 54 C62 62 72 80 60 84 C52 86 50 70 50 54Z"/>
  <path d="M50 46 V86" stroke="#fff0fb"/><path d="M50 46 C46 38 44 34 40 30 M50 46 C54 38 56 34 60 30" stroke-width="3.5"/></svg>
 <div class="title">FAIRY</div>
 <svg class="spark" style="left:520px;top:716px" fill="#ffd6f6"><use href="#star"/></svg>
 <svg class="spark" style="left:556px;top:790px;width:16px;height:16px" fill="#9ff3ff"><use href="#star"/></svg>
 <svg class="spark" style="left:150px;top:712px;width:14px;height:14px" fill="#9ff3ff"><use href="#star"/></svg>
 <div class="paper"></div><div class="paperTex"></div>
 <div class="text">
  <div class="lab">Typical Lifespan</div>
  <div class="val">Ageless</div>
  <div class="rule"></div>
  <div class="body">Charming, sharp, and never quite what you expected. Fairies read a room before you walk in, and know when promises break.</div>
 </div>
 <div class="traits">Perceptive &bull; Charming<br>Fae &bull; Promise-Bound</div>
 <svg class="spark" style="left:34px;top:34px;width:18px;height:18px" fill="#ffd6f6"><use href="#star"/></svg>
 <svg class="spark" style="left:566px;top:1300px;width:18px;height:18px" fill="#9ff3ff"><use href="#star"/></svg>
</div></body></html>
