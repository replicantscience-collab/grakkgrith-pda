<style>
:root{--bg:#02070b;--panel:#07131c;--panel2:#0b1c28;--cyan:#18f6ff;--pink:#ff3db7;--yellow:#ffe14b;--green:#75ff8a;--red:#ff274f;--text:#d8fbff;--muted:#86b9c3;--line:rgba(24,246,255,.5);--font:Consolas,'Arial Narrow',monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(24,246,255,.14),transparent 30%),radial-gradient(circle at 90% 5%,rgba(255,61,183,.12),transparent 28%),var(--bg);color:var(--text);font-family:var(--font)}button,input,select,textarea{font:inherit}.wrap{max-width:1250px;margin:auto;padding:16px}.head,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(7,19,28,.97),rgba(2,7,11,.98));box-shadow:0 0 18px rgba(24,246,255,.13);padding:16px}.head{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:12px}.title{font-size:34px;font-weight:900;color:var(--cyan)}.sub{color:var(--pink);font-weight:800}.small,.desc{font-size:12px;color:var(--muted);line-height:1.45}.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:12px 0}.stepDot{height:8px;background:#10222c;border:1px solid rgba(24,246,255,.25)}.stepDot.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}.stepDot.done{background:var(--green)}.layout{display:grid;grid-template-columns:240px 1fr;gap:12px}.nav button{display:block;width:100%;text-align:left;margin-bottom:6px}.panel h2{margin:0 0 8px;color:var(--cyan)}.panel h3{color:var(--yellow);margin:14px 0 7px}label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}input,select,textarea{width:100%;background:#02070b;color:var(--text);border:1px solid rgba(24,246,255,.35);padding:9px}textarea{min-height:80px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{border:1px solid rgba(24,246,255,.3);padding:10px;background:#030b11;cursor:pointer}.choice.selected{border-color:var(--yellow);box-shadow:0 0 10px rgba(255,225,75,.2)}.choice.disabled{opacity:.35;cursor:not-allowed}.choice strong{color:#fff}.tag{display:inline-block;border:1px solid currentColor;padding:2px 6px;margin:2px;color:var(--cyan);font-size:11px}.warning{border:1px solid var(--yellow);background:rgba(255,225,75,.06);padding:8px;color:#fff6b3}.error{border-color:var(--red)!important;color:#ffd2dc}.ok{color:var(--green)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:1px solid rgba(24,246,255,.6);background:rgba(24,246,255,.08);color:var(--text);padding:9px 12px;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.2)}button:disabled{opacity:.35;cursor:not-allowed}.primary{border-color:var(--green);background:rgba(117,255,138,.1)}.danger{border-color:var(--red)}.attrGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.attr{border:1px solid rgba(24,246,255,.3);padding:10px;text-align:center}.attr .value{font-size:27px;font-weight:900}.attr .mods{font-size:11px;color:var(--muted)}.attr button{padding:5px 10px}.skillDomains{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.domain{border:1px solid rgba(24,246,255,.25);padding:10px}.skillRow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.06);padding:6px 0}.skillRow input{width:auto}.summary{border:1px solid rgba(255,61,183,.45);padding:12px;background:rgba(255,61,183,.03)}.summaryRow{display:grid;grid-template-columns:190px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}.locked{opacity:.5}.gearGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gearCard{border:1px solid rgba(255,225,75,.35);padding:10px;background:#030b11}.gearCard h3{margin-top:0}.gearList{font-size:12px;line-height:1.5}.gearAuto{color:var(--green)}.footerNav{display:flex;justify-content:space-between;margin-top:14px}.hidden{display:none!important}@media(max-width:800px){.gearGrid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.nav{display:none}.grid2,.grid3,.choices,.attrGrid,.skillDomains{grid-template-columns:1fr}.head{grid-template-columns:1fr}.progress{grid-template-columns:repeat(5,1fr)}}

</div><script>
const DATA={"races":{"Goblin":{"mods":{"muscle":-2,"reflex":2,"wit":0,"savvy":0,"spark":0,"root":1}},"Slimefolk":{"mods":{"muscle":0,"reflex":-1,"wit":0,"savvy":0,"spark":2,"root":0}},"Orc":{"mods":{"muscle":2,"reflex":-1,"wit":0,"savvy":0,"spark":0,"root":0}},"Human":{"mods":{"muscle":0,"reflex":0,"wit":0,"savvy":0,"spark":0,"root":0},"choice":true},"Fairy":{"mods":{"muscle":-1,"reflex":0,"wit":0,"savvy":1,"spark":1,"root":0},"resistance":"Psychic"},"Elf":{"mods":{"muscle":-1,"reflex":0,"wit":0,"savvy":0,"spark":1,"root":1}},"Dwarf":{"mods":{"muscle":2,"reflex":-1,"wit":1,"savvy":0,"spark":0,"root":-1}},"Halfling (Fenn)":{"mods":{"muscle":-1,"reflex":1,"wit":0,"savvy":1,"spark":0,"root":0}},"Cinderfolk":{"mods":{"muscle":-1,"reflex":0,"wit":0,"savvy":1,"spark":1,"root":0}},"Troll":{"mods":{"muscle":1,"reflex":-1,"wit":0,"savvy":0,"spark":1,"root":0}},"Kobold":{"mods":{"muscle":-1,"reflex":1,"wit":1,"savvy":0,"spark":0,"root":0},"resistance":"Chemical","vulnerability":"Cryo"},"Custom / Homebrew":{"mods":{"muscle":0,"reflex":0,"wit":0,"savvy":0,"spark":0,"root":0},"custom":true}},"raceDetails":{"Goblin":{"summary":"Small, fast, built for survival in hostile infrastructure. Physically mature early, life is long by proportion. Deeply tied to clan and territory. At 19 years old a goblin maps to roughly 31 in human terms — a full adult who has been legally an adult for eleven years. When others look at them and see a teenager, they are wrong in a way that is specifically insulting.","passive":"In any district you have spent a week or more in, you instinctively know unofficial routes, which buildings have unlocked service doors, and where enforcement crews patrol.","active":"Goblin Routes: Once per scene, move through unofficial paths, bypassing a single obstacle entirely. The GM cannot declare ‘there’s nothing useful here’ while this is active. Additionally, you can move through spaces too small for medium creatures and enemies take -1 die to hit you in close quarters.","standing":"Low by default. Profiled by ACW. Turned away from corporate spaces. Treated as criminal until proven otherwise. High standing in Commons spaces.","resistance":"Chemical","vulnerability":"None"},"Kobold":{"summary":"Smaller even than goblins — two to three feet, wiry and lithe — and built for the spaces between things. Cold-blooded, communal, and quiet, kobolds are Adyta’s subterranean labor caste: the crews that crawl the ducts, work the service levels, and keep the working guts of the city running for people who never see them do it. A single kobold is unremarkable and slow. A kobold crew is a swarm of competence that can strip and rebuild a system before anyone upstairs notices it stopped. The corps tolerate them in places they would turn a goblin away from, because kobolds read as labor, not threat. That tolerance is the trap — they are paid least, worked hardest, and seen by no one. They are the most at home of anyone below the surface, and even they do not go past the Deep Tunnels.","passive":"Service Level: in any building or block, you instinctively read the working guts — ducts, sub-levels, utility runs, maintenance shafts — the way goblins read the streets. No penalty acting in darkness or cramped vertical space. In any inhabited area there is always a crew: you can locate other kobolds.","active":"Many Hands: once per scene, when you act on a task alongside at least one ally working toward the same goal, the lead roll gains +1 die per assisting ally (maximum +3), and the effort cannot be wholly wasted — even a failed roll makes partial progress. Work that would require a full crew gets done.","standing":"Read as labor, not threat. Tolerated in corporate and service spaces that turn goblins and orcs away, because they are useful and assumed harmless — real access, and real erasure. Interchangeable, invisible, paid least. Sits at the bottom of the Commons pecking order. High standing within their own crews and in the Sewers communities.","resistance":"Chemical","vulnerability":"Cryo"},"Slimefolk":{"summary":"Biologically unique, chemically capable, magically strange. Long-lived (120-180 years). Identity-fluid by culture. Slimefolk are living biological organisms, not elementals or magical beings. Their biology exists unusually close to magical principles, which means magic sometimes behaves unpredictably around them.","passive":"Immune to chemical hazards. Anti-magic effects do not prevent natural shapechanging. Transformation spells may behave unpredictably. Alter apparent species or features enough to pass casual inspection (does not hold against close scrutiny or magical detection).","active":"Body Chemistry: Produce a corrosive or paralytic secretion once per combat as a contact attack requiring no weapon. Costs 1 Stress.","standing":"Moderate distrust citywide. Physical fear in some districts. Corporate spaces tolerate slimefolk in controlled roles. Deep prejudice in older or more conservative communities.","resistance":"Chemical","vulnerability":"Electrical"},"Orc":{"summary":"Large, physically formidable, culturally direct. Around 7 feet tall on average. Concentrated in industrial and martial roles but present across the city. Orc culture values competence demonstrated rather than claimed — an orc who says they can do something has usually already done it.","passive":"For any physical task you have successfully completed before, you may auto-succeed once per session without rolling.","active":"Last Stand: Cannot be reduced below 1 HP by a single hit once per combat encounter. Additionally, social checks to intimidate or command immediate compliance gain +2 dice.","standing":"Profiled as dangerous regardless of behavior. Hired for strength, passed over for authority. ‘One of the good ones’ is a common insult disguised as a compliment.","resistance":"Bludgeoning","vulnerability":"None"},"Human":{"summary":"Adaptable, politically connected in ways other species aren’t, overrepresented in corporate and civic hierarchies. The city was largely built with humans in mind.","passive":"Institutional Access: You can enter corporate lobbies, civic buildings, and official spaces without immediate suspicion. NPCs default to neutral rather than hostile.","active":"Versatile: +1 die on any single skill once per session (declared at session start). Additionally, start each session with one minor favor owed from a contact in your background faction.","standing":"Default neutral to positive citywide.","resistance":"None","vulnerability":"None"},"Fairy":{"summary":"Ageless, mortal-scale beings of the Fae lineage. Adult height varies by bloodline from about 2 to 6 feet, and appearance can differ so sharply between bloodlines that two fairies look less alike than two different species. Every fairy has magical wings they can reveal or conceal, good for brief hovering, breaking a fall, or clearing a gap, not sustained flight. Fairy glamour alters minor sensory details only; it cannot change apparent size or perfectly impersonate a known person. Fae Limitation: direct contact with cold iron suppresses Fae Reading, glamour, wings, and Slip the Threshold until the end of your next turn.","passive":"Fae Reading: You instinctively sense the emotional tone of a room and know when someone knowingly breaks a promise made in your presence. You cannot determine exact thoughts, motives, or future behavior. You may also maintain minor glamour without spending Stress.","active":"Slip the Threshold: Once per scene, move to any visible position in your current or an adjacent zone, ignoring enemies, difficult terrain, crowds, and one ordinary physical obstruction. You cannot pass through a sealed wall, cross a warded threshold, or carry another person. This movement does not trigger reactions.","standing":"Treated as charming, decorative, unserious, exotic, or inherently manipulative. Welcomed in entertainment, hospitality, luxury retail, and occult spaces while frequently denied authority or assumed to be using glamour.","resistance":"Psychic","vulnerability":"None (cold iron suppresses Fae abilities)"},"Elf":{"summary":"Long-lived, institutionally entrenched. Overrepresented in academia, old money, and governance. Diverse range of class backgrounds but the stereotype runs wealthy. Long exposure to arcane forces creates natural attunement.","passive":"Never Surprised: Always act in the first initiative window. Cannot be ambushed. Immune to panic and morale-breaking effects.","active":"Institutional Memory: Once per session, recall a specific historical fact about Adyta’s factions, infrastructure, or political history that other characters wouldn’t know.","standing":"High in elevated circles. Faces resentment in Commons spaces. The stereotype of elven privilege is often accurate enough to be a real social friction point.","resistance":"Magical","vulnerability":"None"},"Dwarf":{"summary":"Practical, durable, extraordinarily good at keeping things running. Strongholds in the Southern Industrial Belt. Engineering culture. Respected in industrial and technical contexts.","passive":"Built Different: Ignore one level of environmental penalty (cold, structural instability, toxic air, equipment malfunction).","active":"Jury-Rig: Once per scene, restore a broken piece of equipment or infrastructure to functional status for the duration of the session. Additionally, automatically detect structural instability, hidden passages, or construction anomalies in any building or tunnel.","standing":"Respected in industrial and technical contexts. Underestimated in social or political ones. Generally left alone.","resistance":"Fire","vulnerability":"None"},"Halfling (Fenn)":{"summary":"Small, network-savvy, concentrated in Market Ring and trade corridors. Underestimated consistently and professionally. The city treats halflings as harmless — they have learned to use this.","passive":"Unremarkable: In crowds, you are not noticed unless you do something that draws attention. Enemies must actively search for you between scenes. Never trigger noise-based detection while moving.","active":"Favor Network: Once per session, you know someone who owes you something in whatever district you’re currently in.","standing":"Largely ignored — an advantage and an invisibility that cuts both ways. Treated as harmless. Rarely taken seriously.","resistance":"None","vulnerability":"None"},"Cinderfolk":{"summary":"Urban species descended from infernal magic, cursed bloodlines, ancient contracts, and supernatural contamination. Concentrated in Ember Court. Culturally layered. Their infernal heritage makes heat and death magic familiar territory.","passive":"Flame Tolerance: Immune to heat-based environmental damage. Fire-based attacks deal half damage. Sense whether violence, death, or significant trauma occurred in a location recently.","active":"Threshold Work: Perform minor wards, hexes, blessings, or curses using available materials. These effects are real but small in scale.","standing":"The infernal aesthetic is marketable in tourist-facing Ember Court. Elsewhere: distrust, exoticization, and the assumption that infernal heritage means dangerous intent.","resistance":"Fire, Necrotic","vulnerability":"Cryo"},"Troll":{"summary":"Tall, spiritually attuned, culturally diverse across a wide range of immigrant and native-born communities. Around 7 feet tall. Troll culture tends to take seriously the idea that the world has layers that cannot be measured.","passive":"Spiritual Sense: Detect supernatural disturbance, unnatural wrongness, or active magical interference in a location automatically.","active":"Ancestor Call: Once per session, ask one question of the dead in a location where someone has died. The answer is true but may be incomplete or metaphorical. Additionally, your physical presence alone is sufficient to end most non-combat confrontations without a roll.","standing":"Moderate. Spiritual practices exoticized. Physical size read as threat. Faces less systemic discrimination than goblins or orcs, more than elves or halflings.","resistance":"Bludgeoning","vulnerability":"Fire"}},"classes":{"Wrench":{"owns":"Keeping things and people functioning","primary":"Wit, Spark","core":{"name":"Triage","description":"Assess any mechanical, electronic, biological, or structural problem in one round. Know what the immediate problem is and whether it is fixable in current conditions — not a full diagnosis, just what matters right now and whether you can do something about it here. No roll required."},"signature":{"name":"Field Repair","description":"Once per scene, restore a broken piece of equipment, infrastructure, or a Hurt/Wounded character's Wound Track by one step using whatever materials are at hand. No clinic, no workshop, no proper parts required. This is the only ability in the game that moves an ally's Wound Track upward without a downtime scene."},"subclasses":[{"name":"Medic","race":null,"description":"Biological repair, cybernetic surgery, keeping people alive in the field.","abilities":[{"tier":1,"name":"Patch Job","description":"Stabilize a Critical character as a single Action, preventing the death clock from running out this scene. They stay Critical but they stay alive."},{"tier":2,"name":"Field Surgery","description":"During a downtime scene, move any character from Wounded to Hurt or Critical to Wounded with a Wit + Medic roll at Challenging difficulty. Requires basic supplies."},{"tier":3,"name":"Neural Work","description":"Install, remove, or repair cybernetics. Corporate-grade chrome is Challenging. Black market salvage is Hard. Experimental or damaged implants are Severe."}]},{"name":"Rigger","race":null,"description":"Drones, vehicles, automated systems, remote operation.","abilities":[{"tier":1,"name":"Jury Drone","description":"Build a functional drone from salvage during a downtime scene. It has one job: scout, carry, distract, or record. It is fragile. It works until it doesn't."},{"tier":2,"name":"Remote Operation","description":"Take control of any networked mechanical system with a Wit + Hack roll. Difficulty scales with security tier. While operating remotely you are unaware of your immediate surroundings."},{"tier":3,"name":"Dead Man's Machine","description":"Rig any vehicle or large mechanical system to operate autonomously on preset conditions. It follows instructions, not judgment. The instructions had better be good."}]},{"name":"Stronghold Rigger","race":"Dwarf","description":"Dwarven engineering is not a job. It is a relationship with materials that takes decades to develop and never fully ends. A Stronghold Rigger does not repair things. They understand things — the way a machine feels when it is about to fail, the way a building remembers every stress it has been under. The Stronghold Rigger does not need to see the problem. They can hear it.","abilities":[{"tier":1,"name":"Deep Read","description":"Spend one Action examining any machine, structure, or constructed system. The GM must answer three questions truthfully: What is about to fail? What was this built to do that it no longer does? What would make this stronger than it was? This works on buildings, vehicles, weapons, cybernetics, and city infrastructure. No roll required."},{"tier":2,"name":"Living Memory","description":"Any machine or structure you have repaired or significantly modified is part of your working memory. You always know its current condition without examining it — functional, stressed, damaged, or about to fail. You know this the way you know where your hands are."},{"tier":3,"name":"Clan Work","description":"Once per session, produce a piece of equipment, structural modification, or technical solution that should not be possible given available materials and time. This is the Stronghold Rigger's answer to every constraint the city puts on the party. You built it. It works. It will hold. The Rigger who says it will hold means it."}]}]},"Striker":{"owns":"Making violence decisive","primary":"Muscle, Reflex","core":{"name":"Threat Assessment","description":"At the start of any combat, identify the most dangerous target in the room. Allies gain +1 die against that target for the first round. No roll required."},"signature":{"name":"Press","description":"When you hit a target and move the Wound Track, you may immediately move one zone toward them as a free action. They cannot use their React to counter this movement."},"subclasses":[{"name":"Enforcer","race":null,"description":"Corporate or gang muscle. Suppression, intimidation, controlled violence.","abilities":[{"tier":1,"name":"Show of Force","description":"Once per scene, roll Muscle + Intimidate against every enemy in your zone; each resists with a Root check against your successes. Those who fail lose their next Action."},{"tier":2,"name":"Extraction","description":"Physically remove an unwilling person from a situation without triggering combat reactions from bystanders."},{"tier":3,"name":"Controlled Room","description":"While you are present and uninjured in a zone, enemies must spend their Move to enter that zone. You control the space."}]},{"name":"Guerrilla","race":null,"description":"Asymmetric combat. Small force, maximum disruption. You don't win by fighting fair.","abilities":[{"tier":1,"name":"Ambush","description":"If you act before an enemy is aware of you, your first attack automatically moves the Wound Track one additional step."},{"tier":2,"name":"Melt Away","description":"Immediately after landing a successful attack, move two zones instead of one as a free action. Enemies cannot use Reacts to pursue or counter this movement."},{"tier":3,"name":"Attrition","description":"Once per session, designate a target faction or enemy group. Every successful hit generates one morale Stress for the group. At 3 morale Stress they break — retreat, scatter, or make a desperate mistake."}]},{"name":"Iron Code","race":"Orc","description":"Orc martial culture does not separate violence from ethics. The Iron Code is the tradition that says: you demonstrate, you do not claim. You do not threaten what you will not carry out. You do not carry out what you do not need to. Strength is a resource and it is wasted on posturing. An Iron Code striker has never thrown a punch to prove something. They have thrown punches because it was the right answer and they had confirmed this in advance.","abilities":[{"tier":1,"name":"Demonstrated Force","description":"When you succeed on any physical task in a scene, name it. For the rest of that scene, you auto-succeed on that specific task without rolling — you have already shown the room what you can do. Additionally, once per scene, you may substitute a physical demonstration for a social roll when the question is whether you are capable. You do not explain. You show."},{"tier":2,"name":"Controlled Escalation","description":"You choose exactly how much damage you deal on a hit, down to zero. You can strike to incapacitate, to injure precisely, or to kill — the difference between a broken wrist and a broken spine is not luck, it is intention. Additionally, your Intimidate checks gain the force of demonstrated capability: after any successful physical action in a scene, Intimidate checks gain +2 dice for the rest of that scene."},{"tier":3,"name":"The Last Word","description":"Once per session, end a combat by making a single statement — not a threat, a fact about what will happen next if this continues. All enemies who can hear you and who have witnessed your capability in this fight must pass a Root check against your Muscle + Intimidate roll or stand down. This is not magic. It is reputation and evidence arriving simultaneously."}]}]},"Ghost":{"owns":"Not being perceived, recorded, or found","primary":"Reflex, Savvy","core":{"name":"Unseen","description":"Once per scene, vanish from active awareness even in a lit room with people present. This is not invisibility — you use positioning, distraction, and movement. Lasts until you act aggressively or someone actively searches. In combat, enemies who did not see where you went lose targeting on you and cannot attack until they locate you, which requires spending an Action to search. Until located: +2 dice on your next attack, and the target cannot use their React against it."},"signature":{"name":"Clean Entry","description":"When infiltrating a location, if you take time to observe before acting, your first obstacle — lock, guard, camera, barrier — is automatically Routine difficulty regardless of what it actually is."},"subclasses":[{"name":"Extract","race":null,"description":"Getting people and things out of situations they should not be in. Protective movement, clean exits, no trace left behind.","abilities":[{"tier":1,"name":"Covered Exit","description":"When moving an unwilling, injured, or compromised person out of a dangerous situation, neither you nor they trigger security, pursuit, or hostile NPC attention during the movement."},{"tier":2,"name":"Safe Hands","description":"Once per session, move any object from one location to another within the same district without interception, observation, or record. No Heat generated. People require the Tier 3 Gone ability."},{"tier":3,"name":"Gone","description":"Once per session, make a person completely unfindable for up to one week in-game. No corporate tracking, no CBI investigation, no contractor finds them."}]},{"name":"Spy","race":null,"description":"Long-term identity maintenance, corporate infiltration, deep cover.","abilities":[{"tier":1,"name":"Cover Story","description":"Construct a false identity during downtime that holds up to standard background checks and casual corporate screening."},{"tier":2,"name":"Inside Voice","description":"While embedded in a faction or organization, extract one piece of sensitive internal information per session without a roll."},{"tier":3,"name":"Deep Cover","description":"Maintain a fully functional second identity within a faction indefinitely. You have access, standing, and trust as if you were a genuine member."}]},{"name":"Wallflower","race":"Halfling (Fenn)","description":"The city built itself without halflings in mind, which means halflings have spent generations learning to exist in space the city does not register. The Wallflower is not hiding. The Wallflower is simply not where anyone thinks to look. The Unremarkable racial trait is the starting point. The Wallflower is what happens when someone spends a lifetime turning that accident of perception into precision.","abilities":[{"tier":1,"name":"Background Presence","description":"You can be in any social situation — a corporate lobby, a faction meeting, a hostile negotiation — as a background element: serving staff, maintenance, a face in the crowd. No one registers you as significant unless you act significantly. While in Background Presence, you hear everything said, can move freely, and cannot be asked to leave without someone making a deliberate effort to look for you specifically."},{"tier":2,"name":"Negative Space","description":"When you go unseen in a location for a full scene without acting aggressively, you accumulate negative space. The next time you act from that position — attack, steal, speak, or intervene — you cannot be the target of a React that turn, your first roll gains +2 dice, and you are not subject to zone-based restrictions. The halfling who has been there all along acts before anyone knows they were there."},{"tier":3,"name":"The City's Blindspot","description":"Once per session, be somewhere you should not be able to be — inside a locked building, in a secured corporate wing, at a meeting you were explicitly excluded from. You were always there. When asked how you got in: 'The door was open.' The Wallflower has never had to explain this to anyone who wasn't already on their way to understanding it."}]}]},"Signal":{"owns":"Belief, narrative, and attention","primary":"Savvy, Spark","core":{"name":"Read the Room","description":"In any social situation, choose one question to answer without rolling: Who holds the real power in this room? Who is lying? Who is afraid? One question. One true answer. No roll required."},"signature":{"name":"Broadcast","description":"Plant, spread, or suppress a piece of information with enough reach to affect what a faction or group believes. Not what they do — what they believe. Broadcast shapes belief. The Deal shapes behavior. These are different tools."},"subclasses":[{"name":"Performer","race":null,"description":"Music, theater, cultural influence. In a tense situation — including combat — a Performer who starts performing is suppressing the room through undivided attention.","abilities":[{"tier":1,"name":"The Room is Yours","description":"Start performing as your Action. All non-hostile NPCs in the area must succeed on a Savvy check against your Perform roll before taking any aggressive action. A hostile NPC who wants to attack must beat your roll first or spend their Action failing to commit. You are not invisible. You are unavoidable."},{"tier":2,"name":"Anthem","description":"A piece of work you create becomes culturally embedded in a district. Once per session invoke it to grant all allied characters +1 die on Social checks within that district."},{"tier":3,"name":"This Is What We're Fighting For","description":"Once per session, a performance or signal work shifts a neutral NPC faction to active support, or pulls a wavering allied faction back from the edge."}]},{"name":"Hacker","race":null,"description":"System intrusion, data theft, signal disruption. In combat, a Hacker turns the environment hostile to everyone who is not them.","abilities":[{"tier":1,"name":"Tap In","description":"Access any unsecured or lightly secured network, terminal, or communications system as a single Action. In combat, trigger environmental systems — lock a door, kill the lights in a zone, open an escape route, spark a generator. One effect, immediate, no roll against standard systems."},{"tier":2,"name":"Ghost Signal","description":"Broadcast on any frequency — including Velvet Signal's controlled channels and Crownline's internal comms — without being traced for the duration of a scene."},{"tier":3,"name":"Blackout","description":"Once per session, shut down all electronic systems in a single zone for the duration of a scene. Cameras, comms, smart locks, drones, powered armor, neural implants — anything electronic stops."}]},{"name":"Fluid Transmission","race":"Slimefolk","description":"Slimefolk Signal practitioners work from a premise no other species has access to: the body is a medium. Fluid Transmission is the practice of using physical mutability as broadcast infrastructure — shaping not just what you say but who is saying it, and letting the instability of the message become the message itself. A Fluid Transmission Signal can be ten different people before breakfast. The information moves because the carrier keeps changing.","abilities":[{"tier":1,"name":"Adaptive Broadcast","description":"You can perform, broadcast, or present as any species or individual whose physical form you can plausibly approximate. The illusion holds against casual observation. In combination with Broadcast, you can plant information as if it came from a specific person or organization — not just shape what is believed, but shape who is believed to have said it. NPCs receiving the broadcast cannot easily trace it back to you without significant investigation."},{"tier":2,"name":"Signal Residue","description":"Your broadcasts leave traces in people rather than in media. Those who have experienced your performances or broadcasts carry an emotional resonance you can sense — you always know if someone has been exposed to your Signal work and roughly how it landed. Once per session, use this residue to reactivate a previous broadcast's effect in someone who was originally exposed, without broadcasting again."},{"tier":3,"name":"Living Signal","description":"Once per session, become the broadcast entirely — shift your physical form to carry a message, an identity, or an emotional state through physical presence rather than words or media. Everyone in Close range for the duration of a scene experiences you as whatever you have chosen to be, indistinguishable from the real thing until you choose to end it. This is not illusion. It is biology doing what biology does, at scale."}]}]},"Shade":{"owns":"Full magic — casting, channeling, and paying real costs at scale","primary":"Spark, Root","core":{"name":"Read the World","description":"Once per scene, sense the magical or spiritual layer of any location, object, or person. Know if something has been warded, cursed, touched by death, or is carrying active magic. No roll required. Does not tell you what the magic does — just that it is there and what kind."},"signature":{"name":"Channel","description":"Push more through a spell than it was meant to carry. Double the effect of any casting. Additional cost: 1 Stress on top of the casting cost. Technology within Close range has a 1-in-6 chance of malfunction. Channeling in a location with Resonance 2 or higher does not cause tech malfunction."},"subclasses":[{"name":"Death Worker","race":null,"description":"Death magic, communication with the dead, the space between. Death Worker effects are always one difficulty tier easier in locations with active death echoes.","abilities":[{"tier":1,"name":"Speak to the Dead","description":"In any location where someone has died, hold a brief conversation with the most recent dead. Costs 1 Stress. They know what they knew in life. They cannot lie but they can refuse."},{"tier":2,"name":"Death Mark","description":"Place a mark on a living target (1 Stress, Wound Track step). Until removed, you always know their direction and general condition at unlimited range within the city."},{"tier":3,"name":"Threshold","description":"Once per session, pull a character back from the moment of death. Takes your entire turn. Costs one permanent point of Spark — recoverable only through extended downtime and significant narrative event. Can only be used on the same character once."}]},{"name":"Ward Keeper","race":null,"description":"Protection, threshold magic, community defense. Ward Keeper wards persist between sessions without renewed casting cost — maintained, not repeatedly cast.","abilities":[{"tier":1,"name":"Ward","description":"Spend a downtime scene preparing a location. Costs no Stress. Anyone entering with hostile intent must succeed on a Spark check or be immediately known to you and suffer -1 die on all actions within the space."},{"tier":2,"name":"Shelter","description":"Create a warded refuge during a downtime scene. Stress does not accumulate and Conditions cannot worsen within. Lasts until broken or you create a new one."},{"tier":3,"name":"Hold the Line","description":"Once per session, prevent any hostile magical or physical intrusion into a warded space for the duration of a scene. While holding this you can take no other actions. No Stress cost — you are not casting. You are holding."}]},{"name":"Gutter Practitioner","race":"Goblin","description":"Baba dislikes it because it is not proper Goblin magic and not proper anything else. Just cheap nonsense that works anyway, which is a perfect description of goblin survival strategy and a reasonable description of goblin magic at street level. Gutter Practitioners learned sideways — from someone who probably shouldn't have taught them, in a context nobody would call a school. The workings are unstable, the costs are unpredictable, and the output is frequently surprising even to the practitioner. None of this stops them from working.","abilities":[{"tier":1,"name":"Gutter Cast","description":"Your workings do not require formal gestures, spoken incantations, or deliberate preparation. You can cast Minor workings as a free action — a snap, a mutter, a specific tic that you may not even be consciously performing. Minor workings still cost 1 Stress, but they do not consume your Action. Additionally, your Hex working is available as a Gutter Cast free action once per combat. You are not elegant. You are fast."},{"tier":2,"name":"Illusion Work","description":"You have access to the following working regardless of your other subclass abilities. Goblin Illusion (Minor): produce brief visual illusions — up to four copies of yourself, a visual distraction in a zone, or the appearance of something small in a location it isn't. Lasts one round or until touched. Costs 1 Stress as a Gutter Cast (free action, no Action required). Shades reading the layer see these as hollow immediately. They still fool everyone else in the round they exist."},{"tier":3,"name":"Street Luck","description":"Once per session, treat a complete failure on a casting roll as a partial success instead — the working goes wrong, but it goes wrong in a useful direction. The effect that occurs is not what you intended. The GM decides what happens. It will be related to what you tried. It will not be what you asked for. It will probably help anyway, in the way that goblin improvisation usually helps: unexpectedly and at some cost to nearby property."}]},{"name":"Living Memory","race":"Elf","description":"Elven magical practice is not street-level and is not gutter work. It is the residue of centuries of institutional attunement — the long slow accumulation of a species that has been in contact with magic long enough to have shaped each other. A Living Memory Shade works with historical resonance rather than fresh echoes. Where a Death Worker reads the recent dead, a Living Memory practitioner reads what has been true for a long time. Old wards. Ancient promises. The magic that has been in a place since before the current occupants were born.","abilities":[{"tier":1,"name":"Deep Resonance","description":"In any location with documented history — a building over fifty years old, a named place, a space where significant events have occurred across multiple generations — treat your Resonance as one tier higher than it actually is. In a location with no history (a new construction, a temporary space, a place without a name), treat your Resonance as one tier lower. You are fed by what endures. You are diminished by what is temporary."},{"tier":2,"name":"Institutional Memory","description":"Once per session, access the magical record of a location — not echoes, but the deep accumulated impression of everything that has been done there across its entire history. The GM tells you: the most significant magical event in this location's history, the oldest promise or agreement still active in this space, and whether anything here has been deliberately hidden from magical reading. This requires no roll and costs nothing. You have simply been in enough places to know how to listen."},{"tier":3,"name":"The Long View","description":"Your Hex working can target organizations and factions rather than individuals — a corporation, a government office, a faction power structure. The hex applies a -1 die penalty to all actions taken in service of that organization's current objective. This lasts until the objective changes or the hex is Disrupted. An elf who hexes Crownline's Stabilization Initiative is hexing the idea, not the employees — every action taken in service of that specific plan carries the cost."}]},{"name":"Ancestor Work","race":"Troll","description":"Troll Shade practice is not separate from troll spiritual culture — it is the deep end of it. Where troll ancestor veneration is a relationship (the dead as family, the Ancestor Call as a conversation), Ancestor Work is the practice of making that relationship operative in the world. An Ancestor Work Shade does not communicate with the dead. They work with the dead. There is a difference, and the difference is that working with the dead has costs and produces effects.","abilities":[{"tier":1,"name":"The Council","description":"You carry a council of ancestors — not as a metaphor, but as a practice. Once per session, convene the council: ask three questions that can be answered from the collective memory of your bloodline and the bloodlines you have been given access to through relationship. The ancestors answer what they know. They do not know the future. They know everything that has happened to your people and your people's people, which is more than most living creatures know about anything."},{"tier":2,"name":"Place Work","description":"Your Resonance applies to any location your people have occupied for more than one generation — not just places you have personally worked. The troll community's relationship with a place is your relationship with a place. In such locations you can perform any working at one cost tier lower without requiring personal Resonance. Adyta has troll neighborhoods that have been troll neighborhoods for longer than any corporation has existed."},{"tier":3,"name":"Inherited Debt","description":"Once per session, invoke an ancestor's unresolved obligation as a working. The ancestor owed someone a debt, swore an oath, or made a bargain that was never fulfilled. Invoking it forces the world to recognize the debt as real and current — a named faction or NPC must respond as if the original obligation applies to them now. This is the most powerful and most dangerous thing an Ancestor Work Shade does: the dead's unfinished business becomes yours, and the people owed by the dead will notice."}]}]},"Broker":{"owns":"Leverage, deals, and obligation","primary":"Savvy, Root","core":{"name":"The Angle","description":"Once per session, identify a named NPC's leverage point — what they want, what they fear, what they cannot afford to lose. Gain +2 dice on all social checks against them for the remainder of the session. In combat, use this as your Action to force a single enemy to hesitate — they cannot act aggressively on their next turn while they calculate whether continuing is worth it. Does not work on people who have decided they have nothing left."},"signature":{"name":"The Deal","description":"Broker an agreement between two parties that neither would have reached alone. Both parties hold to the deal mechanically — breaking it has immediate faction consequences. In combat, propose terms as your Action — both sides make a Savvy check to refuse. If either fails, they stand down. This is finding the exit everyone wanted but nobody could say out loud."},"subclasses":[{"name":"Fixer","race":null,"description":"Freelance job negotiation, neutral party operations. A Fixer in combat is never the intended target — they arranged the room, know who everyone is, and had three exits planned before the first punch.","abilities":[{"tier":1,"name":"The Job","description":"Once per session, generate a paying job from your contact network — a task with a defined reward."},{"tier":2,"name":"Neutral Ground","description":"Declare any location neutral ground for a meeting. All parties cannot initiate hostilities without losing standing with every faction present. If hostilities break out anyway, you always act first in the resulting combat."},{"tier":3,"name":"The Network","description":"You have a contact in every major faction. Once per session, call in a favor — backup arrives, an enemy gets pulled off the field, or a door opens. It costs obligation. Track what you owe."}]},{"name":"Syndicate","race":null,"description":"Criminal network ties, black market access, underground economy. A Syndicate Broker's combat role is resources and backup — odds fixed before the shooting started.","abilities":[{"tier":1,"name":"Market Access","description":"Acquire any non-military weapon, illegal modification, controlled substance, or restricted document given downtime and credits. Supply the party one piece of Restricted equipment per session without an acquisition roll."},{"tier":2,"name":"Clean Money","description":"Move credits through enough layers to become untraceable. Once per session, offer a financial incentive to a single enemy NPC to stand down, switch sides, or look the other way."},{"tier":3,"name":"The Organization","description":"You have standing within a named criminal organization. Once per session, call on them for muscle, logistics, information, or cover. In combat: one to three affiliated NPCs arrive within one scene. They are loyal to the organization. They leave when the job is done."}]},{"name":"Ember Court Factor","race":"Cinderfolk","description":"Ember Court deals in obligations, and Cinderfolk have been in that business longer than the corporations have existed. An Ember Court Factor does not broker deals in the ordinary sense — they encode them. The infernal-heritage tradition of contract magic makes agreements into physical facts. An Ember Court Factor's word is worth more than most people's signatures because everyone who has dealt with one knows what it means when they commit.","abilities":[{"tier":1,"name":"Binding Terms","description":"When you formalize an agreement you personally broker, the terms carry weight beyond legal enforceability. Both parties feel the binding as a physical fact — not Oath-Touched's faint unease, but a real pressure, like a hand on the shoulder. Neither party can easily pretend the agreement does not exist. Breaking it generates immediate faction consequences and the GM may introduce a scene-level complication within one session of the breach."},{"tier":2,"name":"Read the Ledger","description":"You can examine any existing agreement, contract, or obligation — formal or informal — and determine: whether it has been violated, who holds the leverage, and what the breaking point is. Once per session, use this knowledge to reframe an existing deal in your favor without technically violating its terms. The Ember Court Factor finds the language the other party did not know to protect."},{"tier":3,"name":"Factor's Authority","description":"Once per session, invoke your standing as an Ember Court Factor to pause any conflict, negotiation, or confrontation while you propose new terms. All parties must hear you out — not comply, but listen. If any party accepts your terms in the following round, the situation resolves on those terms and Standing changes accordingly. An Ember Court Factor who speaks in the name of the Court carries institutional weight that transcends individual faction Standing."}]}]},"Warden":{"owns":"Authority, procedure, and civic force","primary":"Muscle, Savvy","core":{"name":"Jurisdiction","description":"In any official interaction, invoke your authority to pause or redirect a situation. NPCs must respond before escalating. This is a guarantee of a moment, not compliance."},"signature":{"name":"De-escalation","description":"Once per scene, end a confrontation before it becomes combat. All parties must stand down for at least one round while you speak. If anyone breaks the stand-down, they do so visibly, on record, as the aggressor."},"subclasses":[{"name":"Investigator","race":null,"description":"CBI detective work, forensics, corruption trails, following the evidence.","abilities":[{"tier":1,"name":"Scene Read","description":"Spend one Action examining a location. The GM must answer three yes/no questions truthfully about what occurred there."},{"tier":2,"name":"The Trail","description":"Once you have a lead, you cannot lose the trail passively. Following it reveals one new true fact per downtime scene."},{"tier":3,"name":"Case Built","description":"Assemble documented evidence constituting a legally actionable case. Presenting this forces an official response."}]},{"name":"Advocate","race":null,"description":"APA legal work, tenant defense, rights protection, fighting the system with its own tools.","abilities":[{"tier":1,"name":"Know the Law","description":"Once per session, identify a specific legal mechanism that applies to the current situation and can be invoked to protect someone or obstruct a corporate action."},{"tier":2,"name":"Filing","description":"Submit a formal legal challenge against a corporate or civic action. The action is legally paused while the challenge processes."},{"tier":3,"name":"Precedent","description":"Win a legal case or ruling that creates a binding precedent in the city's civic record, permanently affecting all similar situations going forward."}]},{"name":"City Architect","race":"Human","description":"The city was built for humans, which means humans understand its institutional machinery at a depth other species simply don't have access to. The City Architect is what happens when a human Warden stops using the city's systems and starts operating them — not for the corps, not for the ACW, but as the systems actually work when properly understood. The City Architect has read the original charter documents. They know which rules were written to protect people and which were written to protect property.","abilities":[{"tier":1,"name":"System Fluency","description":"Once per session, identify an institutional mechanism — a regulation, a civic procedure, a legal precedent, a bureaucratic pathway — that technically applies to the current situation and can be invoked to change it. The mechanism is real and binding. Corporations must respond to it. The ACW must respond to it. The GM cannot simply ignore it. City Architect abilities do not create new rules — they find the rules that already exist and have never been used for this purpose."},{"tier":2,"name":"Procedural Defense","description":"Create a formal civic record of any event, agreement, or action. The record is official, timestamped, and admissible. Once a record exists, altering it requires significant institutional resources and generates Heat for whoever attempts it. Once per session, this can be used to create a legal barrier to a corporate or civic action — the barrier holds until formally challenged, which takes time the other side may not have."},{"tier":3,"name":"Rewrite the Room","description":"Once per session, invoke a formal institutional process — a public hearing, a civic inquiry, a mandated review — that forces a faction or corporation to act within official channels for the duration of a scene. They cannot use informal pressure, muscle, or deniable assets while the process is active. They must respond as the institution they claim to be. This is the most powerful thing a City Architect does: it makes power accountable to its own rules, briefly, in public."}]}]},"Runner":{"owns":"Routes, delivery, terrain, and movement","primary":"Reflex, Root","core":{"name":"City Read","description":"Always know the fastest route between any two points in a familiar district — official and unofficial. Never need to roll Navigation in familiar territory. In combat in familiar territory: you always know where every exit is, which cover positions are accessible, and which routes enemies cannot follow. Before any combat begins in familiar territory, the GM must tell you one true fact about the terrain that no other character knows — a hidden exit, a structural weakness, a position that controls the whole room. This is not a roll. You just know. A familiar district means any district where you hold grithrakt or better — see Chapter Eight: Grith."},"signature":{"name":"Burn the Route","description":"Once per session, move yourself and up to three allies from one location to another in the same district without any chance of interception, surveillance, or pursuit. This works mid-combat as an extraction — those characters are gone, the fight ends for them, and the enemies cannot follow."},"subclasses":[{"name":"Lhl Courier","race":null,"description":"Low Halo Logistics — delivery and physical movement through the city. LHL Courier is about moving things through a city that does not want things moved. The information the network generates is a side effect of movement, not the point.","abilities":[{"tier":1,"name":"Package Sense","description":"You always know what you are carrying, who else wants it, and the fastest way to deliver it that avoids the people who want it. Once per session, identify an interceptor before they make their move — giving you one full round of advance awareness."},{"tier":2,"name":"The Drop","description":"Transfer any object or message to any person in the city within 24 in-game hours, without being observed or intercepted."},{"tier":3,"name":"Phantom Delivery","description":"Once per session, make a delivery that cannot be traced — not to you, not to the recipient, not to whoever sent it. No record exists. No surveillance catches it."}]},{"name":"Rooftop","race":null,"description":"Elevated routes, aerial access, architectural movement above street level.","abilities":[{"tier":1,"name":"High Ground","description":"Access the rooftop level of any building in a known district without a roll. Once up, effectively invisible to street-level surveillance."},{"tier":2,"name":"Aerial Approach","description":"Enter any building from above — roof access, ventilation, upper windows — without triggering ground-floor security."},{"tier":3,"name":"The City From Above","description":"While on rooftop level, observe everything in your current zone and all adjacent zones simultaneously. Once per session this reveals something nobody on the street could have seen."}]},{"name":"Threnn Guide","race":"Goblin","description":"Threnn — the unofficial routes, the paths that exist because people walked them. A Threnn Guide does not navigate the city. They are the city's navigation system, specifically the version that the city does not officially acknowledge. Every clan has their routes. The Threnn Guide knows routes across clans, across districts, across the boundaries that the official city draws between its own neighborhoods. The threkktun runs everywhere the official map says there is nothing.","abilities":[{"tier":1,"name":"The Unofficial City","description":"Your City Read ability covers the entire city, not only familiar districts. In any district, you know the threkktun — the unofficial routes, the places the city forgot to lock, the maintenance corridors that connect everything the official city keeps separate. In unfamiliar districts your City Read is still active; you simply know the unofficial layer rather than the specific local details. The threkktun is consistent. Human architecture is not as different as humans think."},{"tier":2,"name":"Clan Road","description":"Once per session, move the entire party through a route that officially does not exist — bypassing a controlled district, a corporate perimeter, a civic checkpoint, or any other official barrier. The route exists. It has always existed. Nobody who doesn't know the threkktun will find it, and nobody who does find it will catch you on it. Clan Road cannot be used in the same district twice in the same arc — the routes shift after use."},{"tier":3,"name":"Route Memory","description":"The threkktun lives in your body, not your head. You cannot be lost or cut off. If separated from the party anywhere in Adyta, you find your way back within one scene. Once per session, recall a route you have used before in perfect detail, including new locks, patrols, damage, and doors since your last passage."}]}]}},"origins":{"Tangle-Born":{"race":"Goblin","grith":"The Tangle","desc":"Raised inside the Tangle Clan and Three Wires: territorial, community-first, and fluent in routes the official city does not recognize.","standing":"Tangle Clan: 4 (Known). Crownline: 2 (Suspect) — the clan’s reputation precedes you.","contact":"An older Tangle goblin — a thrennkin mentor, a clan elder, the one who taught you the routes. They know things. They have expectations.","skill":"Navigate at Novice — you know the unofficial city in your bones.","obligation":"Once per arc the Tangle Clan calls in a favor. Specific, inconvenient, and more than you can easily repay. The clan is community-first. You are part of the community whether this week is convenient or not.","complication":"Corporate and high-status spaces clock you on sight. Accent, routes, instincts — all of it reads Tangle. You start at a social disadvantage in Noble Heights and New Halo until you prove otherwise.","grantOptions":[{"type":"skill","name":"Navigate"}]},"Ashborn":{"race":"Goblin","grith":"Southern Industrial Belt","desc":"Raised in the industrial Ashborn clan: pragmatic work culture, machine repair, salvage, and corporate-adjacent survival.","standing":"Ashborn Clan: 4 (Known). Tangle Clan: 2 (Suspect) — they think you sold out. Bastion or Helix: 3 (Neutral) — you have worked their floors.","contact":"An Ashborn foreman, machinist, or shift-boss. They can get you onto an industrial site, vouch for your hands, or find you paying work. They expect you to be competent. Incompetence shames the clan.","skill":"Repair at Novice OR Forge at Novice — your hands learned before your mouth did.","obligation":"Work is the measure. Once per arc the clan expects you to show up for a job — real labor, often dangerous, always for the collective. Refusing reads as forgetting what you are.","complication":"The Tangle and the Commons do not fully trust goblins who work corporate floors. To them, proximity to the machine is proximity to the enemy. You carry that suspicion into Commons spaces whether you earned it or not.","grantOptions":[{"type":"skill","name":"Repair"},{"type":"skill","name":"Forge"}]},"Tidecrew":{"race":"Goblin","grith":"The Ashrun","desc":"Raised around dockside shipping, smuggling, river navigation, and information as freight.","standing":"Tidecrew Clan: 4 (Known). Meridian Logistics: 3 (Neutral) — you move in the same water. The Underground: 3 (Neutral) — they use you, carefully.","contact":"A Tidecrew smuggler, dockhand, or information broker. They know what is coming into the city and when. They will trade it. They keep contracts and remember who doesn’t.","skill":"Streetwise at Novice OR Intel at Novice — you learned to read the current.","obligation":"A struck deal holds. If you make an agreement in play, the Tidecrew code binds you mechanically — break a deal you struck and your Tidecrew Standing drops to 0 and stays there until restitution. The clan’s whole identity is that contracts hold.","complication":"Nobody trusts the Tidecrew further than they have to. Your clan name means transactional. People assume you can be bought, because historically the assumption paid off.","grantOptions":[{"type":"skill","name":"Streetwise"},{"type":"skill","name":"Intel"}]},"Patchkin":{"race":"Goblin","grith":"Scrapfields","desc":"Raised in the Scrapfields pocket among salvage, electronics recovery, and broken things that still have value.","standing":"Patchkin Clan: 4 (Known). Helix Systems: 2 (Suspect) — scrappers find things Helix would rather stayed lost.","contact":"A Patchkin salvage-engineer who can source impossible components and tell you, by feel, whether a thing was abandoned or placed. They expect you to respect what you recover.","skill":"Salvage at Novice OR Repair at Novice — you know what still sparks.","obligation":"Nothing is truly dead. Once per arc, something you recovered turns out to matter — to someone dangerous, to a job, to the clan. The Patchkin attachment to objects is not sentiment. It is a worldview, and it has consequences.","complication":"Your gear is unmistakably scrap-built. Patchwork tools, recovered tech, the marks of someone who builds from the discarded. In corporate or high-status spaces this reads before you open your mouth.","grantOptions":[{"type":"skill","name":"Repair"},{"type":"skill","name":"Salvage"}]},"Dustwalker":{"race":"Goblin","grith":"Ash Wastes","desc":"Raised at the city edges and beyond, comfortable where urban residents stop pretending the map continues.","standing":"Dustwalker Clan: 4 (Known). All urban clans: 2 (Suspect) — they consider you barely civilized. Civic and corporate institutions: 2 (Suspect) — you are off every registry that matters.","contact":"A Dustwalker who ranges the edges — a guide, a trader in things from outside, someone who knows the routes past the last lit street. They surface rarely and owe the city nothing.","skill":"Endure at Novice OR Navigate at Novice — the edge teaches both.","obligation":"The edge calls. Once per arc, something from outside the city’s settled core needs you — a route to walk, a person to find past the wall, a thing the urban clans cannot or will not handle. You are the one who goes.","complication":"You are illegible to the city. No registry, no fixed address, no institutional footprint. This is freedom and it is a wall. Anything that requires the city to recognize you officially is Hard at minimum until you find a workaround. Other Race-Locked Origins Heritage is mechanically real. These Origins are locked to a single race because the community, enclave, or inheritance is. Each gives a Standing modifier, a signature trait, and a hook. Open Origins follow.","grantOptions":[{"type":"skill","name":"Endure"},{"type":"skill","name":"Navigate"}]},"Forge-Clan Dwarf":{"race":"Dwarf","grith":"Southern Industrial Belt","desc":"Raised in dwarven engineering strongholds and their practical culture of materials, labor, and structural memory.","standing":"Your stronghold clan: 4 (Known). Industrial factions (Bastion, Meridian): 3 (Neutral) — your hands are known.","signatureTrait":"Once per session, identify the structural truth of any built space — what holds it up, what is about to fail, what was added later and hidden. Free, no roll.","hook":"A stronghold elder holds your indenture-debt — the cost of your training. They have not called it. They will.","grantOptions":[]},"Martial Orc":{"race":"Orc","grith":"","desc":"Raised in an orc martial tradition where competence is demonstrated rather than claimed.","standing":"Orc martial community: 4 (Known). Bastion Dynamics: 3 (Neutral) — they recruit from your tradition and you know their floor.","signatureTrait":"Once per scene, when you back a claim about your own capability with action, gain +1 die on the roll. You do not bluff. You demonstrate.","hook":"Someone from your tradition believes you owe them a reckoning — a fight, a debt of honor, a thing left unfinished. They will collect in front of people.","grantOptions":[]},"Ember Court Cinderfolk":{"race":"Cinderfolk","grith":"Ember Court","desc":"Raised inside Ember Court infernal-heritage culture, threshold work, inherited craft, and occult commerce.","standing":"Ember Court Trade: 4 (Known). General Commons: 2 (Suspect) — infernal heritage reads as dangerous outside the Court.","signatureTrait":"You begin with the Threshold-Schooled Street Magic Tag for free, and your threshold work is recognized on sight within Ember Court.","hook":"An old family arrangement — a bargain, a debt, an inherited obligation — is still open. Ember Court keeps accounts. Yours is not settled.","grantOptions":[]},"Old-Blood Elf":{"race":"Elf","grith":"Noble Heights","desc":"Raised around entrenched elven institutions, academia, old money, and governance.","standing":"Noble Heights / institutional contacts: 4 (Known). Commons factions: 2 (Suspect) — elven privilege is not quickly forgiven.","signatureTrait":"Once per session, recall a true historical fact about Adyta’s institutions, factions, or infrastructure that no one else at the table would know. Long memory is a resource.","hook":"Your family or institution wants something from you that you left them to avoid. They are patient, well-resourced, and they know where you are.","grantOptions":[]},"Spirit-Kept Troll":{"race":"Troll","grith":"","desc":"Raised in a troll community centered on ancestor veneration, spiritual attunement, and the long view.","standing":"Your troll community: 4 (Known). General city: 3 (Neutral) — trolls face less systemic suspicion than goblins, more exoticization than most.","signatureTrait":"Once per session, sense whether a location holds spiritual significance, recent death, or active wrongness — automatic, no roll. The layers are visible to you.","hook":"An ancestor obligation binds you — a duty owed to the dead, a place that must be tended, a name that must be carried. The dead are family. Family asks.","grantOptions":[]},"Tidewater Slimefolk":{"race":"Slimefolk","grith":"The Ashrun","desc":"Raised in slimefolk community and culture, unusually close to magical principles and fluid identity.","standing":"Slimefolk community: 4 (Known). Conservative or older communities: 2 (Suspect) — the prejudice runs deep and old.","signatureTrait":"Your shapechanging passes casual inspection without a roll, and you read other slimefolk’s true states others cannot. Identity is fluid; you are fluent in it.","hook":"Someone from your community needs your particular biology or particular discretion for something they cannot ask anyone else. The community protects its own and expects the same.","grantOptions":[]},"City-Born Human":{"race":"Human","grith":"Central Core","desc":"Raised within the human-majority systems the city was largely designed to serve.","standing":"One institution of your choice (corporate or civic): 4 (Known). No faction starts you below Neutral on heritage alone.","signatureTrait":"Institutional Access: you enter corporate lobbies, civic buildings, and official spaces without immediate suspicion. The default is built for you.","hook":"The institution you came up in considers you one of theirs. Once per arc they act on that assumption — a request, an expectation, a door held open with strings attached.","grantOptions":[]},"Ember Court Raised":{"race":null,"grith":"Ember Court","desc":"Raised around legal occult shops, back-room practitioners, and contract lawyers for obligations nobody else touches.","standing":"Ember Court Trade: 4 (Known). Helix Systems: 2 (Suspect) — Helix dislikes unregulated practice.","contact":"An Ember Court practitioner, shop owner, or contract specialist. They source what the official market does not carry. They will want something back.","skill":"Street Magic Tag: Oath-Touched OR Ward-Literate.","obligation":"An unresolved past arrangement — a debt, a contract, a bargain that did not fully close — resurfaces once per arc. Define it with the GM at creation.","complication":"You know too much about how binding agreements actually work. Allies treat this as an asset. The people you made old arrangements with treat it as a liability. Both are right.","grantOptions":[{"type":"skill","name":"Ward"},{"type":"tag","name":"Oath-Touched"},{"type":"tag","name":"Ward-Literate"}]},"Sewers Community":{"race":null,"grith":"The Sewers","desc":"Lived below for a meaningful stretch and knows the Sewers as a community, not merely a corridor.","standing":"Sewers Community: 4 (Known). ACW: 2 (Suspect) — extended underground residence raises flags.","contact":"Someone from Radio Sewers, Broken Wing Forge, or the tunnel community. They trust you because you stayed when you could have left.","skill":"Street Magic Tag: Tunnel-Sighted.","obligation":"The Sewers community is unorganized but needy. Once per session a member makes a request — information, a delivery, a warning carried. Small things. Consistently.","complication":"Surface institutions distrust long underground histories. ACW assumes something drove you down. Corporate HR flags the gap. Some of it is prejudice. Some of it is that something did drive you down there.","grantOptions":[{"type":"tag","name":"Tunnel-Sighted"}]},"Civic Brat":{"race":null,"grith":"Central Core","desc":"Grew up around official city systems, whether through family employment or repeated processing by them.","standing":"ACW: 4 (Known). Tangle Clan: 2 (Suspect) — civic familiarity reads institutional to people the institutions have hurt.","contact":"A current or former civic employee — a warden, a registry clerk, a housing advocate. They can pull records, flag filings, or lose paperwork. They have their own constraints.","skill":"Streetwise at Novice OR Threshold-Schooled (if your background includes a civic-protection tradition).","obligation":"Civic systems remember you. Once per arc an institution calls in what it considers a cooperative relationship — testimony, a statement, an inquiry. Refusal has consequences.","complication":"The Underground warms to civic-adjacent people slowly. Your comfort with official systems reads as willingness to use them against communities those systems have historically hurt. You earn trust others start with.","grantOptions":[{"type":"skill","name":"Streetwise"},{"type":"tag","name":"Threshold-Schooled"}]},"Noble Heights Fallen":{"race":null,"grith":"Noble Heights","desc":"Once had money or proximity to it. The access is gone; the fluency and resentment remain.","standing":"Noble Heights institutional contacts: 3 (Neutral — known, but your status is complicated). Tangle Clan: 2 (Suspect) — old-money residue is not quickly forgiven.","contact":"A former family associate, an old-money peer who stayed, or a servant who knew your family better than they knew themselves. They have access you no longer officially hold.","skill":"Negotiate at Novice OR Persuade at Novice — you learned rooms where the wrong word costs.","obligation":"The fall was not clean. Once per arc something from that life returns — a family debt, a pursued claim, a connection that wants your old name. Define it at creation.","complication":"You know which fork gets you past security. You also know the people in those rooms will eventually remember you are not supposed to be there. The access is real. The belonging is not.","grantOptions":[{"type":"skill","name":"Persuade"},{"type":"skill","name":"Negotiate"}]},"Service-Level Kobold":{"race":"Kobold","grith":"","desc":"Raised in a kobold crew within Adyta’s subterranean service infrastructure, useful and invisible by design.","standing":"Kobold crew network: 4 (Known). Sewers Community: 3 (Neutral) — you share infrastructure. Corporate service floors: 3 (Neutral) — you are tolerated as labor, which is access, and erasure.","signatureTrait":"In any inhabited building or district, you can locate other kobolds automatically — the crew is always somewhere nearby. Additionally, once per session, produce a piece of information about a building’s interior that no one with surface-level access would know.","hook":"Your crew did a job inside a corporate facility that they should not have been able to complete. The job paid. Someone noticed it was done. Nobody came forward about how. That is an open account, and open accounts close eventually.","grantOptions":[]},"Fenn-Born Halfling":{"race":"Halfling (Fenn)","grith":"Market Ring","desc":"Raised in the halfling trade networks threading the Market Ring and transit corridors, where being underestimated became professional strategy.","standing":"Halfling trade network: 4 (Known). Market Ring merchants: 3 (Neutral) — they know your family name or someone who does.","signatureTrait":"Once per session, you know someone in whatever district you are currently operating in — a vendor, a courier, a former neighbor, a relative of a relative. They owe your family something. Not a lot. Enough.","hook":"Your family network did a favor for someone powerful and never collected. That debt belongs to whoever carries the family name now. You carry it. The person who owes it has not forgotten, and they are going to collect or be collected from, and either way your name is attached. Open Origins Any race. These are places and communities mixed enough that heritage does not gate them.","grantOptions":[]}},"lives":{"Low Halo Regular":{"grith":"Low Halo","desc":"Low Halo is where you landed and kept showing up until the people, routes, walls, and obligations became yours.","standing":"The Underground: 4 (Known). ACW: 3 (Neutral) — regulars are known to the wardens, neither trusted nor suspected.","contact":"Someone at the Grit Pit, Boil and Bite, or Saint Static Arms — a musician, a bartender, a neighbor. They know everything that moves through the district.","skill":"Streetwise at Novice — you know Low Halo’s social architecture.","obligation":"Low Halo needs things. Once per session the district generates a problem — a venue threatened, a neighbor in trouble, a wall about to be painted over — that nobody asked you to handle and that will not get handled if you don’t.","complication":"Crownline’s Stabilization Initiative has a file on this district, and you are in it — by address, by association, by being a known regular who has been here long enough to matter. Their interest in the district is interest in you.","grantOptions":[{"type":"skill","name":"Streetwise"}]},"Corporate Castoff":{"grith":"","desc":"You were useful to a corporation until you were not. You know the inside, and the inside still has a file on you.","standing":"One named corporation: 3 (Neutral — they know you exist and haven’t decided what to do about it). The Underground: 3 (Neutral — corporate history makes them cautious).","contact":"A former colleague, supervisor, or fellow castoff still inside. They can pull internal information. They are also monitored.","skill":"Hack at Novice OR Deceive at Novice — you learned one to survive inside.","obligation":"You signed something — NDA, non-compete, data agreement, a consent form with unusual clauses. Once per arc the corp reminds you it exists. What they want varies. That they can enforce it does not.","complication":"The corporation has a file on you and it is accurate. In corporate-adjacent spaces someone occasionally recognizes your face or credentials. Not always bad. Never entirely safe.","grantOptions":[{"type":"skill","name":"Hack"},{"type":"skill","name":"Deceive"}]},"On the Books":{"grith":"","desc":"You hold current or recent legitimate corporate employment, institutional cover, and a handler who files reports.","standing":"Your corporation: 4 (Known — they know exactly who you are). The Underground: 2 (Suspect) — current employment makes operators careful.","contact":"A direct superior or corporate peer who owes you something. They have institutional access. They also have a documented relationship the corp can read.","skill":"Deceive at Novice OR Hack at Novice — employment teaches one whether you wanted it or not.","obligation":"You are on the books. Once per session the corp has a reasonable expectation of your availability, location, or cooperation. Ignoring it degrades Standing. Complying shapes what you become.","complication":"Everything on corporate time is logged. Everything contradicting your employment profile creates a discrepancy someone flags. The access is genuine. The surveillance is total.","grantOptions":[{"type":"skill","name":"Hack"},{"type":"skill","name":"Deceive"}]},"Contractor":{"grith":"","desc":"You perform deniable gig work for corporations, paid per job and protected by nothing.","standing":"One named corporation: 3 (Neutral — transactional, not personal). Freelance network: 4 (Known — contractors know each other).","contact":"A corporate handler or a fellow contractor on the same circuit. The handler has jobs. The contractor has perspective the handler doesn’t.","skill":"Endure at Novice OR Intimidate at Novice — the work builds one.","obligation":"Once per session the corp has a job available. You needn’t take it. Turning down too many degrades the relationship. Taking them builds a record — the corp’s record, not yours.","complication":"Deniable cuts both ways. The corp won’t protect you if a job goes wrong and will deny the relationship existed. Your work is documented internally. You cannot access that documentation.","grantOptions":[{"type":"skill","name":"Intimidate"},{"type":"skill","name":"Endure"}]},"Scrapfields Picker":{"grith":"Scrapfields","desc":"You make a living in the southeast salvage zone, reading waste, value, and the things that find people there.","standing":"Patchkin Clan: 4 (Known). Helix Systems: 2 (Suspect) — scrappers find things Helix would rather stayed lost.","contact":"A Patchkin salvage expert or a fellow picker who knows the fields and can tell genuine abandonment from a placement.","skill":"Salvage at Novice — you know what still sparks.","obligation":"Something you pulled from the fields is not finished with you. Once per arc it resurfaces — an owner you didn’t know it had, a buyer who was looking, a piece of tech that wants to keep running. Define it at creation.","complication":"Scrapfields gear is identifiable. Your loadout and habits carry the marks of someone who builds from the discarded. In corporate or high-status spaces, that reads before you speak.","grantOptions":[{"type":"skill","name":"Salvage"}]},"Edge Dweller":{"grith":"","desc":"You live where the grid gets thin and infrastructure runs on salvage and goodwill.","standing":"Dustwalker Clan: 3 (Neutral) — they respect edge-familiarity regardless of species. ACW: 2 (Suspect) — edge residency reads as off-registry. Crownline: 2 (Suspect) — they do not control the edge and resent it.","contact":"A long-term edge resident — any race, any background — who has been out here longer than you and knows which parts of the margin are safe, which are contested, and which the city has quietly decided do not exist.","skill":"Endure at Novice OR Navigate at Novice — the edge teaches both and you chose one earlier.","obligation":"The edge community is loose but real. Once per session someone out here needs something moved, carried, warned about, or handled — the kind of job that does not exist on paper and does not pay in credits. It pays in the edge remembering you belong here.","complication":"You are illegible to the city’s systems in the way all edge residents are: off-registry, no fixed official address, no institutional footprint the corps can use. Anything requiring the city to formally recognize you is Hard at minimum. This is also why you can disappear when you need to.","grantOptions":[{"type":"skill","name":"Endu
