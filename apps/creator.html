<script>
/* GRAKKGRITH rules live in data/rules.json. The shell injects them as window.GRAKK_RULES;
   when this page is opened on its own (development), load the file directly. */
window.GRAKK_RULES = window.GRAKK_RULES || (function () {
  var x = new XMLHttpRequest(); x.open('GET', new URL('../data/rules.json', location.href), false); x.send();
  if (x.status !== 200) throw new Error('GRAKKGRITH: could not load data/rules.json');
  return JSON.parse(x.responseText);
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(24,246,255,.14),transparent 30%),radial-gradient(circle at 90% 5%,rgba(255,61,183,.12),transparent 28%),var(--bg);color:var(--text);font-family:var(--font)}button,input,select,textarea{font:inherit}.wrap{max-width:1250px;margin:auto;padding:16px}.head,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(7,19,28,.97),rgba(2,7,11,.98));box-shadow:0 0 18px rgba(24,246,255,.13);padding:16px}.head{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:12px}.title{font-size:34px;font-weight:900;color:var(--cyan)}.sub{color:var(--pink);font-weight:800}.small,.desc{font-size:12px;color:var(--muted);line-height:1.45}.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:12px 0}.stepDot{height:8px;background:#10222c;border:1px solid rgba(24,246,255,.25)}.stepDot.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}.stepDot.done{background:var(--green)}.layout{display:grid;grid-template-columns:240px 1fr;gap:12px}.nav button{display:block;width:100%;text-align:left;margin-bottom:6px}.panel h2{margin:0 0 8px;color:var(--cyan)}.panel h3{color:var(--yellow);margin:14px 0 7px}label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}input,select,textarea{width:100%;background:#02070b;color:var(--text);border:1px solid rgba(24,246,255,.35);padding:9px}textarea{min-height:80px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{border:1px solid rgba(24,246,255,.3);padding:10px;background:#030b11;cursor:pointer}.choice.selected{border-color:var(--yellow);box-shadow:0 0 10px rgba(255,225,75,.2)}.choice.disabled{opacity:.35;cursor:not-allowed}.choice strong{color:#fff}.tag{display:inline-block;border:1px solid currentColor;padding:2px 6px;margin:2px;color:var(--c </style></head><body><div class="wrap">
<div class="head"><div><div class="title">GRAKKGRITH</div><div class="sub">Guided Character Creator v5 · Rules v1.47</div><div class="small">Legal choices only. Derived values fill themselves. The city still charges separately.</div></div><div><button id="loadDraft">Load Draft</button><button id="reset" class="danger">Clear Draft</button></div></div>
<div class="progress" id="progress"></div>
<div class="layout"><aside class="panel nav" id="nav"></aside><main class="panel"><div id="step"></div><div class="footerNav"><button id="back">Back</button><button id="next" class="primary">Next</button></div></main></div>
</div><script>
const DATA=(R => ({ races: R.races, raceDetails: R.raceDetails, classes: R.classes, origins: R.origins, lives: R.lives,
  streetTags: Object.fromEntries(Object.entries(R.streetTags).map(([k, v]) => [k, v.summary])),
  skills: R.skills, skillKeys: R.skillKeys, startingLoadouts: R.startingLoadouts, territories: R.territories.map(t => t.name) }))(window.GRAKK_RULES);
const STEPS=['Identity','Race','Origin','Life','Class','Attributes','Skills','Magic','Starting Gear','Territory','Review'];
const ATTRS=['muscle','reflex','wit','savvy','spark','root'];
const ALL_SKILLS=Object.values(DATA.skills).flatMap(x=>x[1]);
const blank=()=>({name:'',alias:'',race:'',humanBonus:'',origin:'',originGrant:'',life:'',lifeGrant:'',class:'',subclass:'',points:{muscle:0,reflex:0,wit:0,savvy:0,spark:0,root:0},skills:[],streetTag:'',gearChoices:{light1:'Knife',light2:'Baton',standard:'Pipe',armor:'Ballistic Vest'},grith:'',notes:'',heritage:{on:false,secondary:'',mark:'',complication:'',registration:'',publicRead:'',subclassFrom:'primary'},affliction:{id:'',stage:'Dormant',aspect:'',adaptation:'',line:'',bane:''}});
let c=blank(), step=0;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function clearDraftStorage(){try{localStorage.removeItem('grakkgrith_character_creator_v2');localStorage.removeItem('grakkgrith_character_creator_v1');}catch(e){}}
function saveDraft(){localStorage.setItem('grakkgrith_character_creator_v2',JSON.stringify(c))}
function loadDraft(){try{const raw=localStorage.getItem('grakkgrith_character_creator_v2')||localStorage.getItem('grakkgrith_character_creator_v1');const x=JSON.parse(raw);if(x)c=Object.assign(blank(),x,{gearChoices:Object.assign(blank().gearChoices,x.gearChoices||{}),heritage:Object.assign(blank().heritage,x.heritage||{}),affliction:Object.assign(blank().affliction,x.affliction||{})})}catch(e){}render()}
function mods(){const r=DATA.races[c.race]||{mods:{}};const m={...r.mods};if(c.race==='Human'&&c.humanBonus)m[c.humanBonus]=(m[c.humanBonus]||0)+1;return m}
/* Mixed Heritage (Ch. 15) and Afflictions (Ch. 20), from data/rules.json */
const MH=(window.GRAKK_RULES||{}).mixedHeritage||{marks:{},mortal:[],complications:[],registrations:[],publicReads:[]};
const AF=(window.GRAKK_RULES||{}).afflictions||{stages:[],startingStages:[],list:{}};
function heritageSecondaries(){return MH.mortal.includes(c.race)?MH.mortal.filter(r=>r!==c.race):[]}
function afflictionDef(){return AF.list[c.affliction.id]||null}
function afflictionAdaptationChoices(){const a=afflictionDef();if(!a||!a.adaptation)return[];if(a.adaptation.choices==='aspect'){const asp=(a.aspects||[]).find(x=>x.name===c.affliction.aspect);return asp?[asp.adaptation]:[]}return a.adaptation.choices}
function afflictionBonus(){const a=afflictionDef();if(!a||AF.stages.indexOf(c.affliction.stage)<1)return{};const ch=afflictionAdaptationChoices();const pick=ch.length===1?ch[0]:c.affliction.adaptation;return pick&&ch.includes(pick)?{[pick]:1}:{}}
function subclassRace(){return c.heritage.on&&c.heritage.subclassFrom==='secondary'&&c.heritage.secondary?c.heritage.secondary:c.race}
function finals(){const m=mods(),b=afflictionBonus(),o={};ATTRS.forEach(a=>o[a]=Math.max(1,1+(c.points[a]||0)+(m[a]||0))+(b[a]||0));return o}
function defense(){return 1+Math.floor(finals().reflex/2)}
function filteredOrigins(){return Object.entries(DATA.origins).filter(([n,o])=>!o.race||o.race===c.race)}
function subclasses(){const cl=DATA.classes[c.class],r=subclassRace();return cl?cl.subclasses.filter(s=>!s.race||s.race===r):[]}
function bg(name,type){return (type==='origin'?DATA.origins:DATA.lives)[name]||{}}
function chosenGrant(type){const name=type==='origin'?c.origin:c.life;const val=type==='origin'?c.originGrant:c.lifeGrant;const d=bg(name,type);return (d.grantOptions||[]).find(x=>x.name===val)||null}
function forcedSkills(){return [chosenGrant('origin'),chosenGrant('life')].filter(x=>x&&x.type==='skill').map(x=>x.name)}
function forcedTags(){return [chosenGrant('origin'),chosenGrant('life')].filter(x=>x&&x.type==='tag').map(x=>x.name)}
function validate(i){
 if(i===0)return c.name.trim()?[]:['Character name is required.'];
 if(i===1){if(!c.race)return['Choose a race.'];const e=[],h=c.heritage,a=afflictionDef();
  if(h.on){if(!heritageSecondaries().length)e.push(`${c.race} ordinarily takes Secondary Heritage only from its own lineage; that needs the GM and a custom Heritage Mark. Turn Mixed Heritage off, or settle it with the GM.`);else{if(!heritageSecondaries().includes(h.secondary))e.push('Choose a Secondary Heritage.');if(!h.mark)e.push('Choose a Heritage Mark.');if(!h.complication)e.push('Choose a Social Complication.');if(!h.registration)e.push('Choose an ACR registration.');if(!h.publicRead)e.push('Choose how the city usually reads you.');}}
  if(a){if(!AF.startingStages.includes(c.affliction.stage))e.push('Choose a starting stage.');if(a.aspects&&!c.affliction.aspect)e.push('Choose a '+c.affliction.id+' Aspect.');if(a.lines){const ln=a.lines.find(x=>x.name===c.affliction.line);if(!ln)e.push('Choose your bloodline.');else if(!ln.banes.includes(c.affliction.bane))e.push('Choose your Bane.');}if(AF.stages.indexOf(c.affliction.stage)>=1&&afflictionAdaptationChoices().length>1&&!afflictionAdaptationChoices().includes(c.affliction.adaptation))e.push('Choose your permanent adaptation.');}
  return e}
 if(i===2){let e=[];if(!c.origin)e.push('Choose an Origin.');const d=bg(c.origin,'origin');if(d.grantOptions?.length&&!c.originGrant)e.push('Choose the Origin skill or tag.');return e}
 if(i===3){let e=[];if(!c.life)e.push('Choose a Life.');const d=bg(c.life,'life');if(d.grantOptions?.length&&!c.lifeGrant)e.push('Choose the Life skill or tag.');return e}
 if(i===4)return c.class&&c.subclass?[]:['Choose a class and subclass.'];
 if(i===5){const total=ATTRS.reduce((s,a)=>s+(c.points[a]||0),0);return total===8?[]:[`Spend exactly 8 Attribute points. ${8-total} remaining.`]}
 if(i===6){const total=new Set([...forcedSkills(),...c.skills]).size;return total===4?[]:[`You need exactly four Novice skills total. Current total: ${total}.`]}
 if(i===7){if(c.class==='Shade')return []; if(forcedTags().length>1)return ['Your backgrounds grant more than one Street Magic Tag. Resolve this with the GM.'];return []}
 if(i===8)return validateGear();
 if(i===9)return c.grith?[]:['Choose a starting Grith.'];
 return []
}
function choiceCards(entries,selected,onpick){return '<div class="choices">'+entries.map(([name,d])=>`<div class="choice ${selected===name?'selected':''}" data-pick="${esc(name)}"><strong>${esc(name)}</strong><div class="desc">${esc(d.desc||d.summary||d.owns||'')}</div></div>`).join('')+'</div>'}
function field(label,id,value,placeholder=''){return `<div><label>${esc(label)}</label><input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function detailCard(d){return `<div class="summary">${d.standing?`<div><b>Standing:</b> ${esc(d.standing)}</div>`:''}${d.contact?`<div><b>Contact:</b> ${esc(d.contact)}</div>`:''}${d.skill?`<div><b>Skill/Tag:</b> ${esc(d.skill)}</div>`:''}${d.signatureTrait?`<div><b>Signature Trait:</b> ${esc(d.signatureTrait)}</div>`:''}${d.hook?`<div><b>Mandatory Hook:</b> ${esc(d.hook)}</div>`:''}${d.obligation?`<div><b>Obligation:</b> ${esc(d.obligation)}</div>`:''}${d.complication?`<div><b>Complication:</b> ${esc(d.complication)}</div>`:''}</div>`}
function render(){
 if(step===9 && !c.grith){const suggestedGrith=bg(c.origin,'origin').grith||bg(c.life,'life').grith||'';if(suggestedGrith)c.grith=suggestedGrith;}
 $('progress').innerHTML=STEPS.map((s,i)=>`<div class="stepDot ${i<step?'done':i===step?'on':''}" title="${s}"></div>`).join('');
 $('nav').innerHTML='<h3>Creation Steps</h3>'+STEPS.map((s,i)=>`<button data-step="${i}" ${i>step?'disabled':''}>${i+1}. ${s}</button>`).join('');
 const out=validate(step);let h=`<h2>${step+1}. ${STEPS[step]}</h2>`;
 if(step===0)h+=`<p class="desc">Give the city something to put on the file. Origin, Life, contacts, Standing, and Grith handle the relationships that matter.</p><div class="grid2">${field('Character Name','name',c.name,'Name')}${field('Alias / Street Name','alias',c.alias,'Optional')}</div>`;
 if(step===1){h+=`<p class="desc">Race modifies Attributes after spending. Penalties cannot reduce a final Attribute below 1.</p>${choiceCards(Object.entries(DATA.races).filter(([n])=>n!=='Custom / Homebrew'),c.race)}`;if(c.race){const d=DATA.raceDetails[c.race]||{},m=mods();h+=`<h3>${esc(c.race)}</h3><div>${ATTRS.map(a=>`<span class="tag">${a} ${m[a]>=0?'+':''}${m[a]||0}</span>`).join('')}</div><p class="desc">${esc(d.summary||'')}</p><div class="summary"><b>Passive:</b> ${esc(d.passive||'—')}<br><b>Active:</b> ${esc(d.active||'—')}<br><b>Resistance:</b> ${esc(d.resistance||'None')} · <b>Vulnerability:</b> ${esc(d.vulnerability||'None')}</div>`;if(c.race==='Human')h+=`<h3>Human +1 Attribute</h3><select id="humanBonus">${ATTRS.map(a=>`<option value="${a}" ${c.humanBonus===a?'selected':''}>${a}</option>`).join('')}</select>`;h+=heritageHtml()+afflictionHtml()}}
 if(step===2){h+=`<p class="desc">Origin is where the city first shaped you. Race-locked Origins only appear when legal.</p>${choiceCards(filteredOrigins(),c.origin)}`;if(c.origin){const d=bg(c.origin,'origin');h+=`<h3>${esc(c.origin)}</h3>${detailCard(d)}${grantPicker('origin',d)}`}}
 if(step===3){h+=`<p class="desc">Life is how you survive now. Every Life is open to every race.</p>${choiceCards(Object.entries(DATA.lives),c.life)}`;if(c.life){const d=bg(c.life,'life');h+=`<h3>${esc(c.life)}</h3>${detailCard(d)}${grantPicker('life',d)}`}}
 if(step===4){h+=`<p class="desc">Every race can take every class. Race-locked subclasses appear only when legal.</p>${choiceCards(Object.entries(DATA.classes),c.class)}`;if(c.class){const cl=DATA.classes[c.class];h+=`<h3>${esc(c.class)}</h3><div class="summary"><b>Owns:</b> ${esc(cl.owns)}<br><b>Primary Attributes:</b> ${esc(cl.primary)}<br><b>${esc(cl.core.name)}:</b> ${esc(cl.core.description)}<br><b>${esc(cl.signature.name)}:</b> ${esc(cl.signature.description)}</div><h3>Subclass</h3>${choiceCards(subclasses().map(x=>[x.name,x]),c.subclass)}`;const sc=subclasses().find(x=>x.name===c.subclass);if(sc)h+=`<div class="summary"><b>${esc(sc.name)}</b>: ${esc(sc.description)}<br><br><b>Tier 1:</b> ${esc(sc.abilities?.[0]?.name||'')} — ${esc(sc.abilities?.[0]?.description||'')}</div>`}}
 if(step===5){const total=ATTRS.reduce((s,a)=>s+(c.points[a]||0),0),m=mods(),f=finals();h+=`<div class="warning ${total===8?'ok':''}">Spent ${total}/8. Maximum 3 points in one Attribute.</div><div class="attrGrid">${ATTRS.map(a=>`<div class="attr"><strong>${a}</strong><div class="value">${f[a]}</div><div class="mods">Base ${1+c.points[a]} · Race ${m[a]>=0?'+':''}${m[a]||0}${afflictionBonus()[a]?' · '+esc(c.affliction.id)+' +1':''}</div><button data-attr="${a}" data-dir="-1">−</button><button data-attr="${a}" data-dir="1" ${(c.points[a]>=3||total>=8)?'disabled':''}>+</button></div>`).join('')}</div><p class="desc">Derived Defense: <b>${defense()}</b> = 1 + half final Reflex, rounded down.</p>`}
 if(step===6){const forced=forcedSkills(),chosen=new Set([...forced,...c.skills]);h+=`<div class="warning ${chosen.size===4?'ok':''}">Novice skills ${chosen.size}/4. Background-granted skills count toward the four.</div><div class="skillDomains">${Object.entries(DATA.skills).map(([dom,[attr,arr]])=>`<div class="domain"><h3>${dom} · ${attr}</h3>${arr.map(s=>`<label class="skillRow"><span>${s}${forced.includes(s)?' <span class="tag">BACKGROUND</span>':''}</span><input type="checkbox" data-skill="${s}" ${chosen.has(s)?'checked':''} ${forced.includes(s)||(!chosen.has(s)&&chosen.size>=4)?'disabled':''}></label>`).join('')}</div>`).join('')}</div>`}
 if(step===7){const tags=forcedTags();if(c.class==='Shade'){c.streetTag='';h+=`<p class="desc">Shade owns full magical practice and does not take a Street Magic Tag. Any tag granted by Origin or Life is superseded by full Shade training and is not added separately.</p><div class="summary"><b>Core:</b> ${esc(DATA.classes.Shade.core.description)}<br><b>Signature:</b> ${esc(DATA.classes.Shade.signature.description)}</div>`;}else{c.streetTag=tags[0]||'';if(tags.length)h+=`<p class="desc">Your background grants this Street Magic Tag automatically.</p><div class="summary"><b>${esc(tags[0])}</b>: ${esc(DATA.streetTags[tags[0]]||'')}</div>`;else h+=`<p class="desc">Your current backgrounds do not grant a Street Magic Tag. No tag is added.</p>`;}}
 if(step===8){h+=gearStepHtml()}
 if(step===9){const suggestion=bg(c.origin,'origin').grith||bg(c.life,'life').grith||'';h+=`<p class="desc">Your starting Grith is your home territory. It uses full Root and carries an obligation.</p><label>Starting Grith</label><select id="grith"><option value="">Choose…</option>${DATA.territories.map(t=>`<option ${c.grith===t?'selected':''}>${t}</option>`).join('')}</select>${suggestion?`<p class="desc">Suggested by background: ${esc(suggestion)}</p>`:''}<label>Notes / Obligation to this place</label><textarea id="notes">${esc(c.notes)}</textarea>`}
 if(step===10)h+=reviewHtml();
 if(out.length)h+=`<div id="validationWarning" class="warning error" style="margin-top:12px">${out.map(esc).join('<br>')}</div>`;
 $('step').innerHTML=h;$('back').disabled=step===0;$('next').textContent=step===10?'Finish & Open Character Sheet':'Next';$('next').disabled=out.length>0;
 bindStep();saveDraft();
}
function opt(v,label,cur){return `<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(label)}</option>`}
function heritageHtml(){const h=c.heritage,secs=heritageSecondaries();let s=`<details class="optional" ${h.on?'open':''}><summary>Optional: Mixed Heritage <span class="tag">GM approval</span></summary><p class="desc">${esc(MH.summary||'')}</p><label class="check"><input type="checkbox" id="hOn" ${h.on?'checked':''}> ${esc(c.race)} is my Primary Species, with a Secondary Heritage</label>`;
 if(h.on){if(!secs.length){s+=`<p class="warning">${esc(MH.compatibilityNote||'')}</p>`}else{
  const marks=(MH.marks[h.secondary]||{}).marks||[];
  s+=`<div class="fieldGrid"><div><label for="hSecondary">Secondary Heritage</label><select id="hSecondary"><option value="">Choose…</option>${secs.map(r=>opt(r,r,h.secondary)).join('')}</select></div>
  <div><label for="hRead">How the city usually reads you</label><select id="hRead"><option value="">Choose…</option>${MH.publicReads.map(r=>opt(r,r,h.publicRead)).join('')}</select></div></div>`;
  if(h.secondary){s+=`<label for="hMark">Heritage Mark (${esc(h.secondary)})</label><select id="hMark"><option value="">Choose…</option>${marks.map(m=>opt(m.name,m.name,h.mark)).join('')}</select>`;const mk=marks.find(m=>m.name===h.mark);if(mk)s+=`<p class="desc">${esc(mk.text)}</p>`;}
  const cp=MH.complications.find(x=>x.name===h.complication),rg=MH.registrations.find(x=>x.name===h.registration);
  s+=`<label for="hComp">Social Complication (required)</label><select id="hComp"><option value="">Choose…</option>${MH.complications.map(x=>opt(x.name,x.name,h.complication)).join('')}</select>${cp?`<p class="desc">${esc(cp.text)}</p>`:''}
  <label for="hReg">ACR registration</label><select id="hReg"><option value="">Choose…</option>${MH.registrations.map(x=>opt(x.name,x.name,h.registration)).join('')}</select>${rg?`<p class="desc">${esc(rg.text)}</p>`:''}`;
  if(h.secondary&&Object.values(DATA.classes).some(cl=>cl.subclasses.some(sc=>sc.race===h.secondary)))s+=`<label for="hSubFrom">Racial subclass eligibility</label><select id="hSubFrom">${opt('primary','From '+c.race+' (Primary)',h.subclassFrom)}${opt('secondary','From '+h.secondary+' instead (GM approval; your Origin and Life must back it)',h.subclassFrom)}</select>`;

async function shareCharacter(){try{const file=new File([characterJson()],characterFileName(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({title:'GRAKKGRITH Character',text:'Save this character JSON, then import it into Player Inventory.',files:[file]});return}downloadCharacter();alert('Direct file sharing is not available in this browser, so the creator used a normal download instead.')}catch(err){if(err&&err.name==='AbortError')return;downloadCharacter();alert('Sharing failed, so the creator used a normal download instead.')} }
async function copyCharacterJson(){try{await navigator.clipboard.writeText(characterJson());alert('Character JSON copied.')}catch(err){const ta=document.createElement('textarea');ta.value=characterJson();document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Character JSON copied.')}}
window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='grakkgrith-reset-creator'){clearDraftStorage();c=blank();step=0;render();}});
$('back').onclick=()=>{if(step>0){step--;render()}};$('next').onclick=()=>{if(validate(step).length)return;if(step<10){step++;render()}else finishCharacter()};$('reset').onclick=()=>{if(confirm('Clear this character draft?')){clearDraftStorage();c=blank();step=0;render()}};$('loadDraft').onclick=loadDraft;render();
</script></body></html>
