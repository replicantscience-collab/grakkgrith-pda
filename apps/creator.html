re"},{"type":"skill","name":"Navigate"}]},"Gang Member":{"grith":"","desc":"You belong to a street crew with territory, hierarchy, and rules that are real whether or not anyone wrote them down.","standing":"Your gang: 4 (Known). The Underground: 3 (Neutral) — crews are respected as a category if not always as individuals. ACW: 2 (Suspect) — they know the name and the territory. Rival gangs in your district: 1 (Hostile) by default.","contact":"Your direct crew lieutenant or a senior member who has been in longer than you. They know the territory, the rivals, and which arrangements with outside factions are currently active. They will back you. They will also call you in.","skill":"Intimidate at Novice OR Streetwise at Novice — you learned one to hold your position.","obligation":"The crew has expectations. Once per session the gang generates a need — a territory dispute, a job, a member in trouble, a message that needs delivering with force behind it. Ignoring it erodes your Standing. The crew does not carry people who do not show up.","complication":"Your gang affiliation is readable — by rivals, by the ACW, by anyone who knows the district. In neutral spaces outside your territory you may be recognized as belonging to a crew before you have said a word. That is sometimes protection and sometimes a target.","grantOptions":[{"type":"skill","name":"Intimidate"},{"type":"skill","name":"Streetwise"}]},"Freelance Thief":{"grith":"","desc":"Independent theft as a profession: no crew loyalty, no fixed employer, no name if you are doing it right.","standing":"The Underground: 3 (Neutral) — freelancers are useful and trusted cautiously. Fences and brokers: 4 (Known) — you need them and they know it and the relationship is professional. Corps and ACW: 2 (Suspect) — not because they know you specifically, but because you are exactly the profile.","contact":"A fence or independent broker who moves what you acquire, no questions on either side. They know your work quality, your reliability, and nothing else about you that you have not chosen to share.","skill":"Stealth at Novice OR Sleight at Novice — the job required one before anything else.","obligation":"A past job left something unresolved — a client who did not receive what they paid for, an item that turned out to be more than it looked, a mark who got a look at your face. Once per arc it resurfaces. Define it at creation.","complication":"Freelance means no protection. No crew to back you, no employer to call, no faction standing to invoke. When a job goes wrong, you handle it alone. The upside is nobody knows your name. The downside is nobody knows your name.","grantOptions":[{"type":"skill","name":"Hideout","legacy":"Stealth"},{"type":"skill","name":"Pickpocket","legacy":"Sleight"}]},"Mercenary":{"grith":"","desc":"Independent combat, security, extraction, or enforcement work sold contract by contract.","standing":"Freelance operator network: 4 (Known) — mercs know each other across faction lines. Bastion Dynamics: 2 (Suspect) — independent operators undercut their contracts and they know it. Underground: 3 (Neutral) — useful, if expensive.","contact":"A fixer or job broker who sources contracts for independent operators. They take a cut. They also know what the work actually involves before you walk into it, which is worth the cut.","skill":"Intimidate at Novice OR Endure at Novice — the work built one.","obligation":"A past contract left a loose end — a client who considers the job unfinished, a target who survived, a payment dispute that did not resolve cleanly. Once per arc it becomes relevant. Define it at creation.","complication":"Independent combat operators are watched. Bastion flags you as a potential liability. Corporate security in high-value areas marks you on sight if your profile is in their system. Working clean keeps you off the list. Working loud puts you on it fast.","grantOptions":[{"type":"skill","name":"Intimidate"},{"type":"skill","name":"Endure"}]},"Underground Enforcer":{"grith":"","desc":"Community-embedded enforcement built on reputation, debt, and unofficial jurisdiction.","standing":"The Underground: 4 (Known) — enforcers are part of the social infrastructure below the official one. Commons factions: 3 (Neutral) — they use you and maintain plausible distance. ACW: 2 (Suspect) — they know what enforcers are even when they cannot prove it.","contact":"The person or faction you primarily work for — a Commons merchant, a community boss, an underground lender. They have work. They also have expectations about how it gets done, because your conduct is their reputation.","skill":"Intimidate at Novice OR Negotiate at Novice — the work requires both and you learned the one that fits how you operate.","obligation":"The community you work in knows you. Once per session someone comes to you with a problem — a debt, a threat, a dispute — that falls inside your unofficial jurisdiction. You can handle it or you can let it go. Letting it go too often means the next person does not come, and the one after that, until the reputation is gone and so is the work.","complication":"Enforcer work exists in a specific community and you are visible in it. Everyone knows what you do, roughly. The ACW cannot always prove it. The people you have leaned on remember. Both of those things follow you when you leave your district.","grantOptions":[{"type":"skill","name":"Intimidate"},{"type":"skill","name":"Negotiate"}]},"Contract Killer":{"grith":"","desc":"You take contracts on lives through brokers and channels built to keep both ends from seeing each other.","standing":"Underground broker network: 4 (Known) — the people who source this work know who is reliable. The Underground broadly: 3 (Neutral) — known as a category, details unconfirmed. ACW: 2 (Suspect) — not because they know, because they suspect anyone this quiet. Corps: variable — some use independent contractors for exactly this work and keep no record of it.","contact":"A broker who sources contracts through a chain of intermediaries long enough that neither end can see the other. The broker knows your work. They do not know your name. That is the arrangement and both parties maintain it.","skill":"Stealth at Novice OR Deceive at Novice — the work requires disappearing before or after, and you chose your preferred order.","obligation":"A past contract was not completed cleanly — the target survived, the wrong person died, the client is unsatisfied, or something was witnessed that should not have been. Once per arc it resurfaces. Define it at creation with the GM. This is not optional. Clean work leaves marks. Unclean work leaves more.","complication":"You maintain a cover identity or a life that does not connect obviously to the work. That cover has weight — people in it, a history, a texture. Once per arc something in the cover life pulls against the work life. The GM may use this without warning.","grantOptions":[{"type":"skill","name":"Deceive"},{"type":"skill","name":"Hideout","legacy":"Stealth"}]},"Corporate Agent":{"grith":"","desc":"A corporate employee who exists off the org chart: handler, salary, resources, and deniable protection.","standing":"Your corporation: 4 (Known — your handler knows exactly who you are and what you have done). A second named corporation: 2 (Suspect) — counter-intelligence runs both directions. The Underground: 2 (Suspect) — people below the official city recognize fixer work even in a suit.","contact":"Your handler — a mid-level corporate officer whose name does not appear on the work you do. They assign, they resource, they insulate. They also have their own agenda inside the corp that occasionally surfaces in what they send you after.","skill":"Deceive at Novice OR Intimidate at Novice — the work requires one before the other and you know which end you lead with.","obligation":"The corp owns your schedule. Once per session your handler has an assignment — surveillance, extraction, containment, a conversation that needs to go a specific way. You can push back. You cannot refuse indefinitely without consequences that are not administered through HR.","complication":"Your cover identity is corporate-issued and professionally maintained. It is also a leash. The corp knows what the cover is, which means they can burn it. Once per arc something you did on assignment creates a record someone inside the corp holds over you — not your handler. Someone else. The corps eat their own when it is efficient.","grantOptions":[{"type":"skill","name":"Intimidate"},{"type":"skill","name":"Deceive"}]}},"streetTags":{"Oath-Touched":"You can sense when a sworn promise is being deliberately broken. Access comes from a binding tradition or background.","Tunnel-Sighted":"You can read darkness, tunnels, and buried routes as meaningful space rather than absence.","Threshold-Schooled":"You know basic threshold rites and can recognize or perform simple protection work.","Ward-Literate":"You can read active wards, recognize their purpose, and assist with ward work.","Illusion-Touched":"You have limited access to minor illusion practice without being a full Shade.","Resonant":"You can feel local magical resonance and when the layer is unusually active."},"skills":{"Force":["Muscle",["Brawl","Melee","Intimidate","Endure","Breach","Haul"]],"Motion":["Reflex",["Dash","Climb","Dodge","Pickpocket","Drive","Ranged"]],"Craft":["Wit",["Repair","Salvage","Medic","Forge","Hack"]],"Social":["Savvy",["Persuade","Deceive","Negotiate","Perform","Streetwise"]],"Arcane":["Spark",["Attune","Cast","Ward","Sense","Disrupt"]],"Territory":["Root",["Navigate","Network","Hideout","Intel","Lay Low"]]},"skillKeys":{"Brawl":"brawl","Melee":"melee","Intimidate":"intimidate","Endure":"endure","Breach":"breach","Haul":"haul","Dash":"dash","Climb":"climb","Dodge":"dodge","Pickpocket":"pickpocket","Drive":"drive","Ranged":"ranged","Repair":"repair","Salvage":"salvage","Medic":"medic","Forge":"forge","Hack":"hack","Persuade":"persuade","Deceive":"deceive","Negotiate":"negotiate","Perform":"perform","Streetwise":"streetwise","Attune":"attune","Cast":"cast","Ward":"ward","Sense":"sense","Disrupt":"disrupt","Navigate":"navigate","Network":"network","Hideout":"hideout","Intel":"intel","Lay Low":"layLow"},"startingLoadouts":{"Wrench":"Tool kit (professional), light weapon, work clothes, medkit (basic), 200 credits","Striker":"Standard weapon, light weapon, medium armor, 150 credits","Ghost":"Light weapon x2, concealment gear, forgery kit (basic), 250 credits","Signal":"Recording device, broadcast kit (portable), light weapon, 200 credits","Shade":"Ritual materials (basic), light weapon, ward components, 175 credits","Broker":"Light weapon, professional clothes, encrypted comm device, 300 credits","Warden":"Standard weapon, medium armor, civic credentials, restraints, 150 credits","Runner":"Light weapon, climbing kit, city map (annotated), courier bag, 225 credits"},"territories":["New Halo","Noble Heights","Grand Grand Academy","Central Core","Market Ring","Ember Court","The Tangle","Three Wires","Low Halo","Old City","The Ashrun","The Sewers","Southern Industrial Belt","Scrapfields","Ash Wastes"]};
const STEPS=['Identity','Race','Origin','Life','Class','Attributes','Skills','Magic','Starting Gear','Territory','Review'];
const ATTRS=['muscle','reflex','wit','savvy','spark','root'];
const ALL_SKILLS=Object.values(DATA.skills).flatMap(x=>x[1]);
const blank=()=>({name:'',alias:'',race:'',humanBonus:'',origin:'',originGrant:'',life:'',lifeGrant:'',class:'',subclass:'',points:{muscle:0,reflex:0,wit:0,savvy:0,spark:0,root:0},skills:[],streetTag:'',gearChoices:{light1:'Knife',light2:'Baton',standard:'Pipe',armor:'Ballistic Vest'},grith:'',notes:''});
let c=blank(), step=0;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function clearDraftStorage(){try{localStorage.removeItem('grakkgrith_character_creator_v2');localStorage.removeItem('grakkgrith_character_creator_v1');}catch(e){}}
function saveDraft(){localStorage.setItem('grakkgrith_character_creator_v2',JSON.stringify(c))}
function loadDraft(){try{const raw=localStorage.getItem('grakkgrith_character_creator_v2')||localStorage.getItem('grakkgrith_character_creator_v1');const x=JSON.parse(raw);if(x)c=Object.assign(blank(),x,{gearChoices:Object.assign(blank().gearChoices,x.gearChoices||{})})}catch(e){}render()}
function mods(){const r=DATA.races[c.race]||{mods:{}};const m={...r.mods};if(c.race==='Human'&&c.humanBonus)m[c.humanBonus]=(m[c.humanBonus]||0)+1;return m}
function finals(){const m=mods(),o={};ATTRS.forEach(a=>o[a]=Math.max(1,1+(c.points[a]||0)+(m[a]||0)));return o}
function defense(){return 1+Math.floor(finals().reflex/2)}
function filteredOrigins(){return Object.entries(DATA.origins).filter(([n,o])=>!o.race||o.race===c.race)}
function subclasses(){const cl=DATA.classes[c.class];return cl?cl.subclasses.filter(s=>!s.race||s.race===c.race):[]}
function bg(name,type){return (type==='origin'?DATA.origins:DATA.lives)[name]||{}}
function chosenGrant(type){const name=type==='origin'?c.origin:c.life;const val=type==='origin'?c.originGrant:c.lifeGrant;const d=bg(name,type);return (d.grantOptions||[]).find(x=>x.name===val)||null}
function forcedSkills(){return [chosenGrant('origin'),chosenGrant('life')].filter(x=>x&&x.type==='skill').map(x=>x.name)}
function forcedTags(){return [chosenGrant('origin'),chosenGrant('life')].filter(x=>x&&x.type==='tag').map(x=>x.name)}
function validate(i){
 if(i===0)return c.name.trim()?[]:['Character name is required.'];
 if(i===1)return c.race?[]:['Choose a race.'];
 if(i===2){let e=[];if(!c.origin)e.push('Choose an Origin.');const d=bg(c.origin,'origin');if(d.grantOptions?.length&&!c.originGrant)e.push('Choose the Origin skill or tag.');return e}
 if(i===3){let e=[];if(!c.life)e.push('Choose a Life.');const d=bg(c.life,'life');if(d.grantOptions?.length&&!c.lifeGrant)e.push('Choose the Life skill or tag.');return e}
 if(i===4)return c.class&&c.subclass?[]:['Choose a class and subclass.'];
 if(i===5){const total=ATTRS.reduce((s,a)=>s+(c.points[a]||0),0);return total===8?[]:[`Spend exactly 8 Attribute points. ${8-total} remaining.`]}
 if(i===6){const total=new Set([...forcedSkills(),...c.skills]).size;return total===4?[]:[`You need exactly four Novice skills total. Current total: ${total}.`]}
 if(i===7){if(c.class==='Shade')return []; if(forcedTags().length>1)return ['Your backgrounds grant more than one Street Magic Tag. Resolve this with the GM.'];return []}
 if(i===8)return validateGear();
 if(i===9)return c.grith?[]:['Choose a starting Grith.'];
 return []
}
function choiceCards(entries,selected,onpick){return '<div class="choices">'+entries.map(([name,d])=>`<div class="choice ${selected===name?'selected':''}" data-pick="${esc(name)}"><strong>${esc(name)}</strong><div class="desc">${esc(d.desc||d.summary||d.owns||'')}</div></div>`).join('')+'</div>'}

}
function makeSummary(){const f=finals();return `${c.name}${c.alias?' ('+c.alias+')':''}\n${c.race} ${c.class} / ${c.subclass}\nOrigin: ${c.origin}\nLife: ${c.life}\nGrith: ${c.grith}\nAttributes: ${ATTRS.map(a=>a+' '+f[a]).join(', ')}\nDefense: ${defense()}\nNovice Skills: ${[...new Set([...forcedSkills(),...c.skills])].join(', ')}\nStarting Loadout: ${startingGearNames().join(', ')}`}
function makeState(){const f=finals(),base={},gear=gearInventory(),pkg=PACKAGE[c.class]||{credits:0};ATTRS.forEach(a=>base[a]=String(1+c.points[a]));const sk={};ALL_SKILLS.forEach(s=>sk[DATA.skillKeys[s]]='0');[...new Set([...forcedSkills(),...c.skills])].forEach(s=>sk[DATA.skillKeys[s]]='1');const o=bg(c.origin,'origin'),l=bg(c.life,'life');return {version:43,character:{name:c.name,alias:c.alias,race:c.race,class:c.class,subclass:c.subclass,origin:c.origin,life:c.life,background:'',grith:c.grith,level:'1',tier:'Street',status:'Capable, locally known'},originDetail:{standing:o.standing||'',contact:o.contact||'',skill:o.skill||'',signatureTrait:o.signatureTrait||'',hook:o.hook||'',obligation:o.obligation||'',complication:o.complication||''},lifeDetail:{standing:l.standing||'',contact:l.contact||'',skill:l.skill||'',hook:l.hook||'',obligation:l.obligation||'',complication:l.complication||''},cityRelations:{[c.grith]:{relationship:'Grith',standing:'3',notes:c.notes||''}},stats:{woundState:'0',stress:'0',condition1:'',condition2:'',heat:'0',...Object.fromEntries(ATTRS.map(a=>[a,String(f[a])]))},skills:sk,coins:{credits:String(pkg.credits||0),debt:'',favorsOwed:'',favorsDue:'',obligations:''},notes:`Starting loadout: ${startingGearNames().join(', ')}${c.notes?'\n'+c.notes:''}`,magic:{streetTag:c.class==='Shade'?'':c.streetTag,streetTagSource:c.streetTag?`${c.origin} / ${c.life}`:'',resonance:'0',location:'',resonanceNote:'',arcaneSkills:{attune:sk.attune||'0',sense:sk.sense||'0',ward:sk.ward||'0',disrupt:sk.disrupt||'0'},knownWorkings:[]},combatFlags:{grazeActive:false},shopStamp:{name:'',icon:''},inventoryRules:{slotLimitsEnabled:true},selected:0,equipment:gear.eq,rollHistory:[],builder:{base,humanBonus:c.humanBonus,customMods:{muscle:'0',reflex:'0',wit:'0',savvy:'0',spark:'0',root:'0'},showLockedSubclasses:false},inventory:gear.inv}}
function characterFileName(){return (c.name||'grakkgrith_character').replace(/[^a-z0-9_-]+/gi,'_')+'_character_backup.json'}
function finishCharacter(){const state=makeState();clearDraftStorage();try{parent.postMessage({type:'grakkgrith-character-complete',state},'*');}catch(e){} }
function characterJson(){return JSON.stringify(makeState(),null,2)}
function downloadCharacter(){const blob=new Blob([characterJson()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=characterFileName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
async function shareCharacter(){try{const file=new File([characterJson()],characterFileName(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({title:'GRAKKGRITH Character',text:'Save this character JSON, then import it into Player Inventory.',files:[file]});return}downloadCharacter();alert('Direct file sharing is not available in this browser, so the creator used a normal download instead.')}catch(err){if(err&&err.name==='AbortError')return;downloadCharacter();alert('Sharing failed, so the creator used a normal download instead.')} }
async function copyCharacterJson(){try{await navigator.clipboard.writeText(characterJson());alert('Character JSON copied.')}catch(err){const ta=document.createElement('textarea');ta.value=characterJson();document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Character JSON copied.')}}
window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='grakkgrith-reset-creator'){clearDraftStorage();c=blank();step=0;render();}});
$('back').onclick=()=>{if(step>0){step--;render()}};$('next').onclick=()=>{if(validate(step).length)return;if(step<10){step++;render()}else finishCharacter()};$('reset').onclick=()=>{if(confirm('Clear this character draft?')){clearDraftStorage();c=blank();step=0;render()}};$('loadDraft').onclick=loadDraft;render();
</script></body></html>
