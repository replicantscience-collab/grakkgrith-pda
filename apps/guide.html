<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sideways Shops: Guides on the Races</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../art/pda-v1/tokens.css">
<style>
/* Sideways PDA art pass: kit tokens (art/pda-v1/tokens.css) + this page's layout.
   Sideways' commentary sits on paper; the rulebook sits in a framed panel, so the two never blur together. */
body.pda-art{margin:0;font-size:16px;background:var(--art-ink) url("../art/pda-v1/assets/ink-tile.svg") repeat}
.pda-art button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.pda-art img{display:block;max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 56px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Masthead: the poster's own header art */
.mast{margin:0 -16px;position:relative;border-bottom:2px solid var(--art-brass-shadow)}
.mast img{width:100%;height:auto}
.greet{display:flex;gap:14px;align-items:center;margin:18px 0 6px}
.greet .bubble{flex:1;max-width:62ch;margin:0;padding:12px 16px;border:2px solid var(--art-magenta);border-radius:16px;background:var(--art-panel);color:var(--art-cream);box-shadow:var(--art-glow)}
.greet .who{display:flex;align-items:center;gap:10px;flex:0 0 auto;color:var(--art-brass);font:400 22px/1 var(--art-title);text-shadow:2px 2px 0 #51213d}
.greet .who img{width:40px;height:40px}
.greet .who small{display:block;margin-top:4px;color:var(--art-muted);font:600 13px/1.2 var(--art-ui);letter-spacing:.06em;text-shadow:none}

/* Card wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:22px 0 10px}
.card{position:relative;aspect-ratio:195/443;overflow:hidden;border:2px solid var(--art-brass-shadow);border-radius:var(--art-radius);background:var(--art-panel);
  box-shadow:0 8px 20px rgba(0,0,0,.45);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.card img{width:100%;height:100%;object-fit:cover}
.card:hover{transform:translateY(-3px);border-color:var(--art-magenta);box-shadow:0 10px 26px rgba(0,0,0,.5),var(--art-glow)}
.card[aria-pressed=true]{border-color:var(--art-cyan);box-shadow:0 0 0 3px rgba(34,218,228,.35),0 10px 26px rgba(0,0,0,.5)}
.card .flag{position:absolute;left:8px;right:8px;bottom:8px;padding:4px 8px;border-radius:6px;background:rgba(10,11,22,.88);color:var(--art-brass);font:600 13px/1.25 var(--art-ui);text-align:center}
/* Fairy, until the re-render */
.card.drawn{display:flex;flex-direction:column;justify-content:flex-end;padding:14px 12px 46px;text-align:center;border-color:var(--art-lime);
  background:radial-gradient(circle at 50% 30%,rgba(154,242,105,.30),transparent 55%),radial-gradient(circle at 30% 70%,rgba(156,104,247,.35),transparent 60%),var(--art-midnight)}
.card.drawn .name{color:var(--art-lime);font:400 32px/1 var(--art-title);text-shadow:0 0 12px rgba(154,242,105,.5)}
.card.drawn .life{margin:10px auto 0;width:100%;padding:6px 8px;border-radius:4px;background:var(--art-parchment);color:#2c1c18;font-size:13px;font-weight:700}
.card.drawn .life small{display:block;font-weight:400;font-size:11px;color:#5b4630}
.divider{height:32px;margin:18px 0;background:url("../art/pda-v1/assets/ornament-divider.svg") center/100% 100% no-repeat}

/* Entry */
.detail{display:none;scroll-margin-top:12px;margin-top:20px}
.detail.open{display:block}
.entry{position:relative;display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:clamp(22px,3.5vw,40px);
  border:2px solid var(--art-brass);border-radius:var(--art-radius);background:linear-gradient(130deg,#1c1428,#0b0c16);
  box-shadow:inset 0 0 0 2px rgba(220,180,117,.2),0 12px 32px rgba(0,0,0,.55),var(--art-glow)}
/* border-image keeps the corner ornaments their real shape however tall the entry gets */
.entry::after{content:"";position:absolute;inset:6px;pointer-events:none;border:30px solid transparent;border-image:url("../art/pda-v1/assets/frame-corners.svg") 90 / 30px / 0 stretch;opacity:.8}
.entry>*{position:relative;z-index:1}
.entry .art{align-self:start}
.entry .art img,.entry .art .card{border-radius:8px;border:2px solid var(--art-brass-shadow)}
.entry .artnote{margin:8px 0 0;color:var(--art-muted);font-size:13px;font-style:italic}
.entry .close{position:absolute;right:12px;top:10px;z-index:2;width:44px;height:44px;border-radius:8px;color:var(--art-brass);font-size:28px;line-height:1}
.entry .close:hover{background:rgba(215,172,97,.12)}
.entry h2{margin:0 44px 4px 0;color:#ffc55f;font:400 clamp(38px,5vw,56px)/1 var(--art-title);text-shadow:3px 4px 0 #48213f}
.entry .life{margin:0 0 16px;color:var(--art-muted)}
.entry .life b{color:var(--art-cream)}

/* Sideways' take: paper, stamped */
.sideways{position:relative;margin:0 0 22px;padding:16px 18px 18px;transform:rotate(-.6deg);border:1px solid #a97f45;border-left:5px solid var(--art-magenta);border-radius:7px;
  background:var(--art-parchment) url("../art/pda-v1/assets/parchment-tile.svg") repeat;color:#2c1c18;box-shadow:inset 0 0 18px rgba(113,70,25,.2),0 8px 20px rgba(0,0,0,.4)}
.sideways .badge{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:999px;background:#26172d;border:1px solid var(--art-magenta);color:#ffe4f4;font:700 13px/1.3 var(--art-ui);letter-spacing:.06em}
.sideways p{margin:0 0 12px;font-size:17px;max-width:58ch}
.sideways .stamp{position:absolute;right:12px;bottom:10px;width:132px;opacity:.85;transform:rotate(-5deg);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0 140px 0 0;list-style:none}
.chips li{padding:2px 10px;border:1.5px solid #6b4b33;border-radius:999px;color:#4a3122;font:600 14px/1.4 var(--art-ui);letter-spacing:.03em}

/* The rulebook: framed, labeled as the source */
.rules h3{margin:22px 0 8px;color:var(--art-brass);font:400 24px/1.1 var(--art-title)}
.rules h3:first-child{margin-top:0}
.source{display:inline-block;margin:0 0 10px;padding:2px 10px;border:1px solid var(--art-cyan);border-radius:999px;color:var(--art-cyan);font:700 12px/1.4 var(--art-ui);letter-spacing:.08em;text-transform:uppercase}
.table{padding:14px 16px;border:1px solid rgba(34,218,228,.35);border-radius:8px;background:rgba(16,21,42,.7)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.stats li{padding:6px 12px;border-radius:6px;background:rgba(239,232,198,.06);font:700 18px/1.2 var(--art-ui);letter-spacing:.03em}
.stats .up{color:var(--art-lime)}.stats .down{color:var(--art-alert)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0 0}
.facts dt{color:var(--art-muted)}
.facts dd{margin:0;font-weight:700}
.ability{margin:8px 0;max-width:64ch;color:var(--art-cream)}
.ability b{display:block;color:#ffe2a8}
.muted{color:var(--art-muted);font-size:14px}
.rules ul.list{margin:4px 0 0;padding-left:20px}
.rules ul.list li{margin:3px 0}
.go{display:inline-block;margin-top:20px;min-height:48px;padding:12px 20px!important;border:1px solid var(--art-magenta)!important;border-radius:6px;
  background:linear-gradient(180deg,#5a1d47,#2a1230)!important;color:#fff!important;font:700 16px/1 var(--art-ui)!important;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 16px rgba(239,70,186,.25)}

/* Notes board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:6px}
.note{padding:16px 18px;border:1px solid #a97f45;border-radius:7px;background:var(--art-parchment) url("../art/pda-v1/assets/parchment-tile.svg") repeat;color:#2c1c18;box-shadow:inset 0 0 18px rgba(113,70,25,.2),0 8px 20px rgba(0,0,0,.45)}
.note:nth-child(1){transform:rotate(-1deg)}.note:nth-child(2){transform:rotate(.7deg)}.note:nth-child(3){transform:rotate(-.5deg)}
.note h2{margin:0 0 8px;color:#5b254e;font:400 24px/1.1 var(--art-title)}
.note ul{margin:0;padding-left:20px}
.note li{margin:4px 0}
.note .sign{margin:10px 0 0;color:#7a2f6a;font:400 20px/1 var(--art-title);text-align:right}
.note.lineage{border-left:5px solid var(--art-violet)}
.note.lineage p{margin:0 0 6px;color:#5b4630}
.foot{margin-top:30px;text-align:center;color:var(--art-muted);font-size:14px}
.foot b{display:block;color:var(--art-magenta);font:400 24px/1.2 var(--art-title)}

@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}.note,.sideways{transform:none!important}}
@media (max-width:700px){
  /* phones: small card thumbnail beside the name, content right below */
  .entry{display:block;padding:20px 16px 24px}
  .entry .art{float:left;width:92px;margin:0 14px 10px 0}
  .entry .artnote{display:none}
  .entry h2{margin-right:40px;font-size:36px}
  .entry .life{font-size:15px}
  .sideways{clear:both}
  .entry::after{border-width:22px;border-image-width:22px}
  .sideways{transform:none}
  .sideways .stamp{position:static;width:120px;margin:12px 0 0 auto}
  .chips{padding-right:0}
  .wall{grid-template-columns:repeat(2,1fr);gap:12px}
  .greet{flex-direction:column;align-items:stretch;gap:10px}
}
</style>
</head>
<body class="pda-art">
<div class="wrap">
  <header class="mast"><img id="mastImg" alt=""><h1 id="title" class="vh"></h1></header>
  <div class="greet"><p class="bubble" id="greeting"></p><div class="who" id="who"></div></div>
  <section class="detail" id="detail" aria-live="polite"></section>
  <section class="wall" id="wall" aria-label="Races"></section>
  <div class="divider" aria-hidden="true"></div>
  <section class="board" id="board"></section>
  <footer class="foot" id="foot"></footer>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ORDER = ['Goblin', 'Orc', 'Human', 'Dwarf', 'Elf', 'Halfling (Fenn)', 'Troll', 'Kobold', 'Cinderfolk', 'Slimefolk', 'Fairy'];
let R, G, open = null;

function statLine(race) {
  const labels = Object.fromEntries(R.attributes.map(a => [a.id, a.label]));
  const mods = R.races[race].mods || {};
  const items = Object.entries(mods).filter(([, v]) => v).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<li class="${v > 0 ? 'up' : 'down'}">${v > 0 ? '+' : '−'}${Math.abs(v)} ${esc(labels[k])}</li>`);
  if (R.races[race].choice) items.push('<li class="up">+1 to any one attribute</li>');
  return items.length ? `<ul class="stats">${items.join('')}</ul>` : '<p class="muted">No attribute changes.</p>';
}
function ability(text) {
  const m = /^([^:]{2,40}):\s*([\s\S]*)$/.exec(text || '');
  return m ? `<p class="ability"><b>${esc(m[1])}</b>${esc(m[2])}</p>` : `<p class="ability">${esc(text)}</p>`;
}
const none = v => !v || /^none\b/i.test(v) ? 'None' : v;

function showRace(race, scroll) {
  open = race;
  document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-pressed', c.dataset.race === race));
  const g = G.races[race], d = R.raceDetails[race];
  const origins = Object.entries(R.origins).filter(([, o]) => o.race === race).map(([n]) => n);
  const anyOrigins = Object.entries(R.origins).filter(([, o]) => !o.race).map(([n]) => n);
  const subs = Object.entries(R.classes).flatMap(([cls, c]) => (c.subclasses || []).filter(s => s.race === race).map(s => `${s.name} (${cls})`));
  const lifeSrc = { poster: 'per the Sideways guide', rulebook: 'per the rulebook', wiki: 'per the Adyta wiki', both: '' }[g.lifespanSource] || '';
  const name = g.cardName || race;
  $('detail').innerHTML = `<article class="entry" aria-labelledby="entryName">
    <button class="close" type="button" id="closeDetail" aria-label="Close ${esc(name)}">×</button>
    <div class="art">${g.card ? `<img src="../${esc(g.card)}" alt="">` : drawnCard(race, g)}${g.artNote ? `<p class="artnote">${esc(g.artNote)}</p>` : ''}</div>
    <div>
      <h2 id="entryName">${esc(name)}</h2>
      <p class="life">Typical lifespan: <b>${esc(g.lifespan || 'Unknown')}</b> ${lifeSrc ? `<span class="muted">(${lifeSrc})</span>` : ''}</p>

      <section class="sideways" aria-label="What Sideways Shops says">
        <span class="badge">Sideways says</span>
        <p>${esc(g.blurb)}</p>
        <ul class="chips" aria-label="Traits">${g.traits.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
        <img class="stamp" src="../art/pda-v1/assets/stamp-unofficial.svg" alt="">
      </section>

      <section class="rules" aria-label="Rules">
        <h3>At the table</h3>
        <span class="source">From the rulebook</span>
        <div class="table">
          ${statLine(race)}
          <dl class="facts"><dt>Resistance</dt><dd>${esc(none(d.resistance))}</dd><dt>Vulnerability</dt><dd>${esc(none(d.vulnerability))}</dd></dl>
        </div>

        <h3>What you can do</h3>
        ${ability(d.passive)}${ability(d.active)}

        <h3>How Adyta treats you</h3>
        <p class="ability">${esc(d.standing)}</p>

        <h3>Where you might come from</h3>
        ${origins.length ? `<ul class="list">${origins.map(o => `<li>${esc(o)}</li>`).join('')}</ul>` : '<p class="muted">No race-specific origins.</p>'}
        <p class="muted">Or any race: ${anyOrigins.map(esc).join(', ')}.</p>
        ${subs.length ? `<h3>Only for ${esc(name)}</h3><ul class="list">${subs.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}

        <h3>The long version</h3>
        <p class="ability">${esc(d.summary)}</p>
      </section>
      <button class="go" type="button" id="buildBtn">Make a character</button>
    </div>
  </article>`;
  $('detail').classList.add('open');
  $('closeDetail').onclick = () => { $('detail').classList.remove('open'); open = null; document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-pressed', 'false')); };
  $('buildBtn').onclick = () => { if (parent !== window) parent.postMessage({ type: 'grakkgrith-open-creator' }, '*'); };
  if (scroll) $('detail').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
function drawnCard(race, g) {
  return `<div class="card drawn" aria-hidden="true"><span class="name">${esc(g.cardName || race)}</span><span class="life">Typical lifespan<br>${esc(g.lifespan)}<small>Card art coming soon</small></span></div>`;
}
function render() {
  $('mastImg').src = '../' + G.art.header; $('mastImg').alt = `${G.publisher.name}: ${G.title}, ${G.subtitle}`;
  $('title').textContent = `${G.publisher.name}: ${G.title}`;
  $('greeting').textContent = 'Tap any card for the full picture: what they\'re like, what they get at the table, and where they come from.';
  $('who').innerHTML = `<img src="../art/pda-v1/assets/sideways-sigil.svg" alt=""><span>${esc(G.publisher.name)}<small>${esc(G.publisher.owners.join(' & '))}, proprietors</small></span>`;
  $('wall').innerHTML = ORDER.filter(r => G.races[r] && R.races[r]).map(r => {
    const g = G.races[r], name = g.cardName || r;
    const label = `${name}. Typical lifespan ${g.lifespan || 'unknown'}. ${g.blurb}`;
    if (!g.card) return `<button class="card drawn" type="button" data-race="${esc(r)}" aria-pressed="false" aria-label="${esc(label)}"><span class="name">${esc(name)}</span><span class="life">Typical lifespan<br>${esc(g.lifespan)}<small>Card art coming soon</small></span></button>`;
    return `<button class="card" type="button" data-race="${esc(r)}" aria-pressed="false" aria-label="${esc(label)}"><img src="../${esc(g.card)}" alt="">${g.artNote ? `<span class="flag">Lifespan: ${esc(g.lifespan)}</span>` : ''}</button>`;
  }).join('');
  document.querySelectorAll('.card').forEach(c => c.onclick = () => showRace(c.dataset.race, true));
  $('board').innerHTML = `
    <div class="note"><h2>${esc(G.tips.title)}</h2><ul>${G.tips.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
    <div class="note"><h2>${esc(G.notes.title)}</h2><ul>${G.notes.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul><p class="sign">${esc(G.notes.signoff)}</p></div>
    <div class="note lineage"><h2>${esc(G.lineageNote.title)}</h2><p>${esc(G.lineageNote.subtitle)}</p><ul>${G.lineageNote.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul><p class="sign">${esc(G.asides[1])}</p></div>`;
  $('foot').innerHTML = `<b>${esc(G.publisher.name)}</b>${esc(G.publisher.tagline)}`;
  const want = decodeURIComponent(location.hash.slice(1));
  if (want && G.races[want]) showRace(want, true);
}
(async () => {
  try {
    [R, G] = await Promise.all([
      window.GRAKK_RULES || fetch('../data/rules.json').then(r => r.json()),
      fetch('../data/guides/races.json').then(r => r.json()),
    ]);
  } catch (e) { document.body.innerHTML = '<p style="padding:20px">The guide could not load its data. Check that data/rules.json and data/guides/races.json exist.</p>'; return; }
  render();
})();
</script>
</body>
</html>
