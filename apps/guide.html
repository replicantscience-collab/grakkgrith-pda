<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sideways Shops: Guides on the Races</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{
  --night:#130c1d; --night2:#1d1329; --shelf:#2b1d3b;
  --neon:#b56cff; --teal:#3fd3c1; --lime:#a8e05a; --amber:#f0b54a;
  --paper:#ecdcb4; --paper2:#e2cc9a; --ink:#2b1e14; --ink2:#5b4630;
  --chalk:#efe7f6; --mute:#a99bb8;
  --marker:'Permanent Marker','Comic Sans MS',cursive;
  --body:'Atkinson Hyperlegible',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--chalk);font:16px/1.5 var(--body)}
body{background:radial-gradient(1200px 600px at 50% -200px,rgba(181,108,255,.18),transparent 70%),var(--night)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}

/* Header: the poster's own masthead does the talking */
.mast{margin:0 -16px;position:relative}
.mast img{width:100%;height:auto}
.mast h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.greet{display:flex;gap:12px;align-items:center;margin:16px 0 4px}
.greet .bubble{position:relative;flex:1;max-width:62ch;margin:0;background:var(--night2);border:2px solid var(--neon);border-radius:18px;padding:10px 16px;font-size:16px}
.greet .bubble::before{content:'';position:absolute;left:-11px;top:18px;border:10px solid transparent;border-right-color:var(--neon);border-left:0}
.greet .who{flex:0 0 auto;font:22px/1 var(--marker);color:var(--neon);text-align:right}
.greet .who small{display:block;font:13px/1.3 var(--body);color:var(--mute);margin-top:4px}

/* Card wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin:22px 0 28px}
.card{position:relative;aspect-ratio:195/443;border-radius:10px;overflow:hidden;background:var(--shelf);
  box-shadow:0 2px 0 rgba(0,0,0,.4);transition:transform .15s ease, box-shadow .15s ease}
.card img{width:100%;height:100%;object-fit:cover}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(181,108,255,.28)}
.card[aria-pressed=true]{box-shadow:0 0 0 3px var(--teal),0 8px 22px rgba(63,211,193,.3)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.card .flag{position:absolute;left:8px;right:8px;bottom:8px;padding:4px 8px;border-radius:6px;background:rgba(19,12,29,.86);color:var(--amber);font-size:12px;line-height:1.3;text-align:center}
/* Fairy, until the re-render: a hand-made card in the same frame language */
.card.drawn{display:flex;flex-direction:column;justify-content:flex-end;padding:14px 12px 46px;text-align:center;
  background:radial-gradient(circle at 50% 30%,rgba(168,224,90,.35),transparent 55%),radial-gradient(circle at 30% 70%,rgba(181,108,255,.35),transparent 60%),var(--night2);
  border:3px solid var(--lime)}
.card.drawn .name{font:34px/1 var(--marker);color:var(--lime);text-shadow:0 0 12px rgba(168,224,90,.5)}
.card.drawn .life{margin:10px auto 0;padding:6px 8px;background:var(--paper);color:var(--ink);border-radius:4px;font-size:13px;font-weight:700;width:100%}
.card.drawn .life small{display:block;font-weight:400;font-size:11px;color:var(--ink2)}

/* Detail: a paper tag pinned to the wall */
.detail{display:none;scroll-margin-top:12px}
.detail.open{display:block}
.tag{position:relative;background:linear-gradient(var(--paper),var(--paper2));color:var(--ink);border-radius:6px;padding:22px 22px 26px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;grid-template-columns:200px 1fr;gap:22px}
.tag::before{content:'';position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--neon);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tag .art{border-radius:8px;overflow:hidden;align-self:start}
.tag h2{margin:0;font:40px/1 var(--marker);color:var(--ink)}
.tag .life{margin:6px 0 12px;color:var(--ink2)}
.tag .life b{color:var(--ink)}
.says{margin:0 0 14px;font-size:17px;max-width:60ch}
.says::before{content:'Sideways says: ';font-family:var(--marker);color:#7a3fb8}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.chips li{padding:2px 10px;border-radius:999px;border:1.5px solid var(--ink2);font-size:13px;color:var(--ink2)}
.tag h3{margin:18px 0 6px;font:20px/1.1 var(--marker);color:#7a3fb8}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.stats li{padding:6px 10px;border-radius:6px;background:rgba(43,30,20,.08);font-weight:700}
.stats .up{color:#1f6b3a}.stats .down{color:#9b2b22}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0}
.facts dt{color:var(--ink2)}
.facts dd{margin:0}
.ability{margin:8px 0;max-width:62ch}
.ability b{display:block}
.muted{color:var(--ink2);font-size:14px}
.tag ul.list{margin:4px 0 0;padding-left:20px}
.tag .go{display:inline-block;margin-top:16px;padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700}
.tag .close{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:8px;font-size:24px;color:var(--ink2)}
.tag .artnote{margin-top:8px;font-size:13px;color:var(--ink2);font-style:italic}

/* Notes board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:30px}
.note{background:var(--paper);color:var(--ink);border-radius:4px;padding:16px 18px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.note:nth-child(1){transform:rotate(-1deg)}.note:nth-child(2){transform:rotate(.8deg)}.note:nth-child(3){transform:rotate(-.5deg)}
@media (prefers-reduced-motion:reduce){.note{transform:none!important}}
.note h2{margin:0 0 8px;font:24px/1.1 var(--marker)}
.note ul{margin:0;padding-left:20px}
.note li{margin:4px 0}
.note .sign{margin:10px 0 0;font:20px/1 var(--marker);color:#7a3fb8;text-align:right}
.note.lineage{background:#efe2f7}
.note.lineage p{margin:0 0 6px;color:var(--ink2)}
.foot{margin-top:28px;text-align:center;color:var(--mute);font-size:14px}
.foot b{display:block;font:22px/1.2 var(--marker);color:var(--neon)}

@media (max-width:700px){
  .tag{grid-template-columns:1fr;padding:20px 16px 22px}
  .tag .art{max-width:180px}
  .tag h2{font-size:34px}
  .wall{grid-template-columns:repeat(2,1fr)}
  .greet{flex-direction:column;align-items:stretch;gap:8px}.greet .who{text-align:left;font-size:19px}
  .greet .bubble::before{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast"><img id="mastImg" alt=""><h1 id="title"></h1></header>
  <div class="greet"><p class="bubble" id="greeting"></p><div class="who" id="who"></div></div>
  <section class="detail" id="detail" aria-live="polite"></section>
  <section class="wall" id="wall" aria-label="Races"></section>
  <section class="board" id="board"></section>
  <footer class="foot" id="foot"></footer>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ORDER = ['Goblin', 'Orc', 'Human', 'Dwarf', 'Elf', 'Halfling (Fenn)', 'Troll', 'Kobold', 'Cinderfolk', 'Slimefolk', 'Fairy'];
let R, G, open = null;

function statLine(race) {
  const labels = Object.fromEntries(R.attributes.map(a => [a.id, a.label]));
  const mods = R.races[race].mods || {};
  const items = Object.entries(mods).filter(([, v]) => v).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<li class="${v > 0 ? 'up' : 'down'}">${v > 0 ? '+' : '−'}${Math.abs(v)} ${esc(labels[k])}</li>`);
  if (R.races[race].choice) items.push('<li class="up">+1 to any one attribute</li>');
  return items.length ? `<ul class="stats">${items.join('')}</ul>` : '<p class="muted">No attribute changes.</p>';
}
function ability(text) {
  const m = /^([^:]{2,40}):\s*([\s\S]*)$/.exec(text || '');
  return m ? `<p class="ability"><b>${esc(m[1])}</b>${esc(m[2])}</p>` : `<p class="ability">${esc(text)}</p>`;
}
const none = v => !v || /^none\b/i.test(v) ? 'None' : v;

function showRace(race, scroll) {
  open = race;
  document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-pressed', c.dataset.race === race));
  const g = G.races[race], d = R.raceDetails[race];
  const origins = Object.entries(R.origins).filter(([, o]) => o.race === race).map(([n]) => n);
  const anyOrigins = Object.entries(R.origins).filter(([, o]) => !o.race).map(([n]) => n);
  const subs = Object.entries(R.classes).flatMap(([cls, c]) => (c.subclasses || []).filter(s => s.race === race).map(s => `${s.name} (${cls})`));
  const lifeSrc = { poster: 'per the Sideways guide', rulebook: 'per the rulebook', wiki: 'per the Adyta wiki', both: '' }[g.lifespanSource] || '';
  const name = g.cardName || race;
  $('detail').innerHTML = `<article class="tag">
    <button class="close" type="button" id="closeDetail" aria-label="Close ${esc(name)}">×</button>
    <div class="art">${g.card ? `<img src="../${esc(g.card)}" alt="">` : drawnCard(race, g)}${g.artNote ? `<p class="artnote">${esc(g.artNote)}</p>` : ''}</div>
    <div>
      <h2>${esc(name)}</h2>
      <p class="life">Typical lifespan: <b>${esc(g.lifespan || 'Unknown')}</b> ${lifeSrc ? `<span class="muted">(${lifeSrc})</span>` : ''}</p>
      <p class="says">${esc(g.blurb)}</p>
      <ul class="chips">${g.traits.map(t => `<li>${esc(t)}</li>`).join('')}</ul>

      <h3>At the table</h3>
      ${statLine(race)}
      <dl class="facts"><dt>Resistance</dt><dd>${esc(none(d.resistance))}</dd><dt>Vulnerability</dt><dd>${esc(none(d.vulnerability))}</dd></dl>

      <h3>What you can do</h3>
      ${ability(d.passive)}${ability(d.active)}

      <h3>How Adyta treats you</h3>
      <p class="ability">${esc(d.standing)}</p>

      <h3>Where you might come from</h3>
      ${origins.length ? `<ul class="list">${origins.map(o => `<li>${esc(o)}</li>`).join('')}</ul>` : '<p class="muted">No race-specific origins.</p>'}
      <p class="muted">Or any race: ${anyOrigins.map(esc).join(', ')}.</p>
      ${subs.length ? `<h3>Only for ${esc(name)}</h3><ul class="list">${subs.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}

      <h3>The long version</h3>
      <p class="ability">${esc(d.summary)}</p>
      <button class="go" type="button" id="buildBtn">Make a character</button>
    </div>
  </article>`;
  $('detail').classList.add('open');
  $('closeDetail').onclick = () => { $('detail').classList.remove('open'); open = null; document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-pressed', 'false')); };
  $('buildBtn').onclick = () => { if (parent !== window) parent.postMessage({ type: 'grakkgrith-open-creator' }, '*'); };
  if (scroll) $('detail').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
function drawnCard(race, g) {
  return `<div class="card drawn" aria-hidden="true"><span class="name">${esc(g.cardName || race)}</span><span class="life">Typical lifespan<br>${esc(g.lifespan)}<small>Card art coming soon</small></span></div>`;
}
function render() {
  $('mastImg').src = '../' + G.art.header; $('mastImg').alt = `${G.publisher.name}: ${G.title}, ${G.subtitle}`;
  $('title').textContent = `${G.publisher.name}: ${G.title}`;
  $('greeting').textContent = 'Tap any card for the full picture: what they\'re like, what they get at the table, and where they come from.';
  $('who').innerHTML = `${esc(G.publisher.name)}<small>${esc(G.publisher.owners.join(' & '))}, proprietors</small>`;
  $('wall').innerHTML = ORDER.filter(r => G.races[r] && R.races[r]).map(r => {
    const g = G.races[r], name = g.cardName || r;
    const label = `${name}. Typical lifespan ${g.lifespan || 'unknown'}. ${g.blurb}`;
    if (!g.card) return `<button class="card drawn" type="button" data-race="${esc(r)}" aria-pressed="false" aria-label="${esc(label)}"><span class="name">${esc(name)}</span><span class="life">Typical lifespan<br>${esc(g.lifespan)}<small>Card art coming soon</small></span></button>`;
    return `<button class="card" type="button" data-race="${esc(r)}" aria-pressed="false" aria-label="${esc(label)}"><img src="../${esc(g.card)}" alt="">${g.artNote ? `<span class="flag">Lifespan: ${esc(g.lifespan)}</span>` : ''}</button>`;
  }).join('');
  document.querySelectorAll('.card').forEach(c => c.onclick = () => showRace(c.dataset.race, true));
  $('board').innerHTML = `
    <div class="note"><h2>${esc(G.tips.title)}</h2><ul>${G.tips.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
    <div class="note"><h2>${esc(G.notes.title)}</h2><ul>${G.notes.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul><p class="sign">${esc(G.notes.signoff)}</p></div>
    <div class="note lineage"><h2>${esc(G.lineageNote.title)}</h2><p>${esc(G.lineageNote.subtitle)}</p><ul>${G.lineageNote.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul><p class="sign">${esc(G.asides[1])}</p></div>`;
  $('foot').innerHTML = `<b>${esc(G.publisher.name)}</b>${esc(G.publisher.tagline)}`;
  const want = decodeURIComponent(location.hash.slice(1));
  if (want && G.races[want]) showRace(want, true);
}
(async () => {
  try {
    [R, G] = await Promise.all([
      window.GRAKK_RULES || fetch('../data/rules.json').then(r => r.json()),
      fetch('../data/guides/races.json').then(r => r.json()),
    ]);
  } catch (e) { document.body.innerHTML = '<p style="padding:20px">The guide could not load its data. Check that data/rules.json and data/guides/races.json exist.</p>'; return; }
  render();
})();
</script>
</body>
</html>
