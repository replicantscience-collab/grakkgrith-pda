<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mail and Bills</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../art/pda-v1/tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--art-ink) url("../art/pda-v1/assets/ink-tile.svg") repeat;color:var(--art-cream);font:16px/1.45 var(--art-body)}
button{font:700 15px/1.15 var(--art-ui);letter-spacing:.05em;text-transform:uppercase;min-height:44px;padding:9px 14px;border:1px solid var(--art-cyan);border-radius:6px;background:#10152a;color:var(--art-cyan);cursor:pointer;box-shadow:inset 0 0 12px rgba(34,218,228,.12)}
button:hover:not(:disabled){background:#1e2c3a}
button:disabled{opacity:.42;cursor:default}
button.primary{border-color:var(--art-magenta);background:linear-gradient(180deg,#5a1d47,#2a1230);color:#fff}
button.ghost{border-color:rgba(118,80,45,.9);color:var(--art-cream);background:rgba(10,11,22,.7);box-shadow:none}
:focus-visible{outline:var(--art-focus);outline-offset:2px}
select{min-height:44px;width:100%;padding:8px 10px;border:1px solid rgba(118,80,45,.9);border-radius:6px;background:#0b0c16;color:var(--art-cream);font:16px var(--art-body)}
label{display:block;margin:10px 0 4px;color:var(--art-cyan);font:700 13px/1.2 var(--art-ui);letter-spacing:.08em;text-transform:uppercase}
.wrap{max-width:1100px;margin:0 auto;padding:16px clamp(12px,3vw,28px) 56px}
h1{margin:0;color:#ffc55f;font:400 clamp(34px,5vw,52px)/1 var(--art-title);text-shadow:3px 4px 0 #48213f}
h2{margin:0 0 10px;color:var(--art-brass);font:400 26px/1.1 var(--art-title);text-shadow:2px 2px 0 #51213d}
.kicker{color:var(--art-cyan);font:700 13px/1.2 var(--art-ui);letter-spacing:.12em;text-transform:uppercase}
.muted{color:var(--art-muted)}
.frame{border:2px solid var(--art-brass-shadow);border-radius:var(--art-radius);background:linear-gradient(130deg,#1c1428,#0b0c16);box-shadow:inset 0 0 0 1px rgba(220,180,117,.18),0 8px 22px rgba(0,0,0,.45);padding:18px 20px;margin-top:16px}
/* status strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:stretch;margin-top:14px}
.stat{padding:10px 12px;border:1px solid rgba(118,80,45,.85);border-radius:8px;background:rgba(10,11,22,.8)}
.stat b{display:block;color:var(--art-cyan);font:700 12px/1.2 var(--art-ui);letter-spacing:.1em;text-transform:uppercase}
.stat span{display:block;margin-top:2px;color:#ffc55f;font:400 24px/1.1 var(--art-title);font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--art-muted);font-size:13px}
.stat.warn span{color:#ff9aa1}
/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:16px;align-items:start}
/* letters */
.letter{position:relative;margin:0 0 14px;padding:16px 18px;border:1px solid #a97f45;border-left:6px solid var(--art-brass);border-radius:7px;background:var(--art-parchment) url("../art/pda-v1/assets/parchment-tile.svg") repeat;color:#2c1c18;box-shadow:inset 0 0 18px rgba(113,70,25,.2),0 8px 20px rgba(0,0,0,.4)}
.letter.notice{border-left-color:#7a2f6a}
.letter.crisis{border-left-color:#b8222e;box-shadow:0 0 0 2px rgba(252,108,116,.55),0 8px 22px rgba(0,0,0,.5)}
.letter .from{color:#7a2f6a;font:700 12px/1.2 var(--art-ui);letter-spacing:.12em;text-transform:uppercase}
.letter h3{margin:3px 0 6px;color:#3a1730;font:400 25px/1.1 var(--art-title)}
.letter p{margin:6px 0}
.letter .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:#5b4630;font-size:14px}
.letter .meta b{color:#3a1730}
.due{display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid #7a2f6a;color:#7a2f6a;font:700 12px/1.5 var(--art-ui);letter-spacing:.06em;text-transform:uppercase}
.due.late{border-color:#b8222e;color:#b8222e}
.lines{width:100%;border-collapse:collapse;margin:6px 0}
.lines td{padding:4px 0;border-bottom:1px dashed rgba(107,75,51,.4)}
.lines td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.lines tr.total td{border-bottom:0;font-weight:700;color:#3a1730}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.letter button{background:#1a1424;color:#fff;border-color:#3a1730;box-shadow:none}
.letter button.primary{background:linear-gradient(180deg,#5a1d47,#2a1230);border-color:#5a1d47}
.letter button.ghost{background:transparent;color:#3a1730;border-color:#8a6a48}
.roll{margin-top:8px;font-size:14px;color:#3a1730}
.die{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:3px;border:1px solid #8a6a48;border-radius:5px;font:700 14px var(--art-ui);background:rgba(255,248,230,.6)}
.die.hit{background:#3a1730;color:#fff;border-color:#3a1730}
.stamp{position:absolute;top:12px;right:14px;padding:2px 10px;border:2px solid currentColor;border-radius:5px;transform:rotate(-6deg);font:700 14px/1.3 var(--art-ui);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.stamp.paid,.stamp.voided,.stamp.answered{color:#2f6a2a}.stamp.unpaid,.stamp.escalated{color:#b8222e}.stamp.flagged{color:#7a2f6a}
.empty{padding:18px;border:1px dashed rgba(215,172,97,.5);border-radius:8px;color:var(--art-muted)}
details.filed{margin-top:12px}
details.filed summary{min-height:44px;display:flex;align-items:center;color:var(--art-brass);font:700 15px var(--art-ui);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
details.filed .letter{opacity:.82}
/* side */
.debt{padding:12px 14px;margin-bottom:10px;border:1px solid var(--art-alert);border-radius:8px;background:rgba(252,108,116,.07)}
.debt b{color:#ffc2c6}
.ledger{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.ledger li{padding:7px 0;border-bottom:1px solid rgba(118,80,45,.35);font-size:14px}
.ledger time{display:block;color:var(--art-cyan);font:700 11px var(--art-ui);letter-spacing:.08em;text-transform:uppercase}
.total{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(215,172,97,.4);font:700 17px var(--art-ui);letter-spacing:.04em}
.total span{color:#ffc55f}
.note{font-size:13px;color:var(--art-muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(92vw,520px);padding:12px 16px;border:1px solid var(--art-magenta);border-radius:var(--art-radius);background:var(--art-panel);color:var(--art-cream);box-shadow:0 16px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:860px){.cols{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>button{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body class="pda-art">
<div class="wrap">
  <div class="kicker">ADYTA PDA / INBOX</div>
  <h1>Mail &amp; Bills</h1>
  <p class="muted" id="who">The city sends its paperwork on Adyta time.</p>
  <div class="strip" id="strip"></div>
  <div class="cols">
    <section class="frame" aria-labelledby="mailH"><h2 id="mailH">Mail</h2><div id="mail"></div></section>
    <aside>
      <section class="frame" aria-labelledby="debtH"><h2 id="debtH">Debt</h2><div id="debts"></div></section>
      <section class="frame" aria-labelledby="costH"><h2 id="costH">Weekly costs</h2><div id="costs"></div></section>
      <section class="frame" aria-labelledby="logH"><h2 id="logH">Ledger</h2><ul class="ledger" id="log"></ul></section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./week.js"></script>
<script>
'use strict';
const KEY = 'grakkgrith_character_tool_v8_state';
const WK = window.GRAKK_WEEK, $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let W = null, CLOCK = null;
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} try { parent.postMessage({ type: 'grakkgrith-week-changed' }, '*'); } catch (e) {} };
const now = () => WK.adytaNow(CLOCK, Date.now());
const hasChar = s => !!(s && s.character && String(s.character.name || '').trim());
function toast(msg, dice) { const t = $('toast'); t.innerHTML = esc(msg) + (dice ? `<div style="margin-top:6px">${diceHtml(dice)}</div>` : ''); t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 4200); }
const diceHtml = d => d.map(x => `<span class="die ${x >= 5 ? 'hit' : ''}">${x}</span>`).join('');

/* Read fresh, change, save: the sheet or Explore may have saved since this screen last looked. */
function act(fn) { const s = load(); if (!hasChar(s)) return; WK.settle(s, W, CLOCK, Date.now()); const r = fn(s); save(s); render(); return r; }

function letterHtml(m, open) {
  const t = now(), late = m.due != null && m.due <= t;
  const dueTag = m.due != null && open ? `<span class="due ${late ? 'late' : ''}">${esc(WK.untilText(m.due - t))}</span>` : '';
  const stamp = !open ? `<span class="stamp ${esc(m.status)}">${esc(m.status)}</span>` : '';
  let body = '';
  if (m.kind === 'bill') body = `<table class="lines">${m.lines.map(l => `<tr><td>${esc(l.name)}</td><td>${l.credits}</td></tr>`).join('')}<tr class="total"><td>Total</td><td>${m.total} cr</td></tr></table><p class="meta"><span>Due <b>${esc(WK.fmt(m.due))}</b></span><span>Unpaid becomes Debt with <b>${esc(m.creditor)}</b></span></p>`;
  else body = `<p>${esc(m.body)}</p><div class="meta">${m.fine ? `<span>Fee <b>${m.fine} cr</b></span>` : ''}${m.due ? `<span>Respond by <b>${esc(WK.fmt(m.due))}</b></span>` : '<span><b>Lands before the next session ends</b> unless disrupted</span>'}${m.why ? `<span>${esc(m.why)}</span>` : ''}</div>`;
  const rolls = [m.appealRoll && `APA appeal: ${diceHtml(m.appealRoll.dice)} ${m.appealRoll.hits}/${m.appealRoll.need}`, m.checkRoll && `${esc(m.check.label)}: ${diceHtml(m.checkRoll.dice)} ${m.checkRoll.hits}/${m.checkRoll.need}`].filter(Boolean).map(x => `<div class="roll">${x}</div>`).join('');
  let buttons = '';
  if (open) {
    if (m.kind === 'bill') buttons = `<button class="primary" data-pay="${m.id}">Pay ${m.total} cr</button>`;
    else if (m.kind === 'crisis') buttons = `<button class="primary" data-flag="${m.id}">Flag it for the session</button>`;
    else {
      if (m.fine) buttons += `<button class="primary" data-pay="${m.id}">Pay ${m.fine} cr</button>`;
      if (m.check) buttons += `<button data-answer="${m.id}">${esc(m.check.label)}</button>`;
      if (m.appeal && !m.appealed) buttons += `<button class="ghost" data-appeal="${m.id}">File with the APA</button>`;
    }
    if (m.kind === 'notice') buttons += `<span class="note" style="color:#5b4630;align-self:center">Ignore it and it comes back worse.</span>`;
  }
  return `<article class="letter ${esc(m.kind)}" aria-label="${esc(m.title)}">${stamp}<div class="from">${esc(m.from)}</div><h3>${esc(m.title)}</h3>${dueTag}${body}${rolls}${buttons ? `<div class="actions">${buttons}</div>` : ''}</article>`;
}

function render() {
  const s = load();
  if (!hasChar(s)) { $('who').textContent = 'No character yet. Make one in Character Setup and the city will find your address.'; ['strip', 'mail', 'debts', 'costs', 'log'].forEach(id => $(id).innerHTML = ''); return; }
  const w = WK.ensure(s), t = now(), heat = Number(s.stats?.heat || 0), band = W.heatBands.find(b => b.id === WK.band(W, heat));
  $('who').textContent = `${s.character.name}'s inbox. Rent runs on Adyta time, weekly from Monday.`;
  const owed = WK.owed(s);
  $('strip').innerHTML = `<div class="stat"><b>Adyta</b><span id="clockNow">${esc(WK.fmt(t))}</span><small>Week rolls Monday 00:00</small></div>
    <div class="stat"><b>Credits</b><span>${esc(s.coins?.credits || 0)}</span><small>${WK.weeklyTotal(W, w)} cr a week</small></div>
    <div class="stat ${heat >= 4 ? 'warn' : ''}"><b>Heat ${heat}</b><span>${esc(band.name)}</span><small>${esc(band.rule.split('.')[0])}.</small></div>
    <div class="stat ${owed ? 'warn' : ''}"><b>Debt</b><span>${owed} cr</span><small>${owed ? '1 Stress each session' : 'Clear'}</small></div>
    <button class="ghost" id="sessionBtn" title="Applies the rulebook's start-of-session effects">Session starting</button>`;
  const open = w.mail.filter(m => m.status === 'open'), closed = w.mail.filter(m => m.status !== 'open').slice(0, 20);
  open.sort((a, b) => (a.kind === 'crisis' ? -1 : 0) - (b.kind === 'crisis' ? -1 : 0) || (a.due ?? Infinity) - (b.due ?? Infinity));
  $('mail').innerHTML = (open.length ? open.map(m => letterHtml(m, true)).join('') : `<div class="empty">Nothing waiting. ${heat >= 2 ? 'Give it time.' : 'Keep your Heat low and it stays that way.'}</div>`)
    + (closed.length ? `<details class="filed"><summary>Filed (${closed.length})</summary>${closed.map(m => letterHtml(m, false)).join('')}</details>` : '');
  $('debts').innerHTML = w.debts.length ? w.debts.map(d => `<div class="debt"><b>${d.amount} cr</b> to ${esc(d.creditor)}<div class="note">${esc(d.why || '')}${d.standingHit ? ` · Standing -1 in ${esc(d.standingHit)}` : ''}</div><div class="actions"><button class="primary" data-debt="${d.id}">Pay it off</button>${d.amount > 50 ? `<button class="ghost" data-debt50="${d.id}">Pay 50</button>` : ''}</div></div>`).join('')
    + `<p class="note">${esc(W.week.debt)}</p>` : `<p class="muted">You don't owe anyone. Yet.</p>`;
  const opt = (list, cur) => list.map(x => `<option value="${esc(x.id)}" ${x.id === cur ? 'selected' : ''}>${esc(x.name)} · ${x.credits} cr</option>`).join('');
  $('costs').innerHTML = `<label for="cHousing">Housing</label><select id="cHousing">${opt(W.week.housing, w.housing)}</select>
    <label for="cGear">Equipment maintenance</label><select id="cGear">${opt(W.week.gear, w.gear)}</select>
    <label for="cChrome">Cybernetic upkeep</label><select id="cChrome">${opt(W.week.chrome, w.chrome)}</select>
    <div class="total"><b>Food and supplies</b><span>${W.week.food.credits} cr</span></div>
    <div class="total"><b>Each week</b><span>${WK.weeklyTotal(W, w)} cr</span></div>
    <p class="note">From the rulebook's Cost of Living table. Changes apply from next week's bill.</p>`;
  $('log').innerHTML = w.log.slice(0, 30).map(l => `<li><time>${esc(WK.fmt(l.at))}</time>${esc(l.text)}</li>`).join('') || '<li class="muted">Nothing yet.</li>';
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = now();
  if (b.dataset.pay) { const r = act(s => WK.pay(s, b.dataset.pay, t)); r && toast(r.msg); }
  else if (b.dataset.appeal) { const r = act(s => WK.appeal(s, W, b.dataset.appeal, t)); r && toast(r.msg, r.dice); }
  else if (b.dataset.answer) { const r = act(s => WK.answer(s, b.dataset.answer, t)); r && toast(r.msg, r.dice); }
  else if (b.dataset.flag) { act(s => WK.acknowledgeCrisis(s, b.dataset.flag, t)); toast('Flagged. Whoever runs the next session will see it.'); }
  else if (b.dataset.debt) { const r = act(s => WK.payDebt(s, b.dataset.debt, t)); r && toast(r.msg); }
  else if (b.dataset.debt50) { const r = act(s => WK.payDebt(s, b.dataset.debt50, t, 50)); r && toast(r.msg); }
  else if (b.id === 'sessionBtn') { const r = act(s => WK.sessionStart(s, t)); r && toast(r.stress ? 'Debt pressure: Stress +1.' : 'Session started. No debt pressure.'); }
});
document.addEventListener('change', e => {
  const map = { cHousing: 'housing', cGear: 'gear', cChrome: 'chrome' }, k = map[e.target.id]; if (!k) return;
  act(s => WK.setCosts(s, { [k]: e.target.value })); toast('Updated. It shows on next week\'s bill.');
});

Promise.all([fetch('../data/week.json').then(r => r.json()), fetch('../data/places.json').then(r => r.json())]).then(([w, p]) => {
  W = w; CLOCK = p.clock;
  const s = load(); if (hasChar(s)) { WK.settle(s, W, CLOCK, Date.now()); save(s); }
  render();
  window.GRAKK_WEEK_READY = true;
  setInterval(() => { const c = $('clockNow'); if (c) c.textContent = WK.fmt(now()); }, 15000);
  setInterval(() => { const s = load(); if (hasChar(s) && WK.settle(s, W, CLOCK, Date.now()).length) { save(s); render(); } }, 60000);
});
</script>
</body>
</html>
